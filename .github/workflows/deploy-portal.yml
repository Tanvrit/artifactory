name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'manifests/**'
      - 'functions/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    # Portable Node/Next.js/Pages work uses the existing Linux ARM64 pool
    # (owner routing instruction, 2026-11-10). The locked SWC/sharp closure
    # includes Linux ARM64; this job has no Xcode or native packaging requirement.
    # Repository access, production approval and deployment credentials remain unchanged.
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, ARM64]
    # A job that cannot be scheduled, or that wedges mid-build, must fail fast and
    # loud rather than masquerade as "in progress" for a day. Observed comparable
    # Next.js release builds in the fleet run 2-17 min (52 min worst case); 30 leaves
    # generous headroom while still bounding a hang.
    timeout-minutes: 30
    # R24: Deploys artifacts.tanvrit.com portal to Cloudflare Pages production.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # The persistent runner already retains npm's local cache. Uploading its
          # shared 23 GB cache after a deploy can exhaust this job's time budget.
          package-manager-cache: false

      - name: Install dependencies
        run: cd portal && npm ci

      - name: Build Next.js
        run: cd portal && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ce3f0ef57641c98d52af95c069bbb6a2
          command: pages deploy portal/out --project-name tanvrit-artifacts-portal --commit-dirty=true
