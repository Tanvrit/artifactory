name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'manifests/**'
      - 'functions/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on:
      group: tanvrit
      # Linux self-hosted runner down 2026-07 — macOS fallback; revert to [Linux] when it's back
      labels: [macos]
    # Self-hosted runner required: local npm + wrangler cache; artifacts.tanvrit.com
    # portal portal build takes ~12min on ubuntu-latest without cache warmth.
    # R24: Deploys artifacts.tanvrit.com portal to Cloudflare Pages production.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: cd portal && npm ci

      - name: Build Next.js
        run: cd portal && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ce3f0ef57641c98d52af95c069bbb6a2
          command: pages deploy portal/out --project-name tanvrit-artifacts-portal --commit-dirty=true
