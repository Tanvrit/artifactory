# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish Android signed APK + AAB
#
# Caller example:
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-android-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         gradle_module: composeApp
#         application_id: com.tanvrit.friendly
#         package_name: com.friendly
#         play_track: 'internal'   # internal | alpha | beta | production
#       secrets: inherit
#
# Produces:
#   <product>-<version>-android.apk + .sha256
#   <product>-<version>-android.aab + .sha256
#
# Signing: activates when ANDROID_SIGNING_KEYSTORE secret is present.
# Without it, the build still runs (debug-signed) — the artifact ships
# but cannot be installed on devices that require release signing or
# uploaded to the Play Store.
#
# Play Store upload: gated on PLAY_STORE_SERVICE_ACCOUNT_JSON. Without
# it, the APK + AAB land in GitHub Releases + R2 and an engineer
# manually uploads via Play Console.
#
# Graceful-skip guard: no androidTarget() in composeApp/build.gradle.kts
# → exit 0 with skip notice.
# ─────────────────────────────────────────────────────────────

name: Release Android (Reusable)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      gradle_module:
        type: string
        required: true
        default: 'composeApp'
      application_id:
        description: 'Android application ID (e.g. com.tanvrit.friendly)'
        type: string
        required: true
      package_name:
        type: string
        required: true
      play_track:
        description: 'Play Store track for upload (internal | alpha | beta | production)'
        type: string
        required: false
        default: 'internal'
      release_notes:
        type: string
        required: false
        default: ''
      release_notes_hi:
        type: string
        required: false
        default: ''
      runner_labels:
        description: >-
          JSON array of self-hosted runner labels (within the "tanvrit" group) the
          job may run on. Default ["Linux"] keeps the historical behaviour. Pass
          ["self-hosted"] to let macOS self-hosted runners pick up the Android build
          when the Linux runner is busy/offline (labels are AND-matched, so the
          shared "self-hosted" label is the only way to allow either OS). The
          Android/Gradle build runs on macOS too, so it is a safe fallback.
        type: string
        required: false
        default: '["Linux"]'
    secrets:
      ANDROID_SIGNING_KEYSTORE:
        description: 'Base64-encoded .jks keystore'
        required: false
      ANDROID_SIGNING_KEYSTORE_PASSWORD:
        required: false
      ANDROID_SIGNING_KEY_ALIAS:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        description: 'Google Play Console service-account JSON — when set, APK/AAB uploaded to the named play_track'
        required: false
      ARTIFACTS_REPO_TOKEN:
        description: 'When absent, GitHub Release upload + manifest dispatch are skipped.'
        required: false
      CF_ACCOUNT_ID:
        description: 'Cloudflare account id for the R2 S3 endpoint. The R2 mirror step now FAILS LOUDLY when this or the R2 key pair is absent — update-manifest publishes an r2_url for every release regardless, so a skipped mirror ships a manifest whose download link 404s.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Fallback for CF_ACCOUNT_ID (same value; the name several repos already carry).'
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  build-android:
    name: Android (signed APK + AAB)
    runs-on:
      group: tanvrit
      labels: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        shell: bash
        run: |
          # Resolve the module's filesystem dir. Normally the gradle module path maps
          # 1:1 to a directory (`ui:ui-android` -> `ui/ui-android`), but a module can be
          # aliased to a different dir in settings.gradle.kts, e.g.
          # `project(":composeApp").projectDir = file("app")` (school). Honor the alias so
          # the guard + artifact-output paths don't silently skip an aliased module.
          MODULE_DIR="$(echo '${{ inputs.gradle_module }}' | tr ':' '/')"
          if [ ! -f "$MODULE_DIR/build.gradle.kts" ] && [ -f settings.gradle.kts ]; then
            ALIAS_DIR="$(grep -E "project\(\":?${{ inputs.gradle_module }}\"\)\.projectDir" settings.gradle.kts | sed -E 's/.*file\("([^"]+)"\).*/\1/' | head -1)"
            if [ -n "$ALIAS_DIR" ] && [ -f "$ALIAS_DIR/build.gradle.kts" ]; then
              MODULE_DIR="$ALIAS_DIR"
              echo "::notice::resolved aliased module ${{ inputs.gradle_module }} -> $MODULE_DIR"
            fi
          fi
          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          BUILD_FILE="$MODULE_DIR/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then
            echo "::notice::skipped: $BUILD_FILE not found for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE 'androidTarget\s*\{|androidTarget\(\)|^\s*android\s*\{' "$BUILD_FILE"; then
            echo "::notice::skipped: no androidTarget() / android block in $BUILD_FILE — Android build cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'

      # Self-hosted runners don't reliably export ANDROID_HOME, so Gradle fails
      # with "SDK location not found". Resolve from the runner env, then standard
      # macOS + Linux install locations, and write local.properties. Covers both
      # OSes because runner_labels:["self-hosted"] lets this land on either.
      - name: Resolve Android SDK location
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          set -uo pipefail
          echo "Runner Android env: ANDROID_HOME=${ANDROID_HOME:-<unset>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          CANDIDATES=(
            "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"
            "$HOME/Library/Android/sdk"
            "$HOME/Android/Sdk" "$HOME/android-sdk"
            "/opt/android-sdk" "/usr/lib/android-sdk" "/usr/local/lib/android/sdk"
          )
          SDK_DIR=""
          for c in "${CANDIDATES[@]}"; do
            [ -n "$c" ] || continue
            if [ -d "$c/platform-tools" ] || [ -d "$c/cmdline-tools" ] || [ -d "$c/platforms" ]; then
              SDK_DIR="$c"; break
            fi
          done
          if [ -z "$SDK_DIR" ]; then
            echo "::error::Android SDK not found on runner. Checked: ${CANDIDATES[*]}"
            ls -la "$HOME" 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "Resolved Android SDK: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK_DIR" > local.properties

      # Decode the keystore into a temp file. Android Gradle plugin reads
      # signing config from env vars our build.gradle.kts blocks reference
      # (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, etc.).
      - name: Decode signing keystore
        if: steps.guard.outputs.supported == 'true' && env.KEYSTORE_PRESENT == 'true'
        env:
          KEYSTORE_PRESENT: ${{ secrets.ANDROID_SIGNING_KEYSTORE != '' && 'true' || 'false' }}
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$KS"
          echo "RELEASE_STORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # --no-configuration-cache: AGP 9.x + Gradle 9.x trips a serialization
          # error in ProcessNavigationXmlTask when config cache is on.
          ./gradlew :${{ inputs.gradle_module }}:assembleRelease \
                    :${{ inputs.gradle_module }}:bundleRelease \
                    -PappVersion=${{ inputs.version }} \
                    --no-daemon --no-configuration-cache

      - name: Rename + checksum artifacts
        if: steps.guard.outputs.supported == 'true'
        run: |
          APK=$(find ${{ steps.guard.outputs.module_dir }}/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find ${{ steps.guard.outputs.module_dir }}/build/outputs/bundle/release -name "*.aab" | head -1)
          APK_DEST="${{ inputs.product }}-${{ inputs.version }}-android.apk"
          AAB_DEST="${{ inputs.product }}-${{ inputs.version }}-android.aab"
          [ -n "$APK" ] && mv "$APK" "$APK_DEST" && sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          [ -n "$AAB" ] && mv "$AAB" "$AAB_DEST" && sha256sum "$AAB_DEST" > "${AAB_DEST}.sha256"

      - name: Upload to GitHub Release
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: Tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-android.apk
            ${{ inputs.product }}-${{ inputs.version }}-android.apk.sha256
            ${{ inputs.product }}-${{ inputs.version }}-android.aab
            ${{ inputs.product }}-${{ inputs.version }}-android.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}

      # Mirror the release binaries into the R2 bucket that
      # artifacts.tanvrit.com serves from.
      #
      # Why this step is now allowed to fail the job (2026-08-11): it used to be
      # `continue-on-error: true` behind an `R2_KEY_PRESENT` guard, so absent
      # credentials or a failed upload both reported SUCCESS having mirrored
      # nothing. That is not a harmless degradation:
      # `scripts/update-manifest.js` writes an `r2_url` into every manifest
      # UNCONDITIONALLY and `worker/src/index.js` PREFERS `r2_url` over the
      # GitHub-Releases `direct_url`, so a skipped mirror publishes a release
      # whose download link points at an object that was never uploaded. This
      # exact defect bit tanvrit/ai in production — three installers had to be
      # mirrored by hand after a "successful" release. The binaries are already
      # attached to the GitHub Release by the step above, so a red mirror step
      # loses no artifact; it only reports, truthfully, that the CDN download
      # links for this release will not work.
      #
      # Auth is the R2 S3-compatible API via `curl --aws-sigv4`, not the `aws`
      # CLI: curl is present on every runner in the fleet (including the Windows
      # runner under `shell: bash`), whereas the AWS CLI is not installed on the
      # self-hosted nodes — a missing `aws` binary was one more failure the old
      # continue-on-error swallowed.
      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          acct="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
          if [ -z "$acct" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 mirror cannot run — set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CF_ACCOUNT_ID as REPO-level secrets on this repository (org secrets are not injected into private repos on the free plan, so they arrive empty). The manifest for ${PRODUCT} ${VERSION} advertises an r2_url regardless, so without this mirror every artifacts.tanvrit.com download for it would 404."
            exit 1
          fi
          host="https://${acct}.r2.cloudflarestorage.com"
          prefix="releases/${PRODUCT}/${VERSION}"
          mirrored=0
          for f in ${PRODUCT}-${VERSION}-android.apk ${PRODUCT}-${VERSION}-android.apk.sha256 \
                   ${PRODUCT}-${VERSION}-android.aab ${PRODUCT}-${VERSION}-android.aab.sha256; do
            if [ ! -f "$f" ]; then
              echo "::notice::$f not produced by this build — skipping it."
              continue
            fi
            key="${prefix}/${f}"
            url="${host}/tanvrit-artifacts/${key}"
            echo "Mirroring $f -> r2://tanvrit-artifacts/${key}"
            code=$(curl -sS -o /tmp/r2-put.log -w '%{http_code}' \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$f" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::R2 PUT for $key returned HTTP ${code:-000}"
              head -c 800 /tmp/r2-put.log 2>/dev/null || true
              exit 1
            fi
            # Read the object back. A 200 on the PUT is not proof the object is
            # there — only a successful read is, and that is what decides
            # whether a user can actually download this release.
            back=$(curl -sS -r 0-0 -D /tmp/r2-get.h -o /dev/null -w '%{http_code}' \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              "$url" || true)
            if [ "$back" != "206" ] && [ "$back" != "200" ]; then
              echo "::error::Uploaded $key but it does not read back from R2 (HTTP ${back:-000}) — downloads for this release would 404."
              exit 1
            fi
            local_size=$(wc -c < "$f" | tr -d ' ')
            remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Rr]ange:.*/\([0-9][0-9]*\)$|\1|p' | tail -1)
            if [ -z "$remote_size" ]; then
              remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Ll]ength: *\([0-9][0-9]*\)$|\1|p' | tail -1)
            fi
            if [ -n "$remote_size" ] && [ "$remote_size" != "$local_size" ]; then
              echo "::error::Size mismatch for $key — local ${local_size} bytes, R2 ${remote_size} bytes. The mirrored object is truncated."
              exit 1
            fi
            echo "Verified r2://tanvrit-artifacts/${key} (${local_size} bytes)"
            mirrored=$((mirrored + 1))
          done
          if [ "$mirrored" -eq 0 ]; then
            echo "::error::R2 mirror uploaded nothing for ${PRODUCT} ${VERSION} — none of the expected artifacts existed on disk."
            exit 1
          fi
          echo "Mirrored and verified ${mirrored} object(s) under r2://tanvrit-artifacts/${prefix}/"

      # Play Store upload — activates only when both keystore + Play SA
      # are set. Internal track by default; promotion to higher tracks
      # is an out-of-band Play Console action.
      - name: Upload to Google Play
        if: steps.guard.outputs.supported == 'true' && env.PLAY_SA_PRESENT == 'true'
        continue-on-error: true
        env:
          PLAY_SA_PRESENT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.application_id }}
          releaseFiles: ${{ inputs.product }}-${{ inputs.version }}-android.aab
          track: ${{ inputs.play_track }}
          status: completed
          changesNotSentForReview: false

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "android",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }
