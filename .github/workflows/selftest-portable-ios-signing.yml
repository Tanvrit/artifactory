name: Self-test portable iOS signing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/portable-ios-signing/**'
      - '.github/workflows/release-ios-template.yml'
      - '.github/workflows/selftest-portable-ios-signing.yml'
  push:
    paths:
      - '.github/actions/portable-ios-signing/**'
      - '.github/workflows/release-ios-template.yml'
      - '.github/workflows/selftest-portable-ios-signing.yml'
permissions:
  contents: read
jobs:
  portable-signing:
    runs-on:
      group: tanvrit
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify synthetic provisioning, signing and cleanup contracts
        run: python3 -B -m unittest discover -s .github/actions/portable-ios-signing -p 'test_*.py' -v
