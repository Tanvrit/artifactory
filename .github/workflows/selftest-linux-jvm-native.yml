name: Self-test Linux JVM native preparation
on:
  push:
    branches: [main]
    paths: ['.github/actions/linux-jvm-native/**', '.github/workflows/selftest-linux-jvm-native.yml']
  pull_request:
    paths: ['.github/actions/linux-jvm-native/**', '.github/workflows/selftest-linux-jvm-native.yml']
  workflow_dispatch:
    inputs:
      live_prepare:
        description: Verify authenticated job-local payloads on the actual Linux runner without host installation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: linux-jvm-native-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check preparation with mocked host and package commands
        shell: bash
        run: python3 -B -m unittest discover -s .github/actions/linux-jvm-native -p 'test_*.py'
      - name: Qualify actual job-local native preparation
        if: github.event_name == 'workflow_dispatch' && inputs.live_prepare
        uses: ./.github/actions/linux-jvm-native
