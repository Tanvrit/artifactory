# TEMPORARY (PR-only, removed before merge): exercises the new
# "Per-runner Gradle home" first step of the release templates on the real
# Linux X64 host. There is no composeApp/ in this repo, so each template's
# target guard skips every build/upload/deploy step after it: nothing is
# built, uploaded or shipped.
name: Selftest template Gradle home (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/release-*-template.yml'
      - '.github/workflows/selftest-template-gradle-home.yml'

permissions:
  contents: read

jobs:
  web-x64:
    # Never run fork-PR code on the self-hosted fleet.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-web-template.yml
    with:
      product: selftest
      cf_project_name: selftest-does-not-exist

  linux-x64:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-template.yml
    with:
      product: selftest
      version: 0.0.0-selftest
      gradle_module: composeApp
      main_class: selftest.MainKt
      package_name: selftest

  android-x64:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/release-android-template.yml
    with:
      product: selftest
      version: 0.0.0-selftest
      gradle_module: composeApp
      application_id: com.tanvrit.selftest
      package_name: selftest

  firebase-x64:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/release-firebase-template.yml
    with:
      product: selftest
      firebase_project_id: selftest-does-not-exist
