# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + deploy Web (Firebase Hosting variant)
#
# Used by products on Firebase Hosting (currently: desipops). For
# Cloudflare Pages products, use release-web-template.yml instead.
#
# Caller example:
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-firebase-template.yml@main
#       with:
#         product: desipops
#         firebase_project_id: desipops-d17ed
#         gradle_task: ':composeApp:wasmJsBrowserDistribution'
#         wasm_output_dir: 'composeApp/build/dist/wasmJs/productionExecutable'
#         landing_build_dir: 'web'
#         service_account_secret_name: FIREBASE_SERVICE_ACCOUNT_DESIPOPS_D17ED
#       secrets: inherit
#
# Triggers on push to main + workflow_dispatch.
# Graceful-skip guard: no wasmJs() target → exit 0.
# ─────────────────────────────────────────────────────────────

name: Release Firebase (Reusable — Firebase Hosting)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      firebase_project_id:
        description: 'Firebase project ID (e.g. desipops-d17ed)'
        type: string
        required: true
      firebase_channel_id:
        description: 'Hosting channel ID (default: live)'
        type: string
        required: false
        default: 'live'
      gradle_task:
        type: string
        required: false
        default: ':composeApp:wasmJsBrowserDistribution'
      gradle_module:
        type: string
        required: false
        default: 'composeApp'
      wasm_output_dir:
        type: string
        required: false
        default: 'composeApp/build/dist/wasmJs/productionExecutable'
      landing_build_dir:
        description: 'Optional landing-site dir for npm ci + npm run build'
        type: string
        required: false
        default: ''
      assemble_script:
        description: 'Optional bash script that assembles dist/ — overrides default merge logic'
        type: string
        required: false
        default: ''
    secrets:
      # Caller passes its product-specific service-account secret here via
      # secrets: inherit. The secret name itself is conventionally
      # FIREBASE_SERVICE_ACCOUNT_<PRODUCT> per the existing pattern.
      FIREBASE_SERVICE_ACCOUNT_JSON:
        description: 'Firebase service-account JSON (generic name; caller can map its product-specific secret to this)'
        required: false
      ARTIFACTS_REPO_TOKEN:
        description: 'When absent, manifest dispatch is skipped.'
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  release-firebase:
    name: Web (Firebase Hosting)
    runs-on:
      group: tanvrit
      # The same Kotlin/Wasm + npm build as release-web-template.yml plus a Firebase Hosting
      # deploy (a Node action); no step needs macOS or Xcode. Reverted 2026-09-23 from the
      # 2026-09-07 Linux-disk-outage route to macOS, so it stops queueing behind iOS/macOS
      # releases on the scarcest runners. X64 is explicit because a bare [self-hosted, Linux]
      # also matches the Linux ARM64 runners (GX10), which are reserved for JVM tests.
      labels: [self-hosted, Linux, X64]
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted request here is satisfiable and is left
    # alone. What was missing is a ceiling — without `timeout-minutes` a wedged job
    # inherits GitHub's 6h default and holds a scarce shared runner for that whole
    # time. Kotlin/Wasm + npm builds of this shape run 2-52 min in the fleet.
    timeout-minutes: 90
    steps:
      # Per-runner, persistent GRADLE_USER_HOME (2026-09-24). Concurrent Gradle
      # builds sharing one home corrupt each other's artifact-transform cache
      # (FileNotFoundException on jars Gradle itself just produced, measured on
      # the X64 host), and some runner processes share one OS user:
      #   * Linux X64 ("Parmar"): runner1..runner10 all run as root with
      #     HOME=/root, on a nearly full root disk. Each runner gets its own home
      #     on the large /var/lib/vz pool, or $HOME/.gradle-ci/<runner> when the
      #     pool is not writable. Same paths as tanvrit/server server-deploy.yml
      #     and tanvrit/admin e2e.yml, so a runner reuses ONE warm home across
      #     repos (a runner runs one job at a time).
      #   * macOS: the two runners on the M2 Max MacBook share one user home, so
      #     each gets $HOME/.gradle-ci/<runner>.
      #   * Linux ARM64 (GX10) and anything else: left alone; each GX10 runner is
      #     provisioned with its own home.
      # Never the workspace: checkout wipes it, so it would be cold on every run.
      # The runner name is reduced to [A-Za-z0-9._-] ("macbook second" becomes
      # "macbook-second") so no tool downstream sees a space in the path. This
      # goes through GITHUB_ENV because job-level `env` cannot read the `runner`
      # context, and it runs before setup-gradle, which writes its init scripts
      # into whatever GRADLE_USER_HOME is set at that point.
      - name: Per-runner Gradle home
        # Per runner AND per trust level (pull_request vs trusted events):
        # see .github/actions/gradle-home/action.yml. Must run before setup-gradle.
        uses: tanvrit/artifactory/.github/actions/gradle-home@main
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        shell: bash
        run: |
          # Translate gradle-path (`ui:ui-android`) to filesystem path (`ui/ui-android`)
          BUILD_FILE="$(echo '${{ inputs.gradle_module }}' | tr ':' '/')/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then
            echo "::notice::skipped: $BUILD_FILE not found for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE 'wasmJs\s*\{|wasmJs\(\)|^\s*js\s*\{' "$BUILD_FILE"; then
            echo "::notice::skipped: no wasmJs() / js() target in $BUILD_FILE — Web deploy cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      # No GitHub Actions cache (see release-web-template.yml): the self-hosted
      # runners keep a persistent GRADLE_USER_HOME and ~/.npm, and Actions-cache
      # save/restore costs 10-49 minutes per job on them.
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: zulu, java-version: '21' }
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.supported == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'
        with:
          cache-disabled: true

      - name: Build Wasm/JS bundle
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache

      - name: Build landing site
        if: steps.guard.outputs.supported == 'true' && inputs.landing_build_dir != ''
        run: |
          cd ${{ inputs.landing_build_dir }}
          npm ci
          npm run build

      - name: Assemble distribution (custom script)
        if: steps.guard.outputs.supported == 'true' && inputs.assemble_script != ''
        run: |
          chmod +x "${{ inputs.assemble_script }}"
          "${{ inputs.assemble_script }}"

      - name: Assemble distribution (default merge logic)
        if: steps.guard.outputs.supported == 'true' && inputs.assemble_script == ''
        run: |
          rm -rf dist
          if [ -n "${{ inputs.landing_build_dir }}" ]; then
            mkdir -p dist/app
            cp -r "${{ inputs.landing_build_dir }}"/out/. dist/
            cp -r "${{ inputs.wasm_output_dir }}"/. dist/app/
          else
            mkdir -p dist
            cp -r "${{ inputs.wasm_output_dir }}"/. dist/
          fi

      - name: Deploy to Firebase Hosting
        if: steps.guard.outputs.supported == 'true' && env.SA_PRESENT == 'true' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          SA_PRESENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          channelId: ${{ inputs.firebase_channel_id }}
          projectId: ${{ inputs.firebase_project_id }}

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && github.event_name == 'push' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ github.sha }}",
              "platform": "web",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}"
            }
