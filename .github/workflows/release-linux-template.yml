# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish Linux x64 .deb + .AppImage
#
# Caller example:
#   jobs:
#     release:
#       uses: tanvrit/artifactory/.github/workflows/release-linux-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         gradle_module: composeApp
#         main_class: com.friendly.MainKt
#         package_name: com.friendly
#       secrets: inherit
#
# Produces:
#   <product>-<version>-linux-x64.deb        + .sha256   (jpackage)
#   <product>-<version>-linux-x64.AppImage   + .sha256   (appimagetool wrap of createDistributable)
#
# Two manifest dispatches fire — one for "linux-x64" (deb), one for
# "linux-x64-app" (AppImage). Both can be independently `available: false`
# if (e.g.) appimagetool fails on a runner.
#
# Graceful-skip guard: bails if composeApp doesn't declare jvm().
# ─────────────────────────────────────────────────────────────

name: Release Linux (Reusable)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      gradle_module:
        type: string
        required: true
        default: 'composeApp'
      main_class:
        type: string
        required: true
      package_name:
        type: string
        required: true
      release_notes:
        type: string
        required: false
        default: ''
      release_notes_hi:
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_REPO_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        shell: bash
        run: |
          BUILD_FILE="${{ inputs.gradle_module }}/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then
            echo "::notice::skipped: $BUILD_FILE not found for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE '^\s*(jvm\(|jvm \{|jvm\("desktop")' "$BUILD_FILE"; then
            echo "::notice::skipped: jvm() target not declared in $BUILD_FILE — Linux DEB/AppImage build cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.supported == 'true'
        with:
          repository: tanvrit/artifactory
          path: _branding
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          sparse-checkout: branding/icons/dist/${{ inputs.product }}

      - name: Copy icons
        if: steps.guard.outputs.supported == 'true'
        run: |
          mkdir -p ${{ inputs.gradle_module }}/icons
          ICON="_branding/branding/icons/dist/${{ inputs.product }}/linux/${{ inputs.product }}-256.png"
          [ -f "$ICON" ] && cp "$ICON" "${{ inputs.gradle_module }}/icons/" || true

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'

      - name: Install Linux packaging tools
        if: steps.guard.outputs.supported == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils libfuse2

      # ── DEB ────────────────────────────────────────────────────────────
      - name: Build Linux DEB
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ inputs.gradle_module }}:packageDeb -PappVersion=${{ inputs.version }} --no-daemon

      - name: Rename + checksum DEB
        if: steps.guard.outputs.supported == 'true'
        run: |
          DEB=$(find ${{ inputs.gradle_module }}/build/compose/binaries -name "*.deb" | head -1)
          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-linux-x64.deb"
          mv "$DEB" "$ARTIFACT"
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      # ── AppImage ───────────────────────────────────────────────────────
      # Distro-agnostic. Compose Desktop has no built-in AppImage task — we
      # wrap createDistributable's output with appimagetool.
      - name: Build Linux AppImage
        if: steps.guard.outputs.supported == 'true'
        id: appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :${{ inputs.gradle_module }}:createDistributable -PappVersion=${{ inputs.version }} --no-daemon

          APP_DIR=$(find ${{ inputs.gradle_module }}/build/compose/binaries -type d -name "app" | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find ${{ inputs.gradle_module }}/build/compose/binaries -type d -name "main" | head -1)
          fi
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "::warning::createDistributable output not found — AppImage step skipped, DEB still ships."
            echo "appimage_built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPDIR="$RUNNER_TEMP/${{ inputs.product }}.AppDir"
          rm -rf "$APPDIR" && mkdir -p "$APPDIR/usr"
          cp -r "$APP_DIR"/. "$APPDIR/usr/"

          PRODUCT_ICON=$(find ${{ inputs.gradle_module }}/icons -name "${{ inputs.product }}-256.png" | head -1)
          [ -n "$PRODUCT_ICON" ] && cp "$PRODUCT_ICON" "$APPDIR/${{ inputs.product }}.png"

          cat > "$APPDIR/${{ inputs.product }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${{ inputs.product }}
          Exec=AppRun
          Icon=${{ inputs.product }}
          Categories=Utility;
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          BIN=$(find "$HERE/usr/bin" -maxdepth 1 -type f -executable | head -1)
          [ -n "$BIN" ] || BIN=$(find "$HERE/usr" -maxdepth 3 -type f -executable -not -path '*/lib/*' | head -1)
          exec "$BIN" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-linux-x64.AppImage"
          if ARCH=x86_64 "$RUNNER_TEMP/appimagetool" "$APPDIR" "$ARTIFACT"; then
            sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
            echo "appimage_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::appimagetool failed — AppImage skipped, DEB still ships."
            echo "appimage_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release (DEB + AppImage)
        if: steps.guard.outputs.supported == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-linux-x64.deb
            ${{ inputs.product }}-${{ inputs.version }}-linux-x64.deb.sha256
            ${{ inputs.product }}-${{ inputs.version }}-linux-x64.AppImage
            ${{ inputs.product }}-${{ inputs.version }}-linux-x64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true' && env.R2_KEY_PRESENT == 'true'
        env:
          R2_KEY_PRESENT: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'true' || 'false' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DEST="s3://tanvrit-artifacts/releases/${PRODUCT}/${VERSION}"
          for f in ${PRODUCT}-${VERSION}-linux-x64.deb ${PRODUCT}-${VERSION}-linux-x64.deb.sha256 \
                   ${PRODUCT}-${VERSION}-linux-x64.AppImage ${PRODUCT}-${VERSION}-linux-x64.AppImage.sha256; do
            [ -f "$f" ] && aws s3 cp "$f" "${DEST}/$f" --endpoint-url "$ENDPOINT" --no-progress
          done

      - name: Dispatch manifest update (DEB)
        if: steps.guard.outputs.supported == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "linux-x64",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }

      - name: Dispatch manifest update (AppImage)
        if: steps.guard.outputs.supported == 'true' && steps.appimage.outputs.appimage_built == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "linux-x64-app",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}"
            }
