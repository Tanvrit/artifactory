name: Self-test macOS CI preparation
on:
  push:
    branches: [main]
    paths: ['.github/actions/macos-ci-tools/**', '.github/actions/android-sdk/**', '.github/workflows/selftest-macos-ci.yml']
  pull_request:
    paths: ['.github/actions/macos-ci-tools/**', '.github/actions/android-sdk/**', '.github/workflows/selftest-macos-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-ci-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shared preparation actions
        shell: bash
        run: |
          bash -n .github/actions/macos-ci-tools/prepare.sh
          python3 .github/actions/macos-ci-tools/test_prepare.py
          python3 .github/actions/android-sdk/test_compile_sdk.py
