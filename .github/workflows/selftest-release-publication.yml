name: Self-test release publication guards
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-android-template.yml'
      - '.github/workflows/selftest-release-publication.yml'
      - 'scripts/test-release-publication.py'
  push:
    paths:
      - '.github/workflows/release-android-template.yml'
      - '.github/workflows/selftest-release-publication.yml'
      - 'scripts/test-release-publication.py'
permissions:
  contents: read
jobs:
  publication-guards:
    runs-on:
      group: tanvrit
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare macOS CI tools
        uses: tanvrit/artifactory/.github/actions/macos-ci-tools@main
      - name: Check publication guards with synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/publication-guard-tests"
          "$RUNNER_TEMP/publication-guard-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/publication-guard-tests/bin/python" -B scripts/test-release-publication.py -v
      - name: Remove isolated test dependencies
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/publication-guard-tests"
