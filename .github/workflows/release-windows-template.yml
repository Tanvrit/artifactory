# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish Windows x64 MSI
#
# Caller example:
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-windows-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         gradle_module: composeApp
#         main_class: com.friendly.MainKt
#         package_name: com.friendly
#       secrets: inherit
#
# Produces: <product>-<version>-windows-x64.msi + .sha256
# Authenticode signing activates when WINDOWS_SIGNING_CERT is set; otherwise
# the MSI ships unsigned (SmartScreen warns — "More info → Run anyway").
#
# Graceful-skip guard: bails out cleanly if the caller's composeApp doesn't
# declare a jvm() target.
# ─────────────────────────────────────────────────────────────

name: Release Windows (Reusable)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      gradle_module:
        type: string
        required: true
        default: 'composeApp'
      main_class:
        type: string
        required: true
      package_name:
        type: string
        required: true
      windows_upgrade_uuid:
        description: 'Stable Windows MSI upgrade UUID (immutable per product)'
        type: string
        required: false
        default: ''
      release_notes:
        type: string
        required: false
        default: ''
      release_notes_hi:
        type: string
        required: false
        default: ''
    secrets:
      WINDOWS_SIGNING_CERT:
        description: 'Base64-encoded Authenticode .pfx — when set, MSI is signed; otherwise MSI ships unsigned'
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false
      ARTIFACTS_REPO_TOKEN:
        description: 'PAT with contents:write on Tanvrit/artifactory. REQUIRED in practice — when absent the installer cannot be attached to the release, so the job now FAILS LOUDLY instead of skipping the upload. Declared optional only so callers that pass secrets explicitly still parse.'
        required: false
      CF_ACCOUNT_ID:
        description: 'Cloudflare account id for the R2 S3 endpoint. The R2 mirror step now FAILS LOUDLY when this or the R2 key pair is absent — update-manifest publishes an r2_url for every release regardless, so a skipped mirror ships a manifest whose download link 404s.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Fallback for CF_ACCOUNT_ID (same value; the name several repos already carry).'
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

jobs:
  build-windows:
    name: Windows x64
    runs-on:
      group: tanvrit
      labels: [windows]
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted request here is satisfiable and is left
    # alone. What was missing is a ceiling — without `timeout-minutes` a wedged job
    # inherits GitHub's 6h default and holds the fleet's single Windows runner for that
    # whole time, which blocks every other repo's Windows release behind it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        uses: tanvrit/artifactory/.github/actions/resolve-module-dir@main
        with:
          gradle_module: ${{ inputs.gradle_module }}
          product: ${{ inputs.product }}
          target_pattern: '^\s*(jvm\(|jvm \{|jvm\("desktop")'
          target_description: 'jvm() target not declared'
          build_description: 'Windows MSI build'

      - uses: actions/checkout@v4
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        with:
          repository: Tanvrit/artifactory
          path: _branding
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          sparse-checkout: branding/icons/dist/${{ inputs.product }}

      - name: Copy icons
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          mkdir -p ${{ steps.guard.outputs.module_dir }}/icons
          ICON="_branding/branding/icons/dist/${{ inputs.product }}/windows/${{ inputs.product }}.ico"
          [ -f "$ICON" ] && cp "$ICON" "${{ steps.guard.outputs.module_dir }}/icons/" || true

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'

      # The Compose plugin caches its WiX download in the workspace and skips
      # re-downloading when the zip exists (`:downloadWix SKIPPED`). A partial
      # download from an earlier failed run survives between runs and extracts
      # a garbage light.exe that dies instantly with exit 216 (invalid image,
      # empty stdout) — observed on run 32997239967. Wiping the cache forces a
      # fresh, complete download every release; the toolset is ~35MB, the cost
      # is seconds, and it makes the step self-healing.
      - name: Refresh WiX toolset cache
        if: steps.guard.outputs.supported == 'true'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rem Two ways a machine-level WiX poisons the build (both observed on
          rem the fleet runner, runs 32997239967..33000296620):
          rem  1. WIX_PATH env set → the Compose plugin NEVER downloads its own
          rem     WiX (downloadWix onlyIf) and jpackage uses whatever broken
          rem     install the variable points at — light.exe exited 216 (wrong
          rem     machine type) before printing a byte.
          rem  2. A stale zip in the gradle-user-home cache (wix311) re-extracts
          rem     forever.
          rem Print the machine state for the record, wipe the cache, and let
          rem the build step (which clears WIX_PATH) download a fresh WiX 3.11.
          echo WIX_PATH is: "%WIX_PATH%"
          if defined WIX_PATH dir "%WIX_PATH%" 2>nul
          set "GUH=%GRADLE_USER_HOME%"
          if "%GUH%"=="" set "GUH=%USERPROFILE%\.gradle"
          rem Bytecode-confirmed paths (WixToolsetKt, plugin 1.11.1):
          rem   zip   = <gradleUserHome>\compose-jb\wix311.zip   (downloadWix onlyIf = !zip.isFile())
          rem   unzip = <workspace>\build\wix311
          rem A TRUNCATED zip here extracts candle.exe fine but a corrupt
          rem light.exe (later archive entry) that exits 216 — poisoning every
          rem run until the zip is deleted, since onlyIf never re-downloads.
          echo WiX zip cache: "%GUH%\compose-jb"
          if exist "%GUH%\compose-jb" (dir "%GUH%\compose-jb" & rmdir /s /q "%GUH%\compose-jb" && echo wiped zip cache) else (echo zip cache not present)
          if exist build\wix311 (rmdir /s /q build\wix311 && echo wiped extraction) else (echo extraction not present)
          set "WIX_PATH="
          .\gradlew.bat :downloadWix :unzipWix --no-daemon --no-configuration-cache

      # `shell: cmd` on purpose: this was the template's only step on the
      # runner's default PowerShell shell, and a locked-down ExecutionPolicy
      # (PSSecurityException on the step's own .ps1 wrapper — first observed on
      # app-lekhita's inaugural run, 2026-08-22) kills any pwsh step before it
      # starts. cmd + gradlew.bat needs no script policy at all, on any runner.
      - name: Build Windows MSI
        if: steps.guard.outputs.supported == 'true'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rem Clear WIX_PATH so the plugin's own downloaded WiX 3.11 is used —
          rem the machine-level install this variable points at ships a
          rem light.exe that cannot execute (exit 216). See the refresh step.
          set "WIX_PATH="
          .\gradlew.bat :${{ inputs.gradle_module }}:packageMsi -PappVersion=${{ inputs.version }} --no-daemon --no-configuration-cache

      # jpackage writes its real error to a log file that gradle's output only
      # references by path — without this, an MSI failure on a self-hosted
      # runner is undiagnosable from CI (run 32591414063 burned a blind
      # 17-minute build to learn nothing). Surfaces every jpackage -out/-err
      # log. cmd, not pwsh: same runner-policy hazard as the build step above.
      - name: Print jpackage logs on failure
        if: failure() && steps.guard.outputs.supported == 'true'
        shell: cmd
        run: |
          for /r "${{ steps.guard.outputs.module_dir }}\build\compose\logs" %%f in (*.txt) do (
            echo ===== %%f =====
            type "%%f"
          )

      - name: Rename + checksum artifact
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          MSI=$(find ${{ steps.guard.outputs.module_dir }}/build/compose/binaries -name "*.msi" | head -1)
          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-windows-x64.msi"
          mv "$MSI" "$ARTIFACT"
          echo "MSI_ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      # Authenticode signing — activates when WINDOWS_SIGNING_CERT is set
      # (post-v1 once an OV/EV cert is procured). Without the secret, the
      # MSI ships unsigned and SmartScreen warns the first few installs.
      - name: Sign Windows MSI
        if: steps.guard.outputs.supported == 'true' && env.CERT_PRESENT == 'true'
        # Custom pwsh invocation with -ExecutionPolicy Bypass: same runner-policy
        # trap as the build step, but this one genuinely needs PowerShell.
        shell: pwsh -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          CERT_PRESENT: ${{ secrets.WINDOWS_SIGNING_CERT != '' && 'true' || 'false' }}
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) { $signtool = "signtool" }
          & $signtool sign /f $cert /p $env:WINDOWS_SIGNING_PASSWORD `
            /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v `
            $env:MSI_ARTIFACT
          # Re-hash post-signing (signature mutates the file bytes)
          Get-FileHash -Algorithm SHA256 $env:MSI_ARTIFACT | ForEach-Object {
            "$($_.Hash.ToLower())  $env:MSI_ARTIFACT" | Out-File "${env:MSI_ARTIFACT}.sha256" -Encoding ascii
          }
          Remove-Item $cert -Force

      # ── Deliverable honesty gate (2026-08-13) ─────────────────────────────
      # The upload below used to stack three swallows: an
      # `env.ARTIFACTS_TOKEN_PRESENT == 'true'` guard (silent skip when the
      # secret is absent), `continue-on-error: true` (ignore any failure) and
      # `fail_on_unmatched_files: false` (ignore a missing binary). Between
      # them the native release fleet reported GREEN while attaching nothing —
      # ARTIFACTS_REPO_TOKEN exists only in Tanvrit/artifactory, and the 21
      # consuming repos had produced 2 GitHub Releases in total.
      # A report may be best-effort. A DELIVERABLE may not: a release with no
      # installer attached is a failed release and must say so.
      - name: Verify release upload preconditions
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
          CALLER_REPO: ${{ github.repository }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          fail=0
          if [ "${ARTIFACTS_TOKEN_PRESENT}" != "true" ]; then
            echo "::error::ARTIFACTS_REPO_TOKEN is empty in ${CALLER_REPO} — the ${PRODUCT} ${VERSION} Windows installer cannot be attached to the Tanvrit/artifactory GitHub Release. Add a REPO-level secret named ARTIFACTS_REPO_TOKEN (a PAT with contents:write on Tanvrit/artifactory) under Settings -> Secrets and variables -> Actions in ${CALLER_REPO}. Org secrets are not injected into private repos on the free plan, so they arrive empty. This step used to skip silently — that is how the fleet reported green while shipping nothing."
            fail=1
          fi
          for f in "${PRODUCT}-${VERSION}-windows-x64.msi" "${PRODUCT}-${VERSION}-windows-x64.msi.sha256"; do
            if [ ! -s "$f" ]; then
              echo "::error::Deliverable missing or empty: ${f} — a release with no installer attached is a failed release."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Release upload preconditions OK for ${PRODUCT} ${VERSION} (windows-x64)."

      - name: Upload to GitHub Release
        if: steps.guard.outputs.supported == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-windows-x64.msi
            ${{ inputs.product }}-${{ inputs.version }}-windows-x64.msi.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      # Mirror the release binaries into the R2 bucket that
      # artifacts.tanvrit.com serves from.
      #
      # Why this step is now allowed to fail the job (2026-08-11): it used to be
      # `continue-on-error: true` behind an `R2_KEY_PRESENT` guard, so absent
      # credentials or a failed upload both reported SUCCESS having mirrored
      # nothing. That is not a harmless degradation:
      # `scripts/update-manifest.js` writes an `r2_url` into every manifest
      # UNCONDITIONALLY and `worker/src/index.js` PREFERS `r2_url` over the
      # GitHub-Releases `direct_url`, so a skipped mirror publishes a release
      # whose download link points at an object that was never uploaded. This
      # exact defect bit tanvrit/ai in production — three installers had to be
      # mirrored by hand after a "successful" release. The binaries are already
      # attached to the GitHub Release by the step above, so a red mirror step
      # loses no artifact; it only reports, truthfully, that the CDN download
      # links for this release will not work.
      #
      # Auth is the R2 S3-compatible API via `curl --aws-sigv4`, not the `aws`
      # CLI: curl is present on every runner in the fleet (including the Windows
      # runner under `shell: bash`), whereas the AWS CLI is not installed on the
      # self-hosted nodes — a missing `aws` binary was one more failure the old
      # continue-on-error swallowed.
      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          acct="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
          if [ -z "$acct" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 mirror cannot run — set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CF_ACCOUNT_ID as REPO-level secrets on this repository (org secrets are not injected into private repos on the free plan, so they arrive empty). The manifest for ${PRODUCT} ${VERSION} advertises an r2_url regardless, so without this mirror every dl.tanvrit.com download for it would 404."
            exit 1
          fi
          # curl must be able to sign S3 requests. Without --aws-sigv4 (curl
          # >= 7.75.0) every PUT below dies in the transport layer and reports
          # "HTTP 000" — which reads like a network blip rather than a runner
          # missing a curl feature. Checked via a captured string, NOT a pipe
          # into grep: `set -o pipefail` + `grep -q` closing the pipe early
          # makes curl exit 141 and would fail this check spuriously.
          curl_help="$(curl --help all 2>/dev/null || true)"
          case "$curl_help" in
            *--aws-sigv4*) ;;
            *) echo "::error::curl on this runner cannot sign S3 requests — no --aws-sigv4 support (needs curl >= 7.75.0). Found: $(curl --version 2>/dev/null | head -1). Upgrade curl on this runner; the R2 mirror cannot run without it."; exit 1 ;;
          esac
          host="https://${acct}.r2.cloudflarestorage.com"
          prefix="releases/${PRODUCT}/${VERSION}"
          mirrored=0
          for f in ${PRODUCT}-${VERSION}-windows-x64.msi ${PRODUCT}-${VERSION}-windows-x64.msi.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced by this build — it cannot be mirrored, and the manifest will advertise a download link for it."
              exit 1
            fi
            key="${prefix}/${f}"
            url="${host}/tanvrit-artifacts/${key}"
            echo "Mirroring $f -> r2://tanvrit-artifacts/${key}"
            # Truncate the response-body sink first. `curl -o` only creates the
            # file once a body actually arrives, so a transport-level failure
            # (HTTP 000) leaves the PREVIOUS file's error body in place and the
            # handler below prints it — reporting the wrong reason for the
            # failure. Verified: an R2 401 body from an earlier object was
            # printed under a later "HTTP 000".
            : > /tmp/r2-put.log
            code=$(curl -sS -o /tmp/r2-put.log -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 300 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$f" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::R2 PUT for $key returned HTTP ${code:-000}"
              head -c 800 /tmp/r2-put.log 2>/dev/null || true
              exit 1
            fi
            # Read the object back. A 200 on the PUT is not proof the object is
            # there — only a successful read is, and that is what decides
            # whether a user can actually download this release.
            back=$(curl -sS -r 0-0 -D /tmp/r2-get.h -o /dev/null -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              "$url" || true)
            if [ "$back" != "206" ] && [ "$back" != "200" ]; then
              echo "::error::Uploaded $key but it does not read back from R2 (HTTP ${back:-000}) — downloads for this release would 404."
              exit 1
            fi
            local_size=$(wc -c < "$f" | tr -d ' ')
            remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Rr]ange:.*/\([0-9][0-9]*\)$|\1|p' | tail -1)
            if [ -z "$remote_size" ]; then
              remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Ll]ength: *\([0-9][0-9]*\)$|\1|p' | tail -1)
            fi
            if [ -n "$remote_size" ] && [ "$remote_size" != "$local_size" ]; then
              echo "::error::Size mismatch for $key — local ${local_size} bytes, R2 ${remote_size} bytes. The mirrored object is truncated."
              exit 1
            fi
            echo "Verified r2://tanvrit-artifacts/${key} (${local_size} bytes)"
            mirrored=$((mirrored + 1))
          done
          if [ "$mirrored" -eq 0 ]; then
            echo "::error::R2 mirror uploaded nothing for ${PRODUCT} ${VERSION} — none of the expected artifacts existed on disk."
            exit 1
          fi
          echo "Mirrored and verified ${mirrored} object(s) under r2://tanvrit-artifacts/${prefix}/"

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "windows-x64",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }
