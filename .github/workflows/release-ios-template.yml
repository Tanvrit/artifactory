# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish iOS signed .ipa
#
# Caller example:
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-ios-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         bundle_id: com.tanvrit.friendly
#         xcodeproj_path: iosApp/iosApp.xcodeproj
#         scheme: iosApp
#         configuration: Release
#         export_method: app-store
#       secrets: inherit
#
# Produces: <product>-<version>-ios.ipa + .sha256
#
# Signing (default): AUTOMATIC, off the macOS runner's login keychain. The Apple
# Developer account is signed into Xcode on the macOS runner (one-time,
# interactive), so xcodebuild archive/export use CODE_SIGN_STYLE=Automatic
# with -allowProvisioningUpdates — Xcode fetches/creates the distribution cert
# and provisioning profile on demand. No base64 .p12 / .mobileprovision
# secrets are imported; the only input is APPLE_TEAM_ID (DEVELOPMENT_TEAM).
#
# Signing (portable, opt-in): when the MATCH_GIT_URL + MATCH_PASSWORD secrets are
# BOTH set, the workflow instead uses Fastlane Match. It installs fastlane, runs
# `fastlane match appstore --readonly` (auth via MATCH_GIT_BASIC_AUTHORIZATION)
# to pull the Apple Distribution cert + App Store provisioning profile from the
# encrypted Match repo into a TEMPORARY keychain, optionally decodes ASC_API_KEY_P8
# → ~/.appstoreconnect/private_keys/AuthKey_<ASC_API_KEY_ID>.p8, and archives/exports
# with CODE_SIGN_STYLE=Manual. This path is fully additive: with the Match secrets
# absent, the automatic path above runs unchanged.
#
# Signing (certificate/API key, explicit opt-in): portable_signing=true imports
# IOS_DISTRIBUTION_CERTIFICATE_BASE64 into a private temporary keychain and uses
# APPSTORE_CONNECT_* API-key provisioning for this app, then manual distribution
# signing with the exact imported certificate and app-specific profile. It takes
# precedence over Match only when explicitly enabled. The action signs/exports
# and removes all temporary credentials in one bounded process. Optional
# portable_upload_testflight=true uploads an internal-only build; default false.
#
# Scope: sign + export + TestFlight upload. The .ipa ships to:
#   1. TestFlight (xcrun altool) — when asc_api_key_id input is set and
#      AuthKey_<id>.p8 exists at ~/.appstoreconnect/private_keys/ on the runner
#   2. GitHub Releases (tanvrit/artifactory) — MANDATORY. ARTIFACTS_REPO_TOKEN
#      absent = job fails loudly (the installer is a deliverable, not a report)
#   3. Cloudflare R2 mirror — when R2 credentials are set
#
# Graceful-skip guard: no iosArm64() in composeApp/build.gradle.kts or
# no iosApp/ Xcode project → exit 0 with skip notice.
# ─────────────────────────────────────────────────────────────

name: Release iOS (Reusable)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      gradle_module:
        type: string
        required: false
        default: 'composeApp'
      bundle_id:
        type: string
        required: true
      additional_bundle_ids:
        description: 'JSON array of additional app-extension bundle IDs. Match fetches and exports each target with its own profile.'
        type: string
        required: false
        default: '[]'
      xcodeproj_path:
        type: string
        required: false
        default: 'iosApp/iosApp.xcodeproj'
      scheme:
        type: string
        required: false
        default: 'iosApp'
      configuration:
        type: string
        required: false
        default: 'Release'
      export_method:
        description: 'app-store | ad-hoc | development | enterprise'
        type: string
        required: false
        default: 'app-store'
      xcode_version:
        description: |
          Major.minor Xcode version to select on the build runner (e.g., "26.1").
          Required for App Store submission since 2026-04-28 — Apple enforces
          iOS 26 SDK which ships with Xcode 26 or later. When set, the workflow runs
          `xcode-select` to point at /Applications/Xcode_<version>.app. When
          empty, falls back to whatever `xcode-select -p` resolves on the
          runner — which may produce an .ipa built against an older SDK and
          fail App Store Connect submission. Set this to the Xcode version
          your TestFlight pipeline expects.
        type: string
        required: false
        default: ''
      apple_team_id:
        description: '10-char Apple Developer Team ID (DEVELOPMENT_TEAM) — not a secret, visible in Apple Developer portal.'
        type: string
        required: false
        default: 'F846F22MFM'
      asc_api_key_id:
        description: |
          App Store Connect API Key ID (10-char alphanumeric, visible in ASC → Users & Access → Integrations → App Store Connect API).
          The matching AuthKey_<id>.p8 must exist on the macOS runner at ~/.appstoreconnect/private_keys/.
          When set, the .ipa is uploaded to TestFlight via xcrun altool after signing.
          Leave empty to skip the TestFlight upload step.
        type: string
        required: false
        default: ''
      asc_api_issuer_id:
        description: 'App Store Connect API Issuer ID (UUID shown in the same ASC page as the key).'
        type: string
        required: false
        default: ''
      portable_signing:
        description: 'Explicit opt-in to isolated certificate/API-key automatic signing. Existing runner/Match callers are unchanged.'
        type: boolean
        required: false
        default: false
      portable_upload_testflight:
        description: 'With portable_signing, explicitly upload an internal-only TestFlight build; never changes version/build numbers.'
        type: boolean
        required: false
        default: false
      firebase_messaging:
        description: 'Opt-in to a validated per-app Firebase plist supplied by GOOGLE_SERVICE_INFO_PLIST; removed after the build.'
        type: boolean
        required: false
        default: false
      publish_artifacts:
        description: 'Publish IPA to the Artifactory release, R2 and manifest. Set false for signing validation builds.'
        type: boolean
        required: false
        default: true
      release_notes:
        type: string
        required: false
        default: ''
      release_notes_hi:
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_REPO_TOKEN:
        description: 'PAT with contents:write on Tanvrit/artifactory. REQUIRED in practice — when absent the installer cannot be attached to the release, so the job now FAILS LOUDLY instead of skipping the upload. Declared optional only so callers that pass secrets explicitly still parse.'
        required: false
      CF_ACCOUNT_ID:
        description: 'Cloudflare account id for the R2 S3 endpoint. The R2 mirror step now FAILS LOUDLY when this or the R2 key pair is absent — update-manifest publishes an r2_url for every release regardless, so a skipped mirror ships a manifest whose download link 404s.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Fallback for CF_ACCOUNT_ID (same value; the name several repos already carry).'
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      # ── Portable Fastlane-Match signing (optional) ──────────────────────
      # When MATCH_GIT_URL + MATCH_PASSWORD are BOTH set, the workflow switches
      # from automatic login-keychain signing to portable Match signing: it
      # fetches the Apple Distribution cert + App Store provisioning profile
      # from the encrypted Match git repo into a temporary keychain and uses
      # MANUAL code-signing. When either is absent, the automatic path is used
      # UNCHANGED. All optional so the 14 existing callers keep working.
      MATCH_GIT_URL:
        description: 'HTTPS/SSH URL of the encrypted Fastlane Match certificates repo (e.g. https://github.com/tanvrit/ios-certificates). When set with MATCH_PASSWORD, enables portable Match signing.'
        required: false
      MATCH_PASSWORD:
        description: 'Passphrase that decrypts the Match repo contents.'
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: 'base64 of "user:token" for HTTPS access to a private Match repo.'
        required: false
      ASC_API_KEY_P8:
        description: 'base64-encoded App Store Connect API key (.p8). When set (with ASC_API_KEY_ID) it is decoded to ~/.appstoreconnect/private_keys/AuthKey_<id>.p8 for use during signing/upload.'
        required: false
      ASC_API_KEY_ID:
        description: 'App Store Connect API Key ID for the ASC_API_KEY_P8 secret. Used to name the decoded .p8 file.'
        required: false
      ASC_API_ISSUER_ID:
        description: 'App Store Connect API Issuer ID paired with ASC_API_KEY_P8/ASC_API_KEY_ID.'
        required: false
      # AI-compatible certificate/API-key signing. Read only by the explicit
      # portable_signing path; inherited presence never changes existing callers.
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      IOS_P12_PASSWORD:
        required: false
      APPSTORE_CONNECT_PRIVATE_KEY:
        description: 'Raw PEM App Store Connect API private key, same format as the AI workflow.'
        required: false
      APPSTORE_CONNECT_KEY_ID:
        required: false
      APPSTORE_CONNECT_ISSUER_ID:
        required: false
      APPLE_TEAM_ID:
        description: 'Optional team cross-check; must agree with apple_team_id input.'
        required: false
      GOOGLE_SERVICE_INFO_PLIST:
        description: 'Raw XML GoogleService-Info.plist for firebase_messaging callers; never logged or retained on the runner.'
        required: false

jobs:
  build-ios:
    name: iOS (.ipa)
    runs-on:
      group: tanvrit
      # Genuine iOS/Xcode build (xcodebuild archive/export, TestFlight upload) — stays on the
      # self-hosted macOS pool. ARM64 is pinned because the Apple Silicon Macs are the only
      # runners with Xcode; the macmini (X64 runner agent) has Command Line Tools only, so
      # the xcodebuild archive/export steps below cannot run there.
      labels: [self-hosted, macOS, ARM64]
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted macOS request here is satisfiable and is
    # left alone. What was missing is a ceiling — without `timeout-minutes` a wedged
    # job inherits GitHub's 6h default and holds one of the scarcest runners in the
    # fleet for that whole time. Set high on purpose: this job archives, signs and can
    # block on a TestFlight upload, so 120 leaves room for a slow Apple round-trip.
    timeout-minutes: 120
    steps:
      - name: Prepare macOS CI tools
        if: runner.os == 'macOS'
        uses: tanvrit/artifactory/.github/actions/macos-ci-tools@main
      # Per-runner, persistent GRADLE_USER_HOME (2026-09-24). Concurrent Gradle
      # builds sharing one home corrupt each other's artifact-transform cache
      # (FileNotFoundException on jars Gradle itself just produced, measured on
      # the X64 host), and some runner processes share one OS user:
      #   * Linux X64 ("Parmar"): runner1..runner10 all run as root with
      #     HOME=/root, on a nearly full root disk. Each runner gets its own home
      #     on the large /var/lib/vz pool, or $HOME/.gradle-ci/<runner> when the
      #     pool is not writable. Same paths as tanvrit/server server-deploy.yml
      #     and tanvrit/admin e2e.yml, so a runner reuses ONE warm home across
      #     repos (a runner runs one job at a time).
      #   * macOS: the two runners on the M2 Max MacBook share one user home, so
      #     each gets $HOME/.gradle-ci/<runner>.
      #   * Linux ARM64 (GX10) and anything else: left alone; each GX10 runner is
      #     provisioned with its own home.
      # Never the workspace: checkout wipes it, so it would be cold on every run.
      # The runner name is reduced to [A-Za-z0-9._-] ("macbook second" becomes
      # "macbook-second") so no tool downstream sees a space in the path. This
      # goes through GITHUB_ENV because job-level `env` cannot read the `runner`
      # context, and it runs before setup-gradle, which writes its init scripts
      # into whatever GRADLE_USER_HOME is set at that point.
      - name: Per-runner Gradle home
        # Per runner AND per trust level (pull_request vs trusted events):
        # see .github/actions/gradle-home/action.yml. Must run before setup-gradle.
        uses: tanvrit/artifactory/.github/actions/gradle-home@main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reused runners can retain sparse configuration from an earlier job.
      - name: Restore full source checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git sparse-checkout disable

      - name: Resolve module directory
        id: resolve
        uses: tanvrit/artifactory/.github/actions/resolve-module-dir@main
        with:
          gradle_module: ${{ inputs.gradle_module }}
          product: ${{ inputs.product }}
          target_pattern: 'iosArm64\s*\(|iosSimulatorArm64\s*\('
          target_description: 'no iosArm64() / iosSimulatorArm64() target'
          build_description: 'iOS build'

      # iOS needs one check the shared resolver cannot make: an .xcodeproj (or an
      # XcodeGen project.yml) must exist. So `guard` re-publishes the resolver's
      # outputs and then applies that extra condition, keeping `steps.guard.*` the
      # single thing the rest of this workflow reads.
      - name: Verify target supported
        id: guard
        shell: bash
        env:
          MODULE_DIR: ${{ steps.resolve.outputs.module_dir }}
          RESOLVED_SUPPORTED: ${{ steps.resolve.outputs.supported }}
        run: |
          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          if [ "$RESOLVED_SUPPORTED" != "true" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The Xcode project must exist as a checked-in .xcodeproj, OR be
          # generatable from an XcodeGen project.yml in the iosApp dir.
          # Anything else (Swift sources only, like ai/) graceful-skips
          # rather than red-failing inside xcodebuild archive.
          IOS_DIR="$(dirname '${{ inputs.xcodeproj_path }}')"
          if [ -d "${{ inputs.xcodeproj_path }}" ]; then
            echo "needs_xcodegen=false" >> "$GITHUB_OUTPUT"
          elif [ -f "${IOS_DIR}/project.yml" ]; then
            echo "needs_xcodegen=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: neither ${{ inputs.xcodeproj_path }} nor ${IOS_DIR}/project.yml found — iOS build cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      # Choose the signing path. Portable Fastlane-Match is used only when BOTH
      # MATCH_GIT_URL and MATCH_PASSWORD are provisioned; otherwise the historical
      # automatic login-keychain path runs UNCHANGED.
      - name: Determine iOS signing mode
        id: signmode
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          MATCH_PRESENT: ${{ !inputs.portable_signing && secrets.MATCH_GIT_URL != '' && secrets.MATCH_PASSWORD != '' && 'true' || 'false' }}
          PORTABLE_SIGNING: ${{ inputs.portable_signing }}
          PORTABLE_UPLOAD: ${{ inputs.portable_upload_testflight }}
          PORTABLE_SECRETS_PRESENT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.APPSTORE_CONNECT_PRIVATE_KEY != '' && secrets.APPSTORE_CONNECT_KEY_ID != '' && secrets.APPSTORE_CONNECT_ISSUER_ID != '' && 'true' || 'false' }}
          ADDITIONAL_BUNDLE_IDS: ${{ inputs.additional_bundle_ids }}
        run: |
          if [ "$PORTABLE_UPLOAD" = "true" ] && [ "$PORTABLE_SIGNING" != "true" ]; then
            echo "::error::portable_upload_testflight requires portable_signing=true."
            exit 1
          fi
          if [ "$PORTABLE_SIGNING" = "true" ] && [ "$PORTABLE_SECRETS_PRESENT" != "true" ]; then
            echo "::error::Explicit portable signing requires IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_P12_PASSWORD and APPSTORE_CONNECT_PRIVATE_KEY/KEY_ID/ISSUER_ID."
            exit 1
          fi
          echo "match=$MATCH_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PORTABLE_SIGNING" = "true" ]; then
            if [ "$ADDITIONAL_BUNDLE_IDS" != '[]' ]; then
              echo "::error::Portable certificate/API-key signing currently supports one application target; use Match for extensions."
              exit 1
            fi
            echo "::notice::iOS signing mode: isolated certificate with app-specific API provisioning"
          elif [ "$MATCH_PRESENT" = "true" ]; then
            echo "::notice::iOS signing mode: Fastlane Match (portable certs, manual code-signing)"
          else
            echo "::notice::iOS signing mode: automatic login-keychain (MATCH_* secrets not set)"
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: temurin, java-version: '21' }
      # cache-disabled: the per-runner home set in the first step IS the cache.
      # With it on, every job that starts on a new (empty) home round-trips its
      # Gradle state through the Actions cache, which costs 10-49 min per job on
      # these self-hosted runners (measured; see release-web-template.yml).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.guard.outputs.supported == 'true'
        with:
          cache-disabled: true

      # Generate the .xcodeproj from project.yml for XcodeGen-based platforms
      # (e.g. auditor, compute). XcodeGen is preinstalled on the macOS runner.
      - name: Generate Xcode project (XcodeGen)
        if: steps.guard.outputs.supported == 'true' && steps.guard.outputs.needs_xcodegen == 'true'
        run: |
          set -euo pipefail
          xcodegen generate --spec "$(dirname '${{ inputs.xcodeproj_path }}')/project.yml"

      # R33: pin the Xcode version used by `xcodebuild` so we always build
      # against the SDK Apple currently requires for App Store submission
      # (iOS 26 SDK enforced 2026-04-28). Without this step, the runner's
      # active `xcode-select` decides — meaning a host upgrade silently
      # changes our build SDK and could break or unblock submissions
      # without anyone noticing.
      - name: Select Xcode version
        if: steps.guard.outputs.supported == 'true' && inputs.xcode_version != ''
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.xcode_version }}"
          XCODE_APP="/Applications/Xcode_${VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            # Some self-hosted layouts use Xcode-${VERSION} (no underscore).
            XCODE_APP_ALT="/Applications/Xcode-${VERSION}.app"
            if [ -d "$XCODE_APP_ALT" ]; then
              XCODE_APP="$XCODE_APP_ALT"
            else
              echo "::error::Xcode ${VERSION} not installed on this runner. Available: $(find /Applications -maxdepth 1 -iname '*xcode*' -print)"
              exit 1
            fi
          fi
          sudo xcode-select -switch "${XCODE_APP}/Contents/Developer"
          echo "Active Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Xcode version unpinned notice
        if: steps.guard.outputs.supported == 'true' && inputs.xcode_version == ''
        shell: bash
        run: |
          echo "::warning::xcode_version input not set — building with whatever Xcode is active on this runner ($(xcode-select -p)). Apple enforces iOS 26 SDK for submissions since 2026-04-28; if this run is for App Store, pin an installed Xcode 26 or later version."

      # No cert/profile import: signing is automatic off the macOS runner login
      # keychain where the Apple Developer account is signed into Xcode.
      # `xcodebuild -allowProvisioningUpdates` fetches/creates the
      # distribution cert + provisioning profile on demand.

      - name: Prepare app-specific Firebase Messaging configuration
        id: firebase-config
        if: steps.guard.outputs.supported == 'true' && inputs.firebase_messaging
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          path = Path('iosApp/iosApp/GoogleService-Info.plist')
          validator = Path('scripts/validate-firebase-config.py')
          config = os.environ.get('GOOGLE_SERVICE_INFO_PLIST', '')
          if not config.strip() or not validator.is_file():
              sys.exit('::error::Firebase Messaging requires GOOGLE_SERVICE_INFO_PLIST and the caller configuration validator.')
          try:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          except FileExistsError:
              sys.exit('::error::Refusing to overwrite an existing Firebase iOS configuration.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('created=true', file=output)
          with os.fdopen(descriptor, 'w') as output:
              output.write(config)
          child_env = {key: value for key, value in os.environ.items() if key != 'GOOGLE_SERVICE_INFO_PLIST'}
          result = subprocess.run([sys.executable, str(validator), '--ios', str(path), '--bundle-id',
                                   os.environ['FIREBASE_EXPECTED_BUNDLE_ID']], env=child_env,
                                  capture_output=True, timeout=30, check=False)
          if result.returncode:
              sys.exit('::error::Firebase iOS configuration validation failed; configuration values were withheld.')
          print('Firebase iOS configuration validated for this application.')
          PY

      # Build the KMP iOS framework. The actual task name depends on the
      # module's binary configuration:
      #   - framework{} only → :linkReleaseFrameworkIosArm64
      #   - cocoapods plugin → :linkPodReleaseFrameworkIosArm64
      # Try both, then fall through (xcodebuild also runs
      # embedAndSignAppleFrameworkForXcode via the pbxproj shellScript).
      - name: Build KMP framework
        id: kmp-framework
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo 'stage=task-discovery' >> "$GITHUB_OUTPUT"
          MODULE="${{ inputs.gradle_module }}"
          if ./gradlew ":${MODULE}:tasks" --quiet 2>/dev/null | grep -q "linkPodReleaseFrameworkIosArm64"; then
            echo 'stage=pod-framework-link' >> "$GITHUB_OUTPUT"
            ./gradlew ":${MODULE}:linkPodReleaseFrameworkIosArm64" --no-daemon
            echo 'stage=completed' >> "$GITHUB_OUTPUT"
          elif ./gradlew ":${MODULE}:tasks" --quiet 2>/dev/null | grep -q "linkReleaseFrameworkIosArm64"; then
            echo 'stage=plain-framework-link' >> "$GITHUB_OUTPUT"
            ./gradlew ":${MODULE}:linkReleaseFrameworkIosArm64" --no-daemon
            echo 'stage=completed' >> "$GITHUB_OUTPUT"
          else
            echo 'stage=deferred-to-xcode' >> "$GITHUB_OUTPUT"
            echo "::notice::No linkPod*/link* iOS framework task found in :${MODULE}; xcodebuild's pbxproj shellScript will invoke embedAndSignAppleFrameworkForXcode directly."
          fi

      # Fixed labels expose only source boundaries in step metadata, never compiler output.
      - name: "KMP framework stage: task-discovery"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && steps.kmp-framework.outputs.stage == 'task-discovery'
        run: ':'

      - name: "KMP framework stage: pod-framework-link"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && steps.kmp-framework.outputs.stage == 'pod-framework-link'
        run: ':'

      - name: "KMP framework stage: plain-framework-link"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && steps.kmp-framework.outputs.stage == 'plain-framework-link'
        run: ':'

      - name: "KMP framework stage: deferred-to-xcode"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && steps.kmp-framework.outputs.stage == 'deferred-to-xcode'
        run: ':'

      - name: "KMP framework stage: completed"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && steps.kmp-framework.outputs.stage == 'completed'
        run: ':'

      - name: "KMP framework stage: unknown or unreported"
        if: always() && (steps.kmp-framework.outcome == 'success' || steps.kmp-framework.outcome == 'failure') && !contains(fromJSON('["task-discovery","pod-framework-link","plain-framework-link","deferred-to-xcode","completed"]'), steps.kmp-framework.outputs.stage)
        run: ':'

      # ── Portable Fastlane-Match signing (only when MATCH_* secrets set) ─────
      # Installs fastlane if absent, creates a temporary keychain, and runs
      # `fastlane match appstore --readonly` to fetch the Apple Distribution cert
      # + App Store provisioning profile into that keychain WITHOUT mutating the
      # Match repo. The temp keychain name/password are exported for the manual
      # archive/export steps below.
      - name: Plan application and extension provisioning
        id: ios-signing
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        uses: tanvrit/artifactory/.github/actions/ios-signing-plan@main
        with:
          bundle_id: ${{ inputs.bundle_id }}
          additional_bundle_ids: ${{ inputs.additional_bundle_ids }}
          apple_team_id: ${{ inputs.apple_team_id }}
          export_method: ${{ inputs.export_method }}
          export_options_path: ${{ runner.temp }}/exportOptions.plist

      - name: Set up Fastlane Match signing
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_APP_IDENTIFIERS: ${{ steps.ios-signing.outputs.app_identifiers }}
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
          MATCH_TYPE: appstore
        run: |
          set -euo pipefail
          if ! command -v fastlane >/dev/null 2>&1; then
            echo "fastlane not found — installing…"
            if command -v brew >/dev/null 2>&1; then
              brew install fastlane || sudo gem install fastlane --no-document || gem install fastlane --no-document --user-install
            else
              sudo gem install fastlane --no-document || gem install fastlane --no-document --user-install
            fi
            # Ensure a --user-install gem bin dir is on PATH for later steps.
            if command -v ruby >/dev/null 2>&1; then
              echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
            fi
          fi
          # Temporary keychain that Match imports the cert into.
          SIGN_KEYCHAIN="$RUNNER_TEMP/match-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          # Prepend to the user search list, preserving the existing keychains.
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then EXISTING_KEYCHAINS+=("$keychain"); fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$SIGN_KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          # --readonly: never generate/revoke — just fetch existing material.
          fastlane match "$MATCH_TYPE" \
            --readonly \
            --git_url "$MATCH_GIT_URL" \
            --app_identifier "$MATCH_APP_IDENTIFIERS" \
            --team_id "$APPLE_TEAM_ID" \
            --keychain_name "$SIGN_KEYCHAIN" \
            --keychain_password "$KEYCHAIN_PW"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          echo "✓ Match fetched Apple Distribution cert + App Store profile into $SIGN_KEYCHAIN"

      # Decode the ASC API key so signing/upload tooling can authenticate to
      # App Store Connect. Runs in the Match path when the p8 + id are provided.
      - name: Decode ASC API key (base64 → .p8)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true' && env.ASC_P8_PRESENT == 'true'
        env:
          ASC_P8_PRESENT: ${{ secrets.ASC_API_KEY_P8 != '' && secrets.ASC_API_KEY_ID != '' && 'true' || 'false' }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "::notice::Decoded ASC API key → $KEY_FILE"

      # Automatic signing (default path): Xcode resolves the cert + provisioning
      # profile from the signed-in account on the macOS runner.
      # -allowProvisioningUpdates lets it create/download a matching profile on
      # demand for the bundle id. Skipped when Match signing is active.
      - name: xcodebuild archive
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match != 'true' && !inputs.portable_signing
        env:
          DEVELOPMENT_TEAM: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ inputs.xcodeproj_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      # Manual signing (Match path): use the Apple Distribution cert + the
      # `match AppStore <bundle_id>` profile that Match installed into the temp
      # keychain. No -allowProvisioningUpdates (fully manual, offline signing).
      - name: xcodebuild archive (Match manual signing)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ inputs.apple_team_id }}
          PROFILE_SPECIFIER: ${{ steps.ios-signing.outputs.profile_specifier }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ inputs.xcodeproj_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            archive

      - name: xcodebuild -exportArchive
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match != 'true' && !inputs.portable_signing
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>teamID</key><string>${{ inputs.apple_team_id }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates

      # Manual export (Match path): pin the signing certificate + the Match
      # provisioning profiles per bundle ID. No -allowProvisioningUpdates.
      - name: xcodebuild -exportArchive (Match manual signing)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        run: |
          set -euo pipefail
          # The validated signing-plan action wrote every app/extension profile.
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      # A single action keeps keychain changes and credential cleanup scoped to
      # archive/export. No P8 is written into the shared runner HOME.
      - name: Portable certificate/API-key signing
        id: portable-signing
        if: steps.guard.outputs.supported == 'true' && inputs.portable_signing
        uses: tanvrit/artifactory/.github/actions/portable-ios-signing@e4368fbf36ace7c17ea097c8c5699c0ad3fc96f8
        with:
          project: ${{ inputs.xcodeproj_path }}
          scheme: ${{ inputs.scheme }}
          configuration: ${{ inputs.configuration }}
          bundle-id: ${{ inputs.bundle_id }}
          team-id: ${{ inputs.apple_team_id }}
          export-method: ${{ inputs.export_method }}
          upload-testflight: ${{ inputs.portable_upload_testflight }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Static labels only; attempted Apple writes do not prove remote mutation.
      - name: "Portable signing stage: unknown"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'unknown'
        run: ':'

      - name: "Portable signing stage: configuration"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'configuration'
        run: ':'

      - name: "Portable signing stage: signing-lock"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'signing-lock'
        run: ':'

      - name: "Portable signing stage: private-inputs"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'private-inputs'
        run: ':'

      - name: "Portable signing stage: api-key-validation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'api-key-validation'
        run: ':'

      - name: "Portable signing stage: certificate-validation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'certificate-validation'
        run: ':'

      - name: "Portable signing stage: xcode-identity"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'xcode-identity'
        run: ':'

      - name: "Portable signing stage: api-authentication"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'api-authentication'
        run: ':'

      - name: "Portable signing stage: declared-capabilities"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'declared-capabilities'
        run: ':'

      - name: "Portable signing stage: registered-certificate-lookup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'registered-certificate-lookup'
        run: ':'

      - name: "Portable signing stage: bundle-lookup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'bundle-lookup'
        run: ':'

      - name: "Portable signing stage: bundle-create-attempt"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'bundle-create-attempt'
        run: ':'

      - name: "Portable signing stage: capability-lookup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'capability-lookup'
        run: ':'

      - name: "Portable signing stage: capability-enable-attempt"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'capability-enable-attempt'
        run: ':'

      - name: "Portable signing stage: profile-lookup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'profile-lookup'
        run: ':'

      - name: "Portable signing stage: profile-create-attempt"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'profile-create-attempt'
        run: ':'

      - name: "Portable signing stage: profile-validation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'profile-validation'
        run: ':'

      - name: "Portable signing stage: profile-installation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'profile-installation'
        run: ':'

      - name: "Portable signing stage: keychain-setup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'keychain-setup'
        run: ':'

      - name: "Portable signing stage: archive"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'archive'
        run: ':'

      - name: "Portable signing stage: archive-validation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'archive-validation'
        run: ':'

      - name: "Portable signing stage: export"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'export'
        run: ':'

      - name: "Portable signing stage: ipa-validation"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'ipa-validation'
        run: ':'

      - name: "Portable signing stage: ipa-output"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'ipa-output'
        run: ':'

      - name: "Portable signing stage: testflight-upload-attempt"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'testflight-upload-attempt'
        run: ':'

      - name: "Portable signing stage: cleanup"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'cleanup'
        run: ':'

      - name: "Portable signing stage: completed"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.stage == 'completed'
        run: ':'

      - name: "Portable signing stage: unknown or unreported"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && !contains(fromJSON('["unknown","configuration","signing-lock","private-inputs","api-key-validation","certificate-validation","xcode-identity","api-authentication","declared-capabilities","registered-certificate-lookup","bundle-lookup","bundle-create-attempt","capability-lookup","capability-enable-attempt","profile-lookup","profile-create-attempt","profile-validation","profile-installation","keychain-setup","archive","archive-validation","export","ipa-validation","ipa-output","testflight-upload-attempt","cleanup","completed"]'), steps.portable-signing.outputs.stage)
        run: ':'

      - name: "Portable cleanup stage: unknown"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'unknown'
        run: ':'

      - name: "Portable cleanup stage: not-started"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'not-started'
        run: ':'

      - name: "Portable cleanup stage: search-list"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'search-list'
        run: ':'

      - name: "Portable cleanup stage: keychain"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'keychain'
        run: ':'

      - name: "Portable cleanup stage: profiles"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'profiles'
        run: ':'

      - name: "Portable cleanup stage: private-directory"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'private-directory'
        run: ':'

      - name: "Portable cleanup stage: completed"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && steps.portable-signing.outputs.cleanup-stage == 'completed'
        run: ':'

      - name: "Portable cleanup stage: unknown or unreported"
        if: always() && (steps.portable-signing.outcome == 'success' || steps.portable-signing.outcome == 'failure') && !contains(fromJSON('["unknown","not-started","search-list","keychain","profiles","private-directory","completed"]'), steps.portable-signing.outputs.cleanup-stage)
        run: ':'

      - name: Rename + checksum artifact
        if: steps.guard.outputs.supported == 'true'
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-ios.ipa"
          mv "$IPA" "$ARTIFACT"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"

      # Upload .ipa to TestFlight using xcrun altool + ASC API key.
      # Authentication: API Key stored at ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
      # on the macOS runner — no secret import needed. Step is skipped gracefully
      # if asc_api_key_id is empty or the .p8 file is missing.
      # NOT continue-on-error. This ships a DELIVERABLE to Apple, and it carried
      # the same third swallow that was removed from the GitHub Release upload
      # below: an altool rejection (bad entitlements, duplicate build number,
      # expired certificate) reported GREEN, so a release looked complete while
      # nothing reached TestFlight.
      #
      # The two SKIPS above and below are legitimate and kept: a product that
      # does not ship to Apple leaves asc_api_key_id empty, and a runner without
      # the AuthKey .p8 genuinely cannot upload (that path exits 0 with a
      # ::warning::). What is gone is failure-swallowing once an upload is
      # actually attempted — from there, its failure is the job's failure.
      - name: Upload to TestFlight (xcrun altool)
        if: steps.guard.outputs.supported == 'true' && inputs.asc_api_key_id != '' && !inputs.portable_signing
        env:
          ASC_API_KEY_ID: ${{ inputs.asc_api_key_id }}
          ASC_API_ISSUER_ID: ${{ inputs.asc_api_issuer_id }}
          ARTIFACT: ${{ inputs.product }}-${{ inputs.version }}-ios.ipa
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          if [[ ! -f "$KEY_FILE" ]]; then
            echo "::warning::TestFlight upload skipped — AuthKey_${ASC_API_KEY_ID}.p8 not found at $KEY_FILE. Place the .p8 file on the macOS runner to enable uploads."
            exit 0
          fi
          echo "Uploading $ARTIFACT to TestFlight..."
          xcrun altool --upload-package "$ARTIFACT" \
            --type ios \
            --apiKey  "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose
          echo "✓ Uploaded to TestFlight"

      # ── Deliverable honesty gate (2026-08-13) ─────────────────────────────
      # The upload below used to stack three swallows: an
      # `env.ARTIFACTS_TOKEN_PRESENT == 'true'` guard (silent skip when the
      # secret is absent), `continue-on-error: true` (ignore any failure) and
      # `fail_on_unmatched_files: false` (ignore a missing binary). Between
      # them the native release fleet reported GREEN while attaching nothing —
      # ARTIFACTS_REPO_TOKEN exists only in Tanvrit/artifactory, and the 21
      # consuming repos had produced 2 GitHub Releases in total.
      # A report may be best-effort. A DELIVERABLE may not: a release with no
      # installer attached is a failed release and must say so.
      - name: Verify release upload preconditions
        if: steps.guard.outputs.supported == 'true' && inputs.publish_artifacts
        shell: bash
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
          CALLER_REPO: ${{ github.repository }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          fail=0
          if [ "${ARTIFACTS_TOKEN_PRESENT}" != "true" ]; then
            echo "::error::ARTIFACTS_REPO_TOKEN is empty in ${CALLER_REPO} — the ${PRODUCT} ${VERSION} iOS .ipa cannot be attached to the Tanvrit/artifactory GitHub Release. Add a REPO-level secret named ARTIFACTS_REPO_TOKEN (a PAT with contents:write on Tanvrit/artifactory) under Settings -> Secrets and variables -> Actions in ${CALLER_REPO}. Org secrets are not injected into private repos on the free plan, so they arrive empty. This step used to skip silently — that is how the fleet reported green while shipping nothing."
            fail=1
          fi
          for f in "${PRODUCT}-${VERSION}-ios.ipa" "${PRODUCT}-${VERSION}-ios.ipa.sha256"; do
            if [ ! -s "$f" ]; then
              echo "::error::Deliverable missing or empty: ${f} — a release with no installer attached is a failed release."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Release upload preconditions OK for ${PRODUCT} ${VERSION} (ios)."

      - name: Upload to GitHub Release
        if: steps.guard.outputs.supported == 'true' && inputs.publish_artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: Tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-ios.ipa
            ${{ inputs.product }}-${{ inputs.version }}-ios.ipa.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      # Mirror the release binaries into the R2 bucket that
      # artifacts.tanvrit.com serves from.
      #
      # Why this step is now allowed to fail the job (2026-08-11): it used to be
      # `continue-on-error: true` behind an `R2_KEY_PRESENT` guard, so absent
      # credentials or a failed upload both reported SUCCESS having mirrored
      # nothing. That is not a harmless degradation:
      # `scripts/update-manifest.js` writes an `r2_url` into every manifest
      # UNCONDITIONALLY and `worker/src/index.js` PREFERS `r2_url` over the
      # GitHub-Releases `direct_url`, so a skipped mirror publishes a release
      # whose download link points at an object that was never uploaded. This
      # exact defect bit tanvrit/ai in production — three installers had to be
      # mirrored by hand after a "successful" release. The binaries are already
      # attached to the GitHub Release by the step above, so a red mirror step
      # loses no artifact; it only reports, truthfully, that the CDN download
      # links for this release will not work.
      #
      # Auth is the R2 S3-compatible API via `curl --aws-sigv4`, not the `aws`
      # CLI: curl is present on every runner in the fleet (including the Windows
      # runner under `shell: bash`), whereas the AWS CLI is not installed on the
      # self-hosted nodes — a missing `aws` binary was one more failure the old
      # continue-on-error swallowed.
      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true' && inputs.publish_artifacts
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          acct="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
          if [ -z "$acct" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 mirror cannot run — set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CF_ACCOUNT_ID as REPO-level secrets on this repository (org secrets are not injected into private repos on the free plan, so they arrive empty). The manifest for ${PRODUCT} ${VERSION} advertises an r2_url regardless, so without this mirror every dl.tanvrit.com download for it would 404."
            exit 1
          fi
          # curl must be able to sign S3 requests. Without --aws-sigv4 (curl
          # >= 7.75.0) every PUT below dies in the transport layer and reports
          # "HTTP 000" — which reads like a network blip rather than a runner
          # missing a curl feature. Checked via a captured string, NOT a pipe
          # into grep: `set -o pipefail` + `grep -q` closing the pipe early
          # makes curl exit 141 and would fail this check spuriously.
          curl_help="$(curl --help all 2>/dev/null || true)"
          case "$curl_help" in
            *--aws-sigv4*) ;;
            *) echo "::error::curl on this runner cannot sign S3 requests — no --aws-sigv4 support (needs curl >= 7.75.0). Found: $(curl --version 2>/dev/null | head -1). Upgrade curl on this runner; the R2 mirror cannot run without it."; exit 1 ;;
          esac
          host="https://${acct}.r2.cloudflarestorage.com"
          prefix="releases/${PRODUCT}/${VERSION}"
          mirrored=0
          for f in ${PRODUCT}-${VERSION}-ios.ipa ${PRODUCT}-${VERSION}-ios.ipa.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced by this build — it cannot be mirrored, and the manifest will advertise a download link for it."
              exit 1
            fi
            key="${prefix}/${f}"
            url="${host}/tanvrit-artifacts/${key}"
            echo "Mirroring $f -> r2://tanvrit-artifacts/${key}"
            # Truncate the response-body sink first. `curl -o` only creates the
            # file once a body actually arrives, so a transport-level failure
            # (HTTP 000) leaves the PREVIOUS file's error body in place and the
            # handler below prints it — reporting the wrong reason for the
            # failure. Verified: an R2 401 body from an earlier object was
            # printed under a later "HTTP 000".
            : > /tmp/r2-put.log
            code=$(curl -sS -o /tmp/r2-put.log -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 300 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$f" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::R2 PUT for $key returned HTTP ${code:-000}"
              head -c 800 /tmp/r2-put.log 2>/dev/null || true
              exit 1
            fi
            # Read the object back. A 200 on the PUT is not proof the object is
            # there — only a successful read is, and that is what decides
            # whether a user can actually download this release.
            back=$(curl -sS -r 0-0 -D /tmp/r2-get.h -o /dev/null -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              "$url" || true)
            if [ "$back" != "206" ] && [ "$back" != "200" ]; then
              echo "::error::Uploaded $key but it does not read back from R2 (HTTP ${back:-000}) — downloads for this release would 404."
              exit 1
            fi
            local_size=$(wc -c < "$f" | tr -d ' ')
            remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Rr]ange:.*/\([0-9][0-9]*\)$|\1|p' | tail -1)
            if [ -z "$remote_size" ]; then
              remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Ll]ength: *\([0-9][0-9]*\)$|\1|p' | tail -1)
            fi
            if [ -n "$remote_size" ] && [ "$remote_size" != "$local_size" ]; then
              echo "::error::Size mismatch for $key — local ${local_size} bytes, R2 ${remote_size} bytes. The mirrored object is truncated."
              exit 1
            fi
            echo "Verified r2://tanvrit-artifacts/${key} (${local_size} bytes)"
            mirrored=$((mirrored + 1))
          done
          if [ "$mirrored" -eq 0 ]; then
            echo "::error::R2 mirror uploaded nothing for ${PRODUCT} ${VERSION} — none of the expected artifacts existed on disk."
            exit 1
          fi
          echo "Mirrored and verified ${mirrored} object(s) under r2://tanvrit-artifacts/${prefix}/"

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && inputs.publish_artifacts && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "ios",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }

      - name: Remove temporary Firebase configuration
        if: always() && steps.firebase-config.outputs.created == 'true'
        shell: bash
        run: rm -f -- iosApp/iosApp/GoogleService-Info.plist
