# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish iOS signed .ipa
#
# Caller example:
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-ios-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         bundle_id: com.tanvrit.friendly
#         xcodeproj_path: iosApp/iosApp.xcodeproj
#         scheme: iosApp
#         configuration: Release
#         export_method: app-store
#       secrets: inherit
#
# Produces: <product>-<version>-ios.ipa + .sha256
#
# Signing (default): AUTOMATIC, off the macOS runner's login keychain. The Apple
# Developer account is signed into Xcode on the macOS runner (one-time,
# interactive), so xcodebuild archive/export use CODE_SIGN_STYLE=Automatic
# with -allowProvisioningUpdates — Xcode fetches/creates the distribution cert
# and provisioning profile on demand. No base64 .p12 / .mobileprovision
# secrets are imported; the only input is APPLE_TEAM_ID (DEVELOPMENT_TEAM).
#
# Signing (portable, opt-in): when the MATCH_GIT_URL + MATCH_PASSWORD secrets are
# BOTH set, the workflow instead uses Fastlane Match. It installs fastlane, runs
# `fastlane match appstore --readonly` (auth via MATCH_GIT_BASIC_AUTHORIZATION)
# to pull the Apple Distribution cert + App Store provisioning profile from the
# encrypted Match repo into a TEMPORARY keychain, optionally decodes ASC_API_KEY_P8
# → ~/.appstoreconnect/private_keys/AuthKey_<ASC_API_KEY_ID>.p8, and archives/exports
# with CODE_SIGN_STYLE=Manual. This path is fully additive: with the Match secrets
# absent, the automatic path above runs unchanged.
#
# Scope: sign + export + TestFlight upload. The .ipa ships to:
#   1. TestFlight (xcrun altool) — when asc_api_key_id input is set and
#      AuthKey_<id>.p8 exists at ~/.appstoreconnect/private_keys/ on the runner
#   2. GitHub Releases (tanvrit/artifactory) — MANDATORY. ARTIFACTS_REPO_TOKEN
#      absent = job fails loudly (the installer is a deliverable, not a report)
#   3. Cloudflare R2 mirror — when R2 credentials are set
#
# Graceful-skip guard: no iosArm64() in composeApp/build.gradle.kts or
# no iosApp/ Xcode project → exit 0 with skip notice.
# ─────────────────────────────────────────────────────────────

name: Release iOS (Reusable)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      gradle_module:
        type: string
        required: false
        default: 'composeApp'
      bundle_id:
        type: string
        required: true
      xcodeproj_path:
        type: string
        required: false
        default: 'iosApp/iosApp.xcodeproj'
      scheme:
        type: string
        required: false
        default: 'iosApp'
      configuration:
        type: string
        required: false
        default: 'Release'
      export_method:
        description: 'app-store | ad-hoc | development | enterprise'
        type: string
        required: false
        default: 'app-store'
      xcode_version:
        description: |
          Major.minor Xcode version to select on the build runner (e.g., "16.2").
          Required for App Store submission since 2026-04-28 — Apple enforces
          iOS 26 SDK which ships with Xcode 16.x. When set, the workflow runs
          `xcode-select` to point at /Applications/Xcode_<version>.app. When
          empty, falls back to whatever `xcode-select -p` resolves on the
          runner — which may produce an .ipa built against an older SDK and
          fail App Store Connect submission. Set this to the Xcode version
          your TestFlight pipeline expects.
        type: string
        required: false
        default: ''
      apple_team_id:
        description: '10-char Apple Developer Team ID (DEVELOPMENT_TEAM) — not a secret, visible in Apple Developer portal.'
        type: string
        required: false
        default: 'F846F22MFM'
      asc_api_key_id:
        description: |
          App Store Connect API Key ID (10-char alphanumeric, visible in ASC → Users & Access → Integrations → App Store Connect API).
          The matching AuthKey_<id>.p8 must exist on the macOS runner at ~/.appstoreconnect/private_keys/.
          When set, the .ipa is uploaded to TestFlight via xcrun altool after signing.
          Leave empty to skip the TestFlight upload step.
        type: string
        required: false
        default: ''
      asc_api_issuer_id:
        description: 'App Store Connect API Issuer ID (UUID shown in the same ASC page as the key).'
        type: string
        required: false
        default: ''
      release_notes:
        type: string
        required: false
        default: ''
      release_notes_hi:
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_REPO_TOKEN:
        description: 'PAT with contents:write on Tanvrit/artifactory. REQUIRED in practice — when absent the installer cannot be attached to the release, so the job now FAILS LOUDLY instead of skipping the upload. Declared optional only so callers that pass secrets explicitly still parse.'
        required: false
      CF_ACCOUNT_ID:
        description: 'Cloudflare account id for the R2 S3 endpoint. The R2 mirror step now FAILS LOUDLY when this or the R2 key pair is absent — update-manifest publishes an r2_url for every release regardless, so a skipped mirror ships a manifest whose download link 404s.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Fallback for CF_ACCOUNT_ID (same value; the name several repos already carry).'
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      # ── Portable Fastlane-Match signing (optional) ──────────────────────
      # When MATCH_GIT_URL + MATCH_PASSWORD are BOTH set, the workflow switches
      # from automatic login-keychain signing to portable Match signing: it
      # fetches the Apple Distribution cert + App Store provisioning profile
      # from the encrypted Match git repo into a temporary keychain and uses
      # MANUAL code-signing. When either is absent, the automatic path is used
      # UNCHANGED. All optional so the 14 existing callers keep working.
      MATCH_GIT_URL:
        description: 'HTTPS/SSH URL of the encrypted Fastlane Match certificates repo (e.g. https://github.com/tanvrit/ios-certificates). When set with MATCH_PASSWORD, enables portable Match signing.'
        required: false
      MATCH_PASSWORD:
        description: 'Passphrase that decrypts the Match repo contents.'
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: 'base64 of "user:token" for HTTPS access to a private Match repo.'
        required: false
      ASC_API_KEY_P8:
        description: 'base64-encoded App Store Connect API key (.p8). When set (with ASC_API_KEY_ID) it is decoded to ~/.appstoreconnect/private_keys/AuthKey_<id>.p8 for use during signing/upload.'
        required: false
      ASC_API_KEY_ID:
        description: 'App Store Connect API Key ID for the ASC_API_KEY_P8 secret. Used to name the decoded .p8 file.'
        required: false
      ASC_API_ISSUER_ID:
        description: 'App Store Connect API Issuer ID paired with ASC_API_KEY_P8/ASC_API_KEY_ID.'
        required: false

jobs:
  build-ios:
    name: iOS (.ipa)
    runs-on:
      group: tanvrit
      # Genuine iOS/Xcode build (xcodebuild archive/export, TestFlight upload) — stays on the
      # self-hosted macOS pool; normalized label to match the "tanvrit" group's macOS runners.
      labels: [self-hosted, macOS]
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted macOS request here is satisfiable and is
    # left alone. What was missing is a ceiling — without `timeout-minutes` a wedged
    # job inherits GitHub's 6h default and holds one of the scarcest runners in the
    # fleet for that whole time. Set high on purpose: this job archives, signs and can
    # block on a TestFlight upload, so 120 leaves room for a slow Apple round-trip.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve module directory
        id: resolve
        uses: tanvrit/artifactory/.github/actions/resolve-module-dir@main
        with:
          gradle_module: ${{ inputs.gradle_module }}
          product: ${{ inputs.product }}
          target_pattern: 'iosArm64\s*\(|iosSimulatorArm64\s*\('
          target_description: 'no iosArm64() / iosSimulatorArm64() target'
          build_description: 'iOS build'

      # iOS needs one check the shared resolver cannot make: an .xcodeproj (or an
      # XcodeGen project.yml) must exist. So `guard` re-publishes the resolver's
      # outputs and then applies that extra condition, keeping `steps.guard.*` the
      # single thing the rest of this workflow reads.
      - name: Verify target supported
        id: guard
        shell: bash
        env:
          MODULE_DIR: ${{ steps.resolve.outputs.module_dir }}
          RESOLVED_SUPPORTED: ${{ steps.resolve.outputs.supported }}
        run: |
          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          if [ "$RESOLVED_SUPPORTED" != "true" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The Xcode project must exist as a checked-in .xcodeproj, OR be
          # generatable from an XcodeGen project.yml in the iosApp dir.
          # Anything else (Swift sources only, like ai/) graceful-skips
          # rather than red-failing inside xcodebuild archive.
          IOS_DIR="$(dirname '${{ inputs.xcodeproj_path }}')"
          if [ -d "${{ inputs.xcodeproj_path }}" ]; then
            echo "needs_xcodegen=false" >> "$GITHUB_OUTPUT"
          elif [ -f "${IOS_DIR}/project.yml" ]; then
            echo "needs_xcodegen=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: neither ${{ inputs.xcodeproj_path }} nor ${IOS_DIR}/project.yml found — iOS build cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      # Choose the signing path. Portable Fastlane-Match is used only when BOTH
      # MATCH_GIT_URL and MATCH_PASSWORD are provisioned; otherwise the historical
      # automatic login-keychain path runs UNCHANGED.
      - name: Determine iOS signing mode
        id: signmode
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          MATCH_PRESENT: ${{ secrets.MATCH_GIT_URL != '' && secrets.MATCH_PASSWORD != '' && 'true' || 'false' }}
        run: |
          echo "match=$MATCH_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$MATCH_PRESENT" = "true" ]; then
            echo "::notice::iOS signing mode: Fastlane Match (portable certs, manual code-signing)"
          else
            echo "::notice::iOS signing mode: automatic login-keychain (MATCH_* secrets not set)"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'

      # Generate the .xcodeproj from project.yml for XcodeGen-based platforms
      # (e.g. auditor, compute). XcodeGen is preinstalled on the macOS runner.
      - name: Generate Xcode project (XcodeGen)
        if: steps.guard.outputs.supported == 'true' && steps.guard.outputs.needs_xcodegen == 'true'
        run: |
          set -euo pipefail
          xcodegen generate --spec "$(dirname '${{ inputs.xcodeproj_path }}')/project.yml"

      # R33: pin the Xcode version used by `xcodebuild` so we always build
      # against the SDK Apple currently requires for App Store submission
      # (iOS 26 SDK enforced 2026-04-28). Without this step, the runner's
      # active `xcode-select` decides — meaning a host upgrade silently
      # changes our build SDK and could break or unblock submissions
      # without anyone noticing.
      - name: Select Xcode version
        if: steps.guard.outputs.supported == 'true' && inputs.xcode_version != ''
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.xcode_version }}"
          XCODE_APP="/Applications/Xcode_${VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            # Some self-hosted layouts use Xcode-${VERSION} (no underscore).
            XCODE_APP_ALT="/Applications/Xcode-${VERSION}.app"
            if [ -d "$XCODE_APP_ALT" ]; then
              XCODE_APP="$XCODE_APP_ALT"
            else
              echo "::error::Xcode ${VERSION} not installed on this runner. Available: $(ls /Applications | grep -i Xcode || echo 'none')"
              exit 1
            fi
          fi
          sudo xcode-select -switch "${XCODE_APP}/Contents/Developer"
          echo "Active Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Xcode version unpinned notice
        if: steps.guard.outputs.supported == 'true' && inputs.xcode_version == ''
        shell: bash
        run: |
          echo "::warning::xcode_version input not set — building with whatever Xcode is active on this runner ($(xcode-select -p)). Apple enforces iOS 26 SDK for submissions since 2026-04-28; if this run is for App Store, set xcode_version to '16.x' to pin."

      # No cert/profile import: signing is automatic off the macOS runner login
      # keychain where the Apple Developer account is signed into Xcode.
      # `xcodebuild -allowProvisioningUpdates` fetches/creates the
      # distribution cert + provisioning profile on demand.

      # Build the KMP iOS framework. The actual task name depends on the
      # module's binary configuration:
      #   - framework{} only → :linkReleaseFrameworkIosArm64
      #   - cocoapods plugin → :linkPodReleaseFrameworkIosArm64
      # Try both, then fall through (xcodebuild also runs
      # embedAndSignAppleFrameworkForXcode via the pbxproj shellScript).
      - name: Build KMP framework
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MODULE="${{ inputs.gradle_module }}"
          if ./gradlew ":${MODULE}:tasks" --quiet 2>/dev/null | grep -q "linkPodReleaseFrameworkIosArm64"; then
            ./gradlew ":${MODULE}:linkPodReleaseFrameworkIosArm64" --no-daemon
          elif ./gradlew ":${MODULE}:tasks" --quiet 2>/dev/null | grep -q "linkReleaseFrameworkIosArm64"; then
            ./gradlew ":${MODULE}:linkReleaseFrameworkIosArm64" --no-daemon
          else
            echo "::notice::No linkPod*/link* iOS framework task found in :${MODULE}; xcodebuild's pbxproj shellScript will invoke embedAndSignAppleFrameworkForXcode directly."
          fi

      # ── Portable Fastlane-Match signing (only when MATCH_* secrets set) ─────
      # Installs fastlane if absent, creates a temporary keychain, and runs
      # `fastlane match appstore --readonly` to fetch the Apple Distribution cert
      # + App Store provisioning profile into that keychain WITHOUT mutating the
      # Match repo. The temp keychain name/password are exported for the manual
      # archive/export steps below.
      - name: Set up Fastlane Match signing
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
          MATCH_TYPE: appstore
        run: |
          set -euo pipefail
          if ! command -v fastlane >/dev/null 2>&1; then
            echo "fastlane not found — installing…"
            if command -v brew >/dev/null 2>&1; then
              brew install fastlane || sudo gem install fastlane --no-document || gem install fastlane --no-document --user-install
            else
              sudo gem install fastlane --no-document || gem install fastlane --no-document --user-install
            fi
            # Ensure a --user-install gem bin dir is on PATH for later steps.
            if command -v ruby >/dev/null 2>&1; then
              echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
            fi
          fi
          # Temporary keychain that Match imports the cert into.
          SIGN_KEYCHAIN="$RUNNER_TEMP/match-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          # Prepend to the user search list, preserving the existing keychains.
          security list-keychains -d user -s "$SIGN_KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          # --readonly: never generate/revoke — just fetch existing material.
          fastlane match "$MATCH_TYPE" \
            --readonly \
            --git_url "$MATCH_GIT_URL" \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$APPLE_TEAM_ID" \
            --keychain_name "$SIGN_KEYCHAIN" \
            --keychain_password "$KEYCHAIN_PW"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          echo "✓ Match fetched Apple Distribution cert + App Store profile into $SIGN_KEYCHAIN"

      # Decode the ASC API key so signing/upload tooling can authenticate to
      # App Store Connect. Runs in the Match path when the p8 + id are provided.
      - name: Decode ASC API key (base64 → .p8)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true' && env.ASC_P8_PRESENT == 'true'
        env:
          ASC_P8_PRESENT: ${{ secrets.ASC_API_KEY_P8 != '' && secrets.ASC_API_KEY_ID != '' && 'true' || 'false' }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "::notice::Decoded ASC API key → $KEY_FILE"

      # Automatic signing (default path): Xcode resolves the cert + provisioning
      # profile from the signed-in account on the macOS runner.
      # -allowProvisioningUpdates lets it create/download a matching profile on
      # demand for the bundle id. Skipped when Match signing is active.
      - name: xcodebuild archive
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match != 'true'
        env:
          DEVELOPMENT_TEAM: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ inputs.xcodeproj_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      # Manual signing (Match path): use the Apple Distribution cert + the
      # `match AppStore <bundle_id>` profile that Match installed into the temp
      # keychain. No -allowProvisioningUpdates (fully manual, offline signing).
      - name: xcodebuild archive (Match manual signing)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ inputs.apple_team_id }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          PROFILE="match AppStore ${BUNDLE_ID}"
          xcodebuild \
            -project "${{ inputs.xcodeproj_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            archive

      - name: xcodebuild -exportArchive
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match != 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>teamID</key><string>${{ inputs.apple_team_id }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates

      # Manual export (Match path): pin the signing certificate + the Match
      # provisioning profile explicitly. No -allowProvisioningUpdates.
      - name: xcodebuild -exportArchive (Match manual signing)
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.match == 'true'
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          PROFILE="match AppStore ${BUNDLE_ID}"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>teamID</key><string>${{ inputs.apple_team_id }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.product }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Rename + checksum artifact
        if: steps.guard.outputs.supported == 'true'
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-ios.ipa"
          mv "$IPA" "$ARTIFACT"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"

      # Upload .ipa to TestFlight using xcrun altool + ASC API key.
      # Authentication: API Key stored at ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
      # on the macOS runner — no secret import needed. Step is skipped gracefully
      # if asc_api_key_id is empty or the .p8 file is missing.
      # NOT continue-on-error. This ships a DELIVERABLE to Apple, and it carried
      # the same third swallow that was removed from the GitHub Release upload
      # below: an altool rejection (bad entitlements, duplicate build number,
      # expired certificate) reported GREEN, so a release looked complete while
      # nothing reached TestFlight.
      #
      # The two SKIPS above and below are legitimate and kept: a product that
      # does not ship to Apple leaves asc_api_key_id empty, and a runner without
      # the AuthKey .p8 genuinely cannot upload (that path exits 0 with a
      # ::warning::). What is gone is failure-swallowing once an upload is
      # actually attempted — from there, its failure is the job's failure.
      - name: Upload to TestFlight (xcrun altool)
        if: steps.guard.outputs.supported == 'true' && inputs.asc_api_key_id != ''
        env:
          ASC_API_KEY_ID: ${{ inputs.asc_api_key_id }}
          ASC_API_ISSUER_ID: ${{ inputs.asc_api_issuer_id }}
          ARTIFACT: ${{ inputs.product }}-${{ inputs.version }}-ios.ipa
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          if [[ ! -f "$KEY_FILE" ]]; then
            echo "::warning::TestFlight upload skipped — AuthKey_${ASC_API_KEY_ID}.p8 not found at $KEY_FILE. Place the .p8 file on the macOS runner to enable uploads."
            exit 0
          fi
          echo "Uploading $ARTIFACT to TestFlight..."
          xcrun altool --upload-package "$ARTIFACT" \
            --type ios \
            --apiKey  "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose
          echo "✓ Uploaded to TestFlight"

      # ── Deliverable honesty gate (2026-08-13) ─────────────────────────────
      # The upload below used to stack three swallows: an
      # `env.ARTIFACTS_TOKEN_PRESENT == 'true'` guard (silent skip when the
      # secret is absent), `continue-on-error: true` (ignore any failure) and
      # `fail_on_unmatched_files: false` (ignore a missing binary). Between
      # them the native release fleet reported GREEN while attaching nothing —
      # ARTIFACTS_REPO_TOKEN exists only in Tanvrit/artifactory, and the 21
      # consuming repos had produced 2 GitHub Releases in total.
      # A report may be best-effort. A DELIVERABLE may not: a release with no
      # installer attached is a failed release and must say so.
      - name: Verify release upload preconditions
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
          CALLER_REPO: ${{ github.repository }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          fail=0
          if [ "${ARTIFACTS_TOKEN_PRESENT}" != "true" ]; then
            echo "::error::ARTIFACTS_REPO_TOKEN is empty in ${CALLER_REPO} — the ${PRODUCT} ${VERSION} iOS .ipa cannot be attached to the Tanvrit/artifactory GitHub Release. Add a REPO-level secret named ARTIFACTS_REPO_TOKEN (a PAT with contents:write on Tanvrit/artifactory) under Settings -> Secrets and variables -> Actions in ${CALLER_REPO}. Org secrets are not injected into private repos on the free plan, so they arrive empty. This step used to skip silently — that is how the fleet reported green while shipping nothing."
            fail=1
          fi
          for f in "${PRODUCT}-${VERSION}-ios.ipa" "${PRODUCT}-${VERSION}-ios.ipa.sha256"; do
            if [ ! -s "$f" ]; then
              echo "::error::Deliverable missing or empty: ${f} — a release with no installer attached is a failed release."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Release upload preconditions OK for ${PRODUCT} ${VERSION} (ios)."

      - name: Upload to GitHub Release
        if: steps.guard.outputs.supported == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-ios.ipa
            ${{ inputs.product }}-${{ inputs.version }}-ios.ipa.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      # Mirror the release binaries into the R2 bucket that
      # artifacts.tanvrit.com serves from.
      #
      # Why this step is now allowed to fail the job (2026-08-11): it used to be
      # `continue-on-error: true` behind an `R2_KEY_PRESENT` guard, so absent
      # credentials or a failed upload both reported SUCCESS having mirrored
      # nothing. That is not a harmless degradation:
      # `scripts/update-manifest.js` writes an `r2_url` into every manifest
      # UNCONDITIONALLY and `worker/src/index.js` PREFERS `r2_url` over the
      # GitHub-Releases `direct_url`, so a skipped mirror publishes a release
      # whose download link points at an object that was never uploaded. This
      # exact defect bit tanvrit/ai in production — three installers had to be
      # mirrored by hand after a "successful" release. The binaries are already
      # attached to the GitHub Release by the step above, so a red mirror step
      # loses no artifact; it only reports, truthfully, that the CDN download
      # links for this release will not work.
      #
      # Auth is the R2 S3-compatible API via `curl --aws-sigv4`, not the `aws`
      # CLI: curl is present on every runner in the fleet (including the Windows
      # runner under `shell: bash`), whereas the AWS CLI is not installed on the
      # self-hosted nodes — a missing `aws` binary was one more failure the old
      # continue-on-error swallowed.
      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          acct="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
          if [ -z "$acct" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 mirror cannot run — set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CF_ACCOUNT_ID as REPO-level secrets on this repository (org secrets are not injected into private repos on the free plan, so they arrive empty). The manifest for ${PRODUCT} ${VERSION} advertises an r2_url regardless, so without this mirror every dl.tanvrit.com download for it would 404."
            exit 1
          fi
          # curl must be able to sign S3 requests. Without --aws-sigv4 (curl
          # >= 7.75.0) every PUT below dies in the transport layer and reports
          # "HTTP 000" — which reads like a network blip rather than a runner
          # missing a curl feature. Checked via a captured string, NOT a pipe
          # into grep: `set -o pipefail` + `grep -q` closing the pipe early
          # makes curl exit 141 and would fail this check spuriously.
          curl_help="$(curl --help all 2>/dev/null || true)"
          case "$curl_help" in
            *--aws-sigv4*) ;;
            *) echo "::error::curl on this runner cannot sign S3 requests — no --aws-sigv4 support (needs curl >= 7.75.0). Found: $(curl --version 2>/dev/null | head -1). Upgrade curl on this runner; the R2 mirror cannot run without it."; exit 1 ;;
          esac
          host="https://${acct}.r2.cloudflarestorage.com"
          prefix="releases/${PRODUCT}/${VERSION}"
          mirrored=0
          for f in ${PRODUCT}-${VERSION}-ios.ipa ${PRODUCT}-${VERSION}-ios.ipa.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced by this build — it cannot be mirrored, and the manifest will advertise a download link for it."
              exit 1
            fi
            key="${prefix}/${f}"
            url="${host}/tanvrit-artifacts/${key}"
            echo "Mirroring $f -> r2://tanvrit-artifacts/${key}"
            # Truncate the response-body sink first. `curl -o` only creates the
            # file once a body actually arrives, so a transport-level failure
            # (HTTP 000) leaves the PREVIOUS file's error body in place and the
            # handler below prints it — reporting the wrong reason for the
            # failure. Verified: an R2 401 body from an earlier object was
            # printed under a later "HTTP 000".
            : > /tmp/r2-put.log
            code=$(curl -sS -o /tmp/r2-put.log -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 300 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$f" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::R2 PUT for $key returned HTTP ${code:-000}"
              head -c 800 /tmp/r2-put.log 2>/dev/null || true
              exit 1
            fi
            # Read the object back. A 200 on the PUT is not proof the object is
            # there — only a successful read is, and that is what decides
            # whether a user can actually download this release.
            back=$(curl -sS -r 0-0 -D /tmp/r2-get.h -o /dev/null -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              "$url" || true)
            if [ "$back" != "206" ] && [ "$back" != "200" ]; then
              echo "::error::Uploaded $key but it does not read back from R2 (HTTP ${back:-000}) — downloads for this release would 404."
              exit 1
            fi
            local_size=$(wc -c < "$f" | tr -d ' ')
            remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Rr]ange:.*/\([0-9][0-9]*\)$|\1|p' | tail -1)
            if [ -z "$remote_size" ]; then
              remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Ll]ength: *\([0-9][0-9]*\)$|\1|p' | tail -1)
            fi
            if [ -n "$remote_size" ] && [ "$remote_size" != "$local_size" ]; then
              echo "::error::Size mismatch for $key — local ${local_size} bytes, R2 ${remote_size} bytes. The mirrored object is truncated."
              exit 1
            fi
            echo "Verified r2://tanvrit-artifacts/${key} (${local_size} bytes)"
            mirrored=$((mirrored + 1))
          done
          if [ "$mirrored" -eq 0 ]; then
            echo "::error::R2 mirror uploaded nothing for ${PRODUCT} ${VERSION} — none of the expected artifacts existed on disk."
            exit 1
          fi
          echo "Mirrored and verified ${mirrored} object(s) under r2://tanvrit-artifacts/${prefix}/"

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "ios",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }
