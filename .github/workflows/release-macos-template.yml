# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + publish macOS DMG (Apple Silicon / arm64)
#
# Caller example (per-platform release-macos.yml):
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-macos-template.yml@main
#       with:
#         product: friendly
#         version: 1.2.0
#         gradle_module: composeApp
#         main_class: com.friendly.MainKt
#         package_name: com.friendly
#         bundle_id: com.tanvrit.friendly
#       secrets: inherit
#
# Produces (per release):
#   <product>-<version>-macos-arm64.dmg  + .sha256  (signed + notarized)
#
# arm64-only: the build runs on the macOS runner (`labels: [macos]`). Intel/x64
# DMGs are intentionally retired.
#
# Signing (default): AUTOMATIC, off the macOS runner's login keychain. The
# "Developer ID Application" identity is created once via the Apple Developer
# account signed into Xcode on the macOS runner; the build resolves it with
# `security find-identity` — no base64 .p12 secret is imported.
# Notarization uses a keychain profile (`notary_profile`, default
# "tanvrit-notary") created once on the macOS runner via `xcrun notarytool
# store-credentials`, so no Apple ID / app-specific password is passed.
#
# Signing (secrets-based, opt-in): when APPLE_DEVELOPER_ID_CERT_P12 +
# APPLE_CERT_PASSWORD are BOTH set, the workflow imports the .p12 into a
# temporary keychain, derives SIGNING_IDENTITY from it, and creates notarytool
# credentials in a temp profile from MACOS_NOTARIZATION_APPLE_ID /
# MACOS_NOTARIZATION_PASSWORD / apple_team_id. This is fully additive: with the
# cert secrets absent, the login-keychain path above runs unchanged.
#
# Distribution:
#   1. App Store Connect (xcrun altool) — when asc_api_key_id input is set and
#      AuthKey_<id>.p8 exists at ~/.appstoreconnect/private_keys/ on the runner
#   2. GitHub Releases (tanvrit/artifactory) — MANDATORY. ARTIFACTS_REPO_TOKEN
#      absent = job fails loudly (the installer is a deliverable, not a report)
#   3. Cloudflare R2 mirror — when R2 credentials are set
# Dispatches update-manifest (platform="macos-arm64") after upload.
#
# Graceful-skip guard: if the caller's composeApp/build.gradle.kts
# (or the explicit `gradle_module`) doesn't declare a `jvm()` target,
# the job no-ops with a clear skip reason.
# ─────────────────────────────────────────────────────────────

name: Release macOS (Reusable)

on:
  workflow_call:
    inputs:
      product:
        description: 'Product slug (friendly, mandee, swyft, ...)'
        type: string
        required: true
      version:
        description: 'Version string (e.g. 1.2.0)'
        type: string
        required: true
      gradle_module:
        description: 'Gradle module that owns the Compose Desktop config'
        type: string
        required: true
        default: 'composeApp'
      main_class:
        description: 'Main class for the desktop entry point'
        type: string
        required: true
      package_name:
        description: 'Package name (e.g. com.friendly)'
        type: string
        required: true
      bundle_id:
        description: 'macOS bundle ID (e.g. com.tanvrit.friendly)'
        type: string
        required: true
      apple_team_id:
        description: '10-char Apple Developer Team ID (DEVELOPMENT_TEAM) — not a secret, visible in Apple Developer portal.'
        type: string
        required: false
        default: 'F846F22MFM'
      asc_api_key_id:
        description: |
          App Store Connect API Key ID (10-char alphanumeric, visible in ASC → Users & Access → Integrations → App Store Connect API).
          The matching AuthKey_<id>.p8 must exist on the macOS runner at ~/.appstoreconnect/private_keys/.
          When set, the notarized DMG is uploaded to App Store Connect via xcrun altool after stapling.
          Leave empty to skip the upload step (direct-download-only distribution).
        type: string
        required: false
        default: ''
      asc_api_issuer_id:
        description: 'App Store Connect API Issuer ID (UUID shown in the same ASC page as the key).'
        type: string
        required: false
        default: ''
      notary_profile:
        description: 'Name of the notarytool keychain profile created on the macOS runner via `xcrun notarytool store-credentials`.'
        type: string
        required: false
        default: 'tanvrit-notary'
      release_notes:
        description: 'English release notes'
        type: string
        required: false
        default: ''
      release_notes_hi:
        description: 'Hindi release notes'
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_REPO_TOKEN:
        description: 'PAT with contents:write on Tanvrit/artifactory. REQUIRED in practice — when absent the installer cannot be attached to the release, so the job now FAILS LOUDLY instead of skipping the upload. Declared optional only so callers that pass secrets explicitly still parse.'
        required: false
      CF_R2_TOKEN:
        required: false
      CF_ACCOUNT_ID:
        description: 'Cloudflare account id for the R2 S3 endpoint. The R2 mirror step now FAILS LOUDLY when this or the R2 key pair is absent — update-manifest publishes an r2_url for every release regardless, so a skipped mirror ships a manifest whose download link 404s.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Fallback for CF_ACCOUNT_ID (same value; the name several repos already carry).'
        required: false
      R2_ACCESS_KEY_ID:
        description: 'R2 S3-API access key — when set, binaries are mirrored to R2 alongside GitHub Releases'
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      # ── Secrets-based Developer ID signing (optional) ───────────────────
      # When APPLE_DEVELOPER_ID_CERT_P12 + APPLE_CERT_PASSWORD are BOTH set, the
      # workflow imports the .p12 into a temporary keychain, derives the signing
      # identity from it, and stores notarytool credentials from
      # MACOS_NOTARIZATION_APPLE_ID / MACOS_NOTARIZATION_PASSWORD / apple_team_id.
      # When absent, the historical login-keychain + tanvrit-notary path is used
      # UNCHANGED. All optional so the existing callers keep working.
      APPLE_DEVELOPER_ID_CERT_P12:
        description: 'base64-encoded Developer ID Application certificate (.p12). When set with APPLE_CERT_PASSWORD, enables secrets-based signing.'
        required: false
      APPLE_CERT_PASSWORD:
        description: 'Passphrase protecting APPLE_DEVELOPER_ID_CERT_P12.'
        required: false
      MACOS_DEVELOPER_ID_APPLICATION:
        description: 'Optional explicit "Developer ID Application: …" identity string. Used only as a fallback if the identity cannot be derived from the imported .p12.'
        required: false
      MACOS_NOTARIZATION_APPLE_ID:
        description: 'Apple ID used for notarytool store-credentials in the secrets-based path.'
        required: false
      MACOS_NOTARIZATION_PASSWORD:
        description: 'App-specific password for MACOS_NOTARIZATION_APPLE_ID.'
        required: false

jobs:

  # ── macOS Apple Silicon ──────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on:
      group: tanvrit
      # Genuine macOS build (Xcode signing/notarization, .dmg, App Store Connect upload) — stays
      # on the self-hosted macOS pool; normalized label to match the "tanvrit" group's runners.
      labels: [self-hosted, macOS]
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted macOS request here is satisfiable and is
    # left alone. What was missing is a ceiling — without `timeout-minutes` a wedged
    # job inherits GitHub's 6h default and holds one of the scarcest runners in the
    # fleet for that whole time. Set high on purpose: this job blocks on
    # `notarytool ... --wait`, an Apple-side queue that can legitimately run long, so
    # 120 leaves room for a slow notarization without licensing a 6h hang.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        uses: tanvrit/artifactory/.github/actions/resolve-module-dir@main
        with:
          gradle_module: ${{ inputs.gradle_module }}
          product: ${{ inputs.product }}
          target_pattern: '^\s*(jvm\(|jvm \{|jvm\("desktop")'
          target_description: 'jvm() target not declared'
          build_description: 'macOS DMG build'

      # Choose the signing path. Secrets-based Developer ID signing is used only
      # when BOTH APPLE_DEVELOPER_ID_CERT_P12 and APPLE_CERT_PASSWORD are set;
      # otherwise the historical login-keychain path runs UNCHANGED.
      - name: Determine macOS signing mode
        id: signmode
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          SECRETS_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && 'true' || 'false' }}
        run: |
          echo "secrets_signing=$SECRETS_SIGNING" >> "$GITHUB_OUTPUT"
          if [ "$SECRETS_SIGNING" = "true" ]; then
            echo "::notice::macOS signing mode: secrets-based Developer ID (.p12 → temp keychain)"
          else
            echo "::notice::macOS signing mode: login-keychain Developer ID (APPLE_DEVELOPER_ID_CERT_P12 not set)"
          fi

      - name: Fetch branding icons from artifactory
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: actions/checkout@v4
        with:
          repository: Tanvrit/artifactory
          path: _branding
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          sparse-checkout: branding/icons/dist/${{ inputs.product }}

      - name: Copy icons to expected path
        if: steps.guard.outputs.supported == 'true'
        run: |
          mkdir -p ${{ inputs.gradle_module }}/icons
          ICON="_branding/branding/icons/dist/${{ inputs.product }}/macos/${{ inputs.product }}.icns"
          [ -f "$ICON" ] && cp "$ICON" ${{ inputs.gradle_module }}/icons/ || true

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY || '' }}

      # Resolve the "Developer ID Application" identity already present in
      # the macOS runner login keychain (created via the signed-in Xcode account).
      # No cert import — jpackage's codesign step picks up SIGNING_IDENTITY.
      # Skipped when secrets-based signing is active.
      - name: Resolve local signing identity
        id: signing
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.secrets_signing != 'true'
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the macOS runner login keychain. Sign into the Apple Developer account in Xcode and create the certificate (one-time bootstrap)."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "✓ Using local identity: $IDENTITY"

      # Secrets-based path: import the Developer ID .p12 into a temporary keychain,
      # derive SIGNING_IDENTITY from it, and store notarytool credentials in a
      # temp profile. Exports SIGNING_IDENTITY + NOTARY_PROFILE for the build +
      # notarize steps below. Runs only when the cert secrets are provisioned.
      - name: Import Developer ID cert + notary creds (secrets)
        id: macsign
        if: steps.guard.outputs.supported == 'true' && steps.signmode.outputs.secrets_signing == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail
          SIGN_KEYCHAIN="$RUNNER_TEMP/macos-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$SIGN_KEYCHAIN"
          # Prepend to the user search list, preserving the existing keychains.
          security list-keychains -d user -s "$SIGN_KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          # Import the Developer ID Application .p12.
          P12="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$SIGN_KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$P12"
          # Allow codesign/productsign to use the private key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$SIGN_KEYCHAIN" >/dev/null
          # Derive the identity from the freshly-imported keychain.
          IDENTITY=$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            IDENTITY="${MACOS_DEVELOPER_ID_APPLICATION:-}"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported .p12 (APPLE_DEVELOPER_ID_CERT_P12) and MACOS_DEVELOPER_ID_APPLICATION not set."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          echo "✓ Imported Developer ID identity from secret: $IDENTITY"
          # Store notarytool credentials in a temp profile inside the temp keychain.
          NOTARY_PROFILE="tanvrit-notary-ci"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$SIGN_KEYCHAIN"
          echo "NOTARY_PROFILE=$NOTARY_PROFILE" >> "$GITHUB_ENV"
          echo "✓ Stored notarytool credentials in profile: $NOTARY_PROFILE"

      - name: Build macOS DMG (arm64)
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        run: |
          ./gradlew :${{ inputs.gradle_module }}:packageDmg \
            -PappVersion=${{ inputs.version }} \
            --no-daemon --no-configuration-cache

      - name: Rename artifact
        if: steps.guard.outputs.supported == 'true'
        id: rename
        run: |
          DMG=$(find ${{ steps.guard.outputs.module_dir }}/build/compose/binaries -name "*.dmg" | head -1)
          ARTIFACT="${{ inputs.product }}-${{ inputs.version }}-macos-arm64.dmg"
          mv "$DMG" "$ARTIFACT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # Notarize + staple using a notarytool keychain profile. Default path uses
      # the profile pre-created on the macOS runner (inputs.notary_profile,
      # "tanvrit-notary"); the secrets path uses the temp profile written to
      # NOTARY_PROFILE above. Stapling rewrites the DMG, so the checksum is
      # computed AFTER this step.
      - name: Notarize + staple DMG
        if: steps.guard.outputs.supported == 'true'
        env:
          NOTARY_PROFILE: ${{ env.NOTARY_PROFILE || inputs.notary_profile }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.rename.outputs.artifact_name }}"
          xcrun notarytool submit "$ARTIFACT" \
            --keychain-profile "$NOTARY_PROFILE" \
            --wait
          xcrun stapler staple "$ARTIFACT"

      - name: Checksum artifact
        if: steps.guard.outputs.supported == 'true'
        run: |
          ARTIFACT="${{ steps.rename.outputs.artifact_name }}"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"

      # Upload notarized DMG to App Store Connect using xcrun altool + ASC API key.
      # The DMG has already been notarized + stapled above, so it's accepted by ASC.
      # Authentication: API Key stored at ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
      # on the macOS runner — no secret import needed. Step is skipped gracefully
      # if asc_api_key_id is empty or the .p8 file is missing.
      # NOT continue-on-error. This ships a DELIVERABLE to Apple, and it carried
      # the same third swallow that was removed from the GitHub Release upload
      # below: an altool rejection (bad entitlements, duplicate build number,
      # expired certificate) reported GREEN, so a release looked complete while
      # nothing reached App Store Connect.
      #
      # The two SKIPS above and below are legitimate and kept: a product that
      # does not ship to Apple leaves asc_api_key_id empty, and a runner without
      # the AuthKey .p8 genuinely cannot upload (that path exits 0 with a
      # ::warning::). What is gone is failure-swallowing once an upload is
      # actually attempted — from there, its failure is the job's failure.
      - name: Upload to App Store Connect (xcrun altool)
        if: steps.guard.outputs.supported == 'true' && inputs.asc_api_key_id != ''
        env:
          ASC_API_KEY_ID: ${{ inputs.asc_api_key_id }}
          ASC_API_ISSUER_ID: ${{ inputs.asc_api_issuer_id }}
          ARTIFACT: ${{ steps.rename.outputs.artifact_name }}
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          if [[ ! -f "$KEY_FILE" ]]; then
            echo "::warning::App Store upload skipped — AuthKey_${ASC_API_KEY_ID}.p8 not found at $KEY_FILE. Place the .p8 file on the macOS runner to enable uploads."
            exit 0
          fi
          echo "Uploading $ARTIFACT to App Store Connect..."
          xcrun altool --upload-package "$ARTIFACT" \
            --type macos \
            --apiKey  "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose
          echo "✓ Uploaded to App Store Connect"

      # ── Deliverable honesty gate (2026-08-13) ─────────────────────────────
      # The upload below used to stack three swallows: an
      # `env.ARTIFACTS_TOKEN_PRESENT == 'true'` guard (silent skip when the
      # secret is absent), `continue-on-error: true` (ignore any failure) and
      # `fail_on_unmatched_files: false` (ignore a missing binary). Between
      # them the native release fleet reported GREEN while attaching nothing —
      # ARTIFACTS_REPO_TOKEN exists only in Tanvrit/artifactory, and the 21
      # consuming repos had produced 2 GitHub Releases in total.
      # A report may be best-effort. A DELIVERABLE may not: a release with no
      # installer attached is a failed release and must say so.
      - name: Verify release upload preconditions
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
          CALLER_REPO: ${{ github.repository }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          fail=0
          if [ "${ARTIFACTS_TOKEN_PRESENT}" != "true" ]; then
            echo "::error::ARTIFACTS_REPO_TOKEN is empty in ${CALLER_REPO} — the ${PRODUCT} ${VERSION} macOS installer cannot be attached to the Tanvrit/artifactory GitHub Release. Add a REPO-level secret named ARTIFACTS_REPO_TOKEN (a PAT with contents:write on Tanvrit/artifactory) under Settings -> Secrets and variables -> Actions in ${CALLER_REPO}. Org secrets are not injected into private repos on the free plan, so they arrive empty. This step used to skip silently — that is how the fleet reported green while shipping nothing."
            fail=1
          fi
          for f in "${PRODUCT}-${VERSION}-macos-arm64.dmg" "${PRODUCT}-${VERSION}-macos-arm64.dmg.sha256"; do
            if [ ! -s "$f" ]; then
              echo "::error::Deliverable missing or empty: ${f} — a release with no installer attached is a failed release."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Release upload preconditions OK for ${PRODUCT} ${VERSION} (macos-arm64)."

      - name: Upload to GitHub Release
        if: steps.guard.outputs.supported == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Tanvrit/artifactory
          tag_name: ${{ inputs.product }}-v${{ inputs.version }}
          name: "${{ inputs.product }} v${{ inputs.version }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ inputs.product }}-${{ inputs.version }}-macos-arm64.dmg
            ${{ inputs.product }}-${{ inputs.version }}-macos-arm64.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      # Mirror the release binaries into the R2 bucket that
      # artifacts.tanvrit.com serves from.
      #
      # Why this step is now allowed to fail the job (2026-08-11): it used to be
      # `continue-on-error: true` behind an `R2_KEY_PRESENT` guard, so absent
      # credentials or a failed upload both reported SUCCESS having mirrored
      # nothing. That is not a harmless degradation:
      # `scripts/update-manifest.js` writes an `r2_url` into every manifest
      # UNCONDITIONALLY and `worker/src/index.js` PREFERS `r2_url` over the
      # GitHub-Releases `direct_url`, so a skipped mirror publishes a release
      # whose download link points at an object that was never uploaded. This
      # exact defect bit tanvrit/ai in production — three installers had to be
      # mirrored by hand after a "successful" release. The binaries are already
      # attached to the GitHub Release by the step above, so a red mirror step
      # loses no artifact; it only reports, truthfully, that the CDN download
      # links for this release will not work.
      #
      # Auth is the R2 S3-compatible API via `curl --aws-sigv4`, not the `aws`
      # CLI: curl is present on every runner in the fleet (including the Windows
      # runner under `shell: bash`), whereas the AWS CLI is not installed on the
      # self-hosted nodes — a missing `aws` binary was one more failure the old
      # continue-on-error swallowed.
      - name: Mirror to Cloudflare R2
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          acct="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
          if [ -z "$acct" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 mirror cannot run — set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CF_ACCOUNT_ID as REPO-level secrets on this repository (org secrets are not injected into private repos on the free plan, so they arrive empty). The manifest for ${PRODUCT} ${VERSION} advertises an r2_url regardless, so without this mirror every dl.tanvrit.com download for it would 404."
            exit 1
          fi
          # curl must be able to sign S3 requests. Without --aws-sigv4 (curl
          # >= 7.75.0) every PUT below dies in the transport layer and reports
          # "HTTP 000" — which reads like a network blip rather than a runner
          # missing a curl feature. Checked via a captured string, NOT a pipe
          # into grep: `set -o pipefail` + `grep -q` closing the pipe early
          # makes curl exit 141 and would fail this check spuriously.
          curl_help="$(curl --help all 2>/dev/null || true)"
          case "$curl_help" in
            *--aws-sigv4*) ;;
            *) echo "::error::curl on this runner cannot sign S3 requests — no --aws-sigv4 support (needs curl >= 7.75.0). Found: $(curl --version 2>/dev/null | head -1). Upgrade curl on this runner; the R2 mirror cannot run without it."; exit 1 ;;
          esac
          host="https://${acct}.r2.cloudflarestorage.com"
          prefix="releases/${PRODUCT}/${VERSION}"
          mirrored=0
          for f in ${PRODUCT}-${VERSION}-macos-arm64.dmg ${PRODUCT}-${VERSION}-macos-arm64.dmg.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced by this build — it cannot be mirrored, and the manifest will advertise a download link for it."
              exit 1
            fi
            key="${prefix}/${f}"
            url="${host}/tanvrit-artifacts/${key}"
            echo "Mirroring $f -> r2://tanvrit-artifacts/${key}"
            # Truncate the response-body sink first. `curl -o` only creates the
            # file once a body actually arrives, so a transport-level failure
            # (HTTP 000) leaves the PREVIOUS file's error body in place and the
            # handler below prints it — reporting the wrong reason for the
            # failure. Verified: an R2 401 body from an earlier object was
            # printed under a later "HTTP 000".
            : > /tmp/r2-put.log
            code=$(curl -sS -o /tmp/r2-put.log -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 300 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$f" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::R2 PUT for $key returned HTTP ${code:-000}"
              head -c 800 /tmp/r2-put.log 2>/dev/null || true
              exit 1
            fi
            # Read the object back. A 200 on the PUT is not proof the object is
            # there — only a successful read is, and that is what decides
            # whether a user can actually download this release.
            back=$(curl -sS -r 0-0 -D /tmp/r2-get.h -o /dev/null -w '%{http_code}' \
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
              --retry 3 --retry-delay 5 \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              "$url" || true)
            if [ "$back" != "206" ] && [ "$back" != "200" ]; then
              echo "::error::Uploaded $key but it does not read back from R2 (HTTP ${back:-000}) — downloads for this release would 404."
              exit 1
            fi
            local_size=$(wc -c < "$f" | tr -d ' ')
            remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Rr]ange:.*/\([0-9][0-9]*\)$|\1|p' | tail -1)
            if [ -z "$remote_size" ]; then
              remote_size=$(tr -d '\r' < /tmp/r2-get.h | sed -n 's|^[Cc]ontent-[Ll]ength: *\([0-9][0-9]*\)$|\1|p' | tail -1)
            fi
            if [ -n "$remote_size" ] && [ "$remote_size" != "$local_size" ]; then
              echo "::error::Size mismatch for $key — local ${local_size} bytes, R2 ${remote_size} bytes. The mirrored object is truncated."
              exit 1
            fi
            echo "Verified r2://tanvrit-artifacts/${key} (${local_size} bytes)"
            mirrored=$((mirrored + 1))
          done
          if [ "$mirrored" -eq 0 ]; then
            echo "::error::R2 mirror uploaded nothing for ${PRODUCT} ${VERSION} — none of the expected artifacts existed on disk."
            exit 1
          fi
          echo "Mirrored and verified ${mirrored} object(s) under r2://tanvrit-artifacts/${prefix}/"

      - name: Dispatch manifest update
        if: steps.guard.outputs.supported == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ inputs.version }}",
              "platform": "macos-arm64",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}",
              "release_notes": "${{ inputs.release_notes }}",
              "release_notes_hi": "${{ inputs.release_notes_hi }}"
            }
