name: Audit caller secrets

# Every platform repo calls this repo's reusable release templates with `secrets: inherit`.
# `inherit` forwards only the secrets the CALLING repo defines, and organisation secrets are
# NOT injected into private repos on the GitHub Free plan — so each caller must carry its own
# ARTIFACTS_REPO_TOKEN / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / CF_ACCOUNT_ID. A caller that
# is missing them does not fail its release; it uploads nothing and reports success. This job
# turns that into a scheduled, visible red instead of a discovery at release time.
#
# TOKEN SCOPES — read before "fixing" a 403:
#   * `/orgs/{org}/…` endpoints need `admin:org`, which neither GITHUB_TOKEN nor the standard
#     PAT carries; they return 403. The audit therefore uses ONLY per-user/per-repo endpoints.
#   * `GET /repos/{o}/{r}/actions/secrets` needs ADMIN on that repo. The built-in GITHUB_TOKEN
#     is scoped to THIS repo only, so it can audit exactly one caller. A PAT with `repo` owned
#     by an org admin is required for fleet coverage — provide it as AUDIT_FLEET_TOKEN.
#     Without it, this workflow still runs and honestly reports the other callers as
#     "not readable" rather than pretending they are provisioned.

on:
  schedule:
    # 07:15 UTC Mondays — before the week's releases, after any weekend provisioning.
    - cron: '15 7 * * 1'
  workflow_dispatch:
    inputs:
      fail_on_missing:
        description: 'Fail the run when a caller is unprovisioned (default true)'
        type: boolean
        default: true
      org:
        description: 'GitHub org/owner to scan'
        type: string
        default: 'Tanvrit'
  push:
    # Keep the audit honest when its own logic or the templates it derives from change.
    branches: [main]
    paths:
      - 'scripts/audit-caller-secrets.mjs'
      - '.github/workflows/audit-caller-secrets.yml'
      - '.github/workflows/release-*-template.yml'

permissions:
  contents: read
  # Lets the built-in token read THIS repo's own secret names when no PAT is supplied.
  actions: read

concurrency:
  group: audit-caller-secrets
  cancel-in-progress: false

jobs:
  audit:
    name: Caller secret provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Controls first: a crawl that matches nothing would report a clean fleet.
      # This asserts the detector fires on a real `uses:` and does NOT fire on a
      # commented one, and that requirement-derivation still finds the templates.
      - name: Self-test the probe
        run: node scripts/audit-caller-secrets.mjs --self-test

      # Pick the first candidate that ACTUALLY authenticates. A plain `a || b` fallback
      # picks a non-empty secret even when it is expired — the first CI run of this
      # workflow went red on a 401 from a stale ARTIFACTS_REPO_TOKEN, which looks
      # identical to "the fleet is unprovisioned" unless you read the log. Never again.
      - name: Audit
        id: audit
        env:
          # Candidates, in preference order. Selection happens inside the step so the
          # chosen value never lands in $GITHUB_ENV / on disk between steps.
          T_FLEET: ${{ secrets.AUDIT_FLEET_TOKEN }}
          T_ARTIFACTS: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          T_BUILTIN: ${{ github.token }}
          AUDIT_ORG: ${{ inputs.org || 'Tanvrit' }}
        run: |
          export GH_TOKEN="$T_BUILTIN"
          source_name="GITHUB_TOKEN (fallback)"
          for name in T_FLEET T_ARTIFACTS; do
            val="${!name}"
            if [ -z "$val" ]; then echo "  $name: not set"; continue; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $val" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/user)
            echo "  $name: GET /user -> $code"
            if [ "$code" = "200" ]; then GH_TOKEN="$val"; source_name="$name"; break; fi
          done
          echo "token source: $source_name"
          if [ "$source_name" = "GITHUB_TOKEN (fallback)" ]; then
            echo "::warning title=No fleet token::Neither AUDIT_FLEET_TOKEN nor ARTIFACTS_REPO_TOKEN authenticates. GITHUB_TOKEN cannot enumerate the fleet, so the audit will report a credential problem (exit 3) rather than a false clean."
          fi
          set +e
          node scripts/audit-caller-secrets.mjs --json audit-result.json
          code=$?
          set -e
          echo "audit exit code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload machine-readable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caller-secret-audit
          path: audit-result.json
          if-no-files-found: warn

      # Fail loudly by design. This is a canary whose entire purpose is to be red while the
      # fleet is unprovisioned; a warning-only version reproduces the silent-success failure
      # mode it was built to remove (and scheduled runs nobody looks at produce no signal at
      # all unless they fail — a failing scheduled run is what emails the owner). Set the
      # dispatch input `fail_on_missing=false` for an informational run.
      - name: Verdict
        run: |
          code="${{ steps.audit.outputs.code }}"
          case "$code" in
            0)
              echo "All release-template callers are fully provisioned."
              ;;
            1)
              if [ "${{ inputs.fail_on_missing }}" = "false" ]; then
                echo "::warning title=Unprovisioned callers::Gaps found; fail_on_missing=false so not failing. See the job summary."
                exit 0
              fi
              echo "::error title=Unprovisioned release callers::At least one caller repo is missing shared release secrets — its releases will silently upload nothing. See the job summary for the exact 'gh secret set' commands."
              exit 1
              ;;
            3)
              echo "::error title=Audit could not run (credentials)::The token was rejected or is the wrong type, so NOTHING was audited. This is not a fleet result. Add a user PAT with 'repo' scope as the AUDIT_FLEET_TOKEN secret, or rotate ARTIFACTS_REPO_TOKEN."
              exit 1
              ;;
            *)
              echo "::error title=Audit crashed::Unexpected exit code $code — see the Audit step log."
              exit 1
              ;;
          esac
