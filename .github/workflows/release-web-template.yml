# ─────────────────────────────────────────────────────────────
# Reusable Workflow: Build + deploy Web (Cloudflare Pages)
#
# Caller example (per-platform release-web.yml):
#   jobs:
#     release:
#       uses: Tanvrit/artifactory/.github/workflows/release-web-template.yml@main
#       with:
#         product: friendly
#         gradle_task: ':composeApp:patchWasmIndexHtml'
#         wasm_output_dir: 'composeApp/build/dist/wasmJs/productionExecutable'
#         landing_build_dir: 'web'                # optional — when set, npm run build + merge web/out/ into dist/
#         cf_project_name: 'friendly-app'
#         assemble_script: 'scripts/assemble-dist.sh'  # optional — overrides default merge logic
#       secrets: inherit
#
# Deploys on push to main (NOT version tags) since web is always-live, and on a
# caller's workflow_dispatch — dispatching a workflow named "Release Web" is a
# deliberate request for a release, and for four days in Aug 2026 it silently
# was not one. Any other event builds without shipping.
# Version passed to update-manifest is git rev-parse --short HEAD.
#
# Graceful-skip guard: bails out cleanly if composeApp's build.gradle.kts
# doesn't declare wasmJs() (no Web target).
# ─────────────────────────────────────────────────────────────

name: Release Web (Reusable — Cloudflare Pages)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      gradle_task:
        description: 'Gradle task that produces the Wasm/JS web bundle (default: wasmJsBrowserDistribution)'
        type: string
        required: false
        default: ':composeApp:wasmJsBrowserDistribution'
      gradle_module:
        type: string
        required: false
        default: 'composeApp'
      wasm_output_dir:
        description: 'Path to the Wasm/JS distribution output relative to repo root'
        type: string
        required: false
        default: 'composeApp/build/dist/wasmJs/productionExecutable'
      landing_build_dir:
        description: 'Optional landing-site directory (e.g. "web/"). When set, npm ci + next build runs there and web/out/ is merged with the wasm dist.'
        type: string
        required: false
        default: ''
      cf_project_name:
        description: 'Cloudflare Pages project name (e.g. "friendly-app", "tanvrit-admin")'
        type: string
        required: true
      cf_branch:
        type: string
        required: false
        default: 'main'
      assemble_script:
        description: 'Optional path to a bash script that assembles dist/. When set, overrides the default merge logic.'
        type: string
        required: false
        default: ''
      runner_labels:
        description: >-
          JSON array of self-hosted runner labels (within the "tanvrit" group) the
          job may run on. Default ["Linux"] keeps the historical behaviour. Pass
          ["self-hosted"] to let macOS self-hosted runners pick up the job when the
          Linux runner is busy/offline (labels are AND-matched, so a label BOTH
          OSes carry — self-hosted — is the only way to allow either). The web build
          is OS-agnostic (Node + Gradle), so macOS is a safe fallback.
        type: string
        required: false
        default: '["Linux"]'
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'When absent, the Deploy step is skipped — workflow still builds artifacts.'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      ARTIFACTS_REPO_TOKEN:
        description: 'When absent, manifest dispatch is skipped.'
        required: false
      GH_PACKAGES_TOKEN:
        description: 'Token for Gradle to pull SDK + core artifacts from GitHub Packages'
        required: false
    outputs:
      deployed:
        description: >-
          'true' only when the Cloudflare Pages upload actually ran AND succeeded.
          A caller must never read a green job as a shipped release: the deploy
          step is gated and continue-on-error, so "built fine, shipped nothing" is
          a perfectly normal green outcome. Gate post-deploy verification on this.
        value: ${{ jobs.release-web.outputs.deployed }}
      bundle:
        description: >-
          Filename of the hashed entry bundle in the assembled dist (e.g.
          composeApp.82be35a232.js), or '' for apps that ship no such bundle.
          A caller can fetch the live site and compare: that is the only check
          which tells "the new build is live" apart from "the old one still is".
        value: ${{ jobs.release-web.outputs.bundle }}

jobs:
  release-web:
    name: Web (Cloudflare Pages)
    outputs:
      deployed: ${{ steps.cf_result.outputs.deployed }}
      bundle: ${{ steps.bundle_id.outputs.bundle }}
    # id-token + attestations are required by actions/attest-build-provenance to
    # mint the SLSA provenance attestation via the GitHub Sigstore instance.
    # contents/packages:read preserve the existing checkout + Gradle package reads.
    # Callers using `secrets: inherit` must ALSO grant these on their calling job
    # (permissions: { id-token: write, attestations: write }) for the attestation
    # to actually be issued; until then the step is best-effort (continue-on-error).
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    runs-on:
      group: tanvrit
      labels: ${{ fromJSON(inputs.runner_labels) }}
    # Reusable template: `runs-on` resolves against the CALLING repository's runners,
    # not artifactory's, so the self-hosted request here is satisfiable and is left
    # alone — proven by tanvrit/swyft run 31726541046 ("Release Web", success, 17m32s).
    # What was missing is a ceiling: without `timeout-minutes` a wedged job inherits
    # GitHub's 6h default and holds a scarce shared runner for that whole time.
    # Observed Release Web durations across swyft/friendly: 2-52 min. 90 clears the
    # worst real run by ~40 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify target supported
        id: guard
        shell: bash
        run: |
          # Translate gradle-path (`ui:ui-android`) to filesystem path (`ui/ui-android`)
          BUILD_FILE="$(echo '${{ inputs.gradle_module }}' | tr ':' '/')/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then
            echo "::notice::skipped: $BUILD_FILE not found for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE 'wasmJs\s*\{|wasmJs\(\)|^\s*js\s*\{' "$BUILD_FILE"; then
            echo "::notice::skipped: no wasmJs() or js() target declared in $BUILD_FILE — Web deploy cannot run for ${{ inputs.product }}"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.supported == 'true'
        with: { distribution: zulu, java-version: '21' }
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.supported == 'true'
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.supported == 'true'

      - name: Build Wasm/JS bundle
        if: steps.guard.outputs.supported == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        # --no-configuration-cache: Kotlin/Wasm + Gradle 9.x + CMP 1.11.0 hits
        # "Failed to query the value of task ':kotlinWasmNpmInstall' property
        # 'packageJsonFiles'" when configuration cache is on. Disabling per-build
        # so every consumer of this template builds clean; the local deploy.sh
        # already passes --no-daemon for the same reason.
        run: ./gradlew ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache

      - name: Build landing site
        if: steps.guard.outputs.supported == 'true' && inputs.landing_build_dir != ''
        run: |
          cd ${{ inputs.landing_build_dir }}
          npm ci
          npm run build

      - name: Assemble distribution (custom script)
        if: steps.guard.outputs.supported == 'true' && inputs.assemble_script != ''
        run: |
          chmod +x "${{ inputs.assemble_script }}"
          "${{ inputs.assemble_script }}"

      - name: Assemble distribution (default merge logic)
        if: steps.guard.outputs.supported == 'true' && inputs.assemble_script == ''
        run: |
          rm -rf dist
          if [ -n "${{ inputs.landing_build_dir }}" ]; then
            mkdir -p dist/app
            cp -r "${{ inputs.landing_build_dir }}"/out/. dist/
            cp -r "${{ inputs.wasm_output_dir }}"/. dist/app/

            # ── SPA fallback for deep /app/<route> URLs ──────────────────────
            # `wrangler pages deploy DIR` reads Functions from DIR/functions/, so
            # a product that ships one must have it COPIED IN — neither the
            # landing `out/` copy above nor the wasm copy carries it.
            #
            # The `_redirects` rule below stays as the fallback for products with
            # NO Function, and is deliberately NOT written when one exists: it
            # would shadow the Function, and platforms/admin's CLAUDE.md records
            # that an `/app/*` rule pointing at index.html 308-canonicalises and
            # then 404s. Which of the two mechanisms is actually load-bearing on
            # Cloudflare today is UNRESOLVED — deep routes on admin.tanvrit.com
            # answered 200 with the app shell on 2026-08-20 while this template
            # was shipping the redirect and no Function at all. Preferring the
            # committed Function is the conservative reading; a product with no
            # Function keeps exactly its current behaviour.
            if [ -d functions ]; then
              cp -r functions dist/functions
              echo "copied Pages Function -> dist/functions (SPA fallback)"
            else
              printf '/app/* /app/index.html 200\n' > dist/_redirects
              echo "no functions/ dir - wrote _redirects SPA rule"
            fi
          else
            mkdir -p dist
            cp -r "${{ inputs.wasm_output_dir }}"/. dist/
          fi

          # ── Cache-proof: content-hash an UNHASHED entry bundle ───────────
          # Some apps' Compose config emits composeApp.js (no hash). Cloudflare's
          # zone Browser-Cache-TTL caches that fixed name for hours regardless of
          # _headers, so a code change stays stale until the TTL expires — and
          # wrangler's OAuth token can't purge. Hash it so every deploy is a NEW
          # URL the edge has never cached. Skips apps whose Compose ALREADY hashes
          # (a composeApp.<hash>.js sibling exists) and non-Compose apps (no
          # composeApp.js). The index.html patch below then repoints the ref.
          find dist -name composeApp.js | while read -r cj; do
            d=$(dirname "$cj")
            ls "$d"/composeApp.*.js 2>/dev/null | grep -vE '\.map$|\.LICENSE' | grep -q . && continue
            if command -v sha256sum >/dev/null 2>&1; then h=$(sha256sum "$cj" | cut -c1-10); else h=$(shasum -a 256 "$cj" | cut -c1-10); fi
            mv "$cj" "$d/composeApp.$h.js"
            [ -f "$d/composeApp.js.map" ] && mv "$d/composeApp.js.map" "$d/composeApp.$h.js.map"
            # Rewrite the bundle's OWN composeApp.js references (its Compose-threading
            # web worker + sourceMappingURL) to the hashed name, else the worker 404s.
            sed -i.bak "s|composeApp\.js|composeApp.$h.js|g" "$d/composeApp.$h.js" && rm -f "$d/composeApp.$h.js.bak"
            echo "hashed unhashed bundle -> composeApp.$h.js in $d"
          done

          # ── Self-consistent index.html + source-map hygiene ──────────────
          # Compose for Web hashes the production bundle (composeApp.<hash>.js)
          # but the generated index.html still references the unhashed
          # composeApp.js, which 404s — leaving a blank app. Patch every
          # index.html under dist to point at the real hashed bundle. This is
          # idempotent: apps whose output already matches are left untouched.
          # Portable across GNU (Linux) and BSD (macOS) coreutils so this runs on
          # either self-hosted runner OS: no `xargs -r` (BSD xargs lacks it) and
          # `sed -i.bak … && rm` (BSD `sed -i` requires a backup-suffix arg; `.bak`
          # works on both). Needed now that runner_labels can select the macOS runner.
          find dist -name index.html | while read -r idx; do
            d=$(dirname "$idx")
            hashed=$(ls "$d"/composeApp.*.js 2>/dev/null | grep -vE '\.map$|\.LICENSE' | head -1)
            [ -n "$hashed" ] && hashed=$(basename "$hashed")
            if [ -n "$hashed" ] && [ "$hashed" != "composeApp.js" ]; then
              sed -i.bak "s|composeApp\.js|$hashed|g" "$idx" && rm -f "$idx.bak"
              echo "patched $idx -> $hashed"
            fi
          done
          # Stub source maps + strip the //# sourceMappingURL pointer so the
          # obfuscated Kotlin source can't be reconstructed from a prod deploy.
          find dist -name '*.js.map' | while read -r m; do printf '{}' > "$m"; done
          find dist -name 'composeApp.*.js' ! -name '*.map' ! -name '*.LICENSE*' | while read -r j; do
            sed -i.bak 's|//#[[:space:]]*sourceMappingURL=.*$||' "$j" && rm -f "$j.bak"
          done

      # Name the artifact this run actually produced, so the caller can verify
      # that THAT is what the live site serves. Without it a release can only
      # check that the domain boots — which the PREVIOUS deploy already
      # guarantees, and which is exactly how a no-op release reads as green.
      - name: Identify assembled bundle
        id: bundle_id
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find dist -name 'composeApp.*.js' ! -name '*.map' ! -name '*.LICENSE*' \
                     -exec basename {} \; 2>/dev/null | sort -u | head -1 || true)
          echo "bundle=${bundle:-}" >> "$GITHUB_OUTPUT"
          echo "::notice::assembled bundle: ${bundle:-<none>}"

      # Tarball the built bundle so the SLSA provenance attestation has a single,
      # stable subject (a directory of many hashed files is awkward to attest).
      # Prefers the assembled dist/; falls back to the raw wasm output dir.
      - name: Package web bundle for attestation
        id: provenance_pkg
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-provenance
          TARBALL="dist-provenance/${{ inputs.product }}-web-bundle.tar.gz"
          if [ -d dist ]; then
            tar -czf "$TARBALL" -C dist .
          elif [ -d "${{ inputs.wasm_output_dir }}" ]; then
            tar -czf "$TARBALL" -C "${{ inputs.wasm_output_dir }}" .
          else
            echo "::warning::No dist/ or ${{ inputs.wasm_output_dir }} found — skipping provenance packaging."
            echo "packaged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "packaged=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Packaged web bundle for provenance → $TARBALL"

      # SLSA build-provenance attestation for the web bundle. Best-effort: if the
      # calling job hasn't granted id-token/attestations write, this fails softly
      # and the build/deploy still succeed (additive, no new secrets required).
      - name: Attest build provenance (SLSA)
        if: steps.guard.outputs.supported == 'true' && steps.provenance_pkg.outputs.packaged == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.provenance_pkg.outputs.tarball }}

      # Which events may ship. `push` alone was the rule, which quietly made
      # `workflow_dispatch` a build-only no-op: it assembled, attested, reported
      # green and deployed NOTHING, while the caller's boot check booted the
      # PREVIOUS release and passed. On 2026-08-30 that stranded a fix on main
      # for four days behind three green runs. Dispatching a workflow named
      # "Release Web" is a deliberate act by a human who wants a release, so it
      # ships. Every other event still only builds.
      - name: Decide whether to deploy
        id: gate
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          event='${{ github.event_name }}'
          case "$event" in
            push|workflow_dispatch) ;;
            *)
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=event '$event' does not release (only push and workflow_dispatch do)" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if [ "$CF_TOKEN_PRESENT" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=CLOUDFLARE_API_TOKEN is not present in this repository" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: cf_deploy
        if: steps.gate.outputs.deploy == 'true'
        # Continue on error so missing Cloudflare project (e.g. tanvrit-shell-app
        # not yet created at the user level) doesn't red the whole pipeline.
        # The Wasm artifact still built successfully; deploy just didn't ship.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The CLOUDFLARE_ACCOUNT_ID secret is unset in most product repos, which
          # made wrangler POST to /accounts//pages/... (empty id → API error 7003)
          # and — because this step is continue-on-error — the run went GREEN while
          # NOTHING deployed. All Tanvrit CF Pages projects live under one account,
          # so fall back to that shared id (also documented in each app's CLAUDE.md)
          # when the secret isn't provisioned.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ce3f0ef57641c98d52af95c069bbb6a2' }}
          command: pages deploy dist --project-name=${{ inputs.cf_project_name }} --branch=${{ inputs.cf_branch }}

      # The deploy is continue-on-error, and it is gated, so BOTH "never ran" and
      # "ran and failed" leave the job green. The old notice covered exactly one
      # of those (missing token, on a push) and was itself skipped in every other
      # case — so the most common way to ship nothing announced nothing. Say
      # which of the three happened, every time, and publish it as an output so
      # the caller can act on it instead of inferring from the job's colour.
      - name: Report deploy result
        id: cf_result
        if: steps.guard.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.cf_deploy.outcome }}' = 'success' ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::deployed ${{ inputs.product }} to Cloudflare Pages project '${{ inputs.cf_project_name }}'"
          elif [ '${{ steps.gate.outputs.deploy }}' = 'true' ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare Pages deploy FAILED for '${{ inputs.cf_project_name }}' — the build is green but NOTHING shipped."
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::did not deploy: ${{ steps.gate.outputs.reason }} — built dist/ but NOTHING shipped."
          fi

      # Gated on an ACTUAL deploy, not on the event: the manifest advertises what
      # is live, and publishing it for a run that shipped nothing would describe
      # a release that does not exist.
      - name: Dispatch manifest update
        if: steps.cf_result.outputs.deployed == 'true' && env.ARTIFACTS_TOKEN_PRESENT == 'true'
        # Continue on error — the manifest update is a nice-to-have; token may
        # lack cross-repo dispatch permission. Main artifact already built.
        continue-on-error: true
        env:
          ARTIFACTS_TOKEN_PRESENT: ${{ secrets.ARTIFACTS_REPO_TOKEN != '' && 'true' || 'false' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          repository: Tanvrit/artifactory
          event-type: update-manifest
          client-payload: |
            {
              "product": "${{ inputs.product }}",
              "version": "${{ github.sha }}",
              "platform": "web",
              "build": "${{ github.run_number }}",
              "released_at": "${{ github.event.head_commit.timestamp || '' }}"
            }
