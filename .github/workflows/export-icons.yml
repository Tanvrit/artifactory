name: Export Icons

on:
  push:
    paths:
      - 'branding/icons/src/**'
      - 'scripts/generate-icons.js'
      - 'scripts/package.json'
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: 'Product slug to regenerate (leave blank for all)'
        required: false
        default: ''

# The "Commit generated icons" step pushes regenerated assets back to main.
# This repo's default workflow permission is READ
# (`actions/permissions/workflow` -> default_workflow_permissions: "read"), so
# git-auto-commit-action's push 403s:
#   remote: Permission to Tanvrit/artifactory.git denied to github-actions[bot].
#   fatal: unable to access 'https://github.com/Tanvrit/artifactory/':
#   The requested URL returned error: 403
#   Error: Invalid status code: 128
# — run 35578445109 (2026-09-21), which generated and verified every icon
# correctly and then could not commit a byte of it. update-manifest.yml and
# generate-tokens.yml both already carry this identical declaration for the
# identical reason; this is the third and last workflow in the repo that
# commits without having asked for the grant.
#
# Scoped to contents only: nothing here needs packages, issues or pull-requests
# write. The "Notify product repos" step reaches OTHER repos and cannot be
# served by this token at all — it uses ARTIFACTS_REPO_TOKEN.
permissions:
  contents: write

# One run per ref at a time: two overlapping runs would both regenerate, race
# each other's commit to main and upload to R2 twice. Queue, never cancel —
# this job commits and publishes.
concurrency:
  group: export-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Platform Icons
    runs-on:
      group: tanvrit
      # Linux X64 since 2026-09-24. Until then this was [self-hosted, macOS, X64]
      # (`macmini`, an x86_64 runner agent under Rosetta 2 on the fleet's
      # scarcest pool), and the pin was right for the code it ran:
      #   * .icns came from `iconutil`, which exists only on macOS. The non-darwin
      #     branch required `makeicns`, which was never a dependency, and
      #     verify-assets.js downgraded a missing .icns to a warning off macOS —
      #     so a Linux run would have gone green with no .icns at all.
      #   * Inkscape came from `brew install --cask`.
      # Neither holds now. generate-icons.js writes .icns itself (writeIcns: the
      # same ten entries iconutil wrote into the committed files, checked by
      # round-tripping the output through `iconutil -c iconset`), verify-assets.js
      # fails a missing or malformed .icns on every OS, and Inkscape is the
      # pinned, sha256-checked AppImage below. Nothing here needs a mac.
      #
      # X64, never a bare `Linux`: that label set also matches the ARM64 GX10,
      # and the Inkscape AppImage is x86_64-only.
      labels: [self-hosted, Linux, X64]
    # The last mac run (35875810338, 2026-09-23) generated every icon in about a
    # minute and was then cancelled by this timeout 44 minutes into the R2
    # upload. The upload step below explains the fix.
    timeout-minutes: 45
    env:
      INKSCAPE_VERSION: '1.4.4'
      # https://inkscape.org/release/inkscape-1.4.4/gnulinux/appimage/dl/ — the
      # sha256 below is the one published on that page.
      INKSCAPE_APPIMAGE_URL: 'https://media.inkscape.org/dl/resources/file/Inkscape-1.4.4.AppImage'
      INKSCAPE_APPIMAGE_SHA256: 'd217fe05c92faaed5c3af46856b6299c98933dc722819cb5bc2ca052c5522166'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # runner1..10 on the X64 host are processes of one OS sharing HOME=/root,
      # so shared tool homes race under concurrency, and the root disk is nearly
      # full. The npm cache is per runner (npm ci checks every tarball against the
      # lockfile's integrity hash) and the Inkscape download is shared but
      # sha256-checked, both on the /var/lib/vz pool. Falls back to $HOME if that
      # is not writable. This workflow only runs on trusted events (push to main,
      # dispatch), never on a pull request.
      - name: Per-runner cache directories
        run: |
          set -euo pipefail
          base=/var/lib/vz/ci
          if ! { mkdir -p "$base/npm-cache/$RUNNER_NAME" "$base/tools" && [ -w "$base/tools" ]; } 2>/dev/null; then
            base="$HOME/.ci-cache"
            mkdir -p "$base/npm-cache/$RUNNER_NAME" "$base/tools"
          fi
          echo "npm_config_cache=$base/npm-cache/$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CI_TOOLS_DIR=$base/tools" >> "$GITHUB_ENV"
          echo "cache base: $base"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No `cache: npm`: the Actions cache is slow on self-hosted runners, and
          # npm's own cache is already persistent and per runner (step above).

      - name: Install Inkscape (for Wedding icon SVG filters)
        run: |
          set -euo pipefail

          # Only the downloaded AppImage is shared between runs, and it is
          # re-verified against the pinned sha256 on every run. The extracted tree
          # that actually executes lives in this job's $RUNNER_TEMP, so nothing
          # another job left on the shared host can run here with this job's
          # contents:write token and Cloudflare credentials in scope.
          cache="$CI_TOOLS_DIR/Inkscape-$INKSCAPE_VERSION.AppImage"
          if ! echo "$INKSCAPE_APPIMAGE_SHA256  $cache" | sha256sum -c --status - 2>/dev/null; then
            tmp="$(mktemp "$CI_TOOLS_DIR/.Inkscape-$INKSCAPE_VERSION.XXXXXX")"
            trap 'rm -f "$tmp"' EXIT
            curl -fsSL --retry 3 -o "$tmp" "$INKSCAPE_APPIMAGE_URL"
            echo "$INKSCAPE_APPIMAGE_SHA256  $tmp" | sha256sum -c -
            # rename() is atomic, so a concurrent run sees the old file or the new
            # one, never a partial download.
            mv -f "$tmp" "$cache"
          fi

          # Copy, then verify the copy: what runs is exactly what was checked,
          # even if another runner replaces the cache in between.
          app="$RUNNER_TEMP/Inkscape.AppImage"
          cp "$cache" "$app"
          echo "$INKSCAPE_APPIMAGE_SHA256  $app" | sha256sum -c -
          chmod +x "$app"
          # Extract rather than mount: no FUSE, no root needed.
          (cd "$RUNNER_TEMP" && ./Inkscape.AppImage --appimage-extract >/dev/null)
          rm -f "$app"

          bin="$RUNNER_TEMP/inkscape-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$RUNNER_TEMP" > "$bin/inkscape"
          chmod +x "$bin/inkscape"
          echo "$bin" >> "$GITHUB_PATH"

          # Assert, do not assume. Under GITHUB_ACTIONS generate-icons.js now
          # fails on a missing or failing inkscape instead of falling back to
          # sharp, which cannot render the Wedding icon's SVG filters.
          "$bin/inkscape" --version

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Generate icons
        env:
          PRODUCT: ${{ github.event.inputs.product }}
        run: |
          if [ -n "$PRODUCT" ]; then
            node scripts/generate-icons.js --product "$PRODUCT"
          else
            node scripts/generate-icons.js --all
          fi

      - name: Verify generated assets
        run: node scripts/verify-assets.js

      # Bytes vs pixels: a regeneration on another machine or library version
      # rewrites many files whose pixels barely move. compare-dist.js decodes
      # each changed raster in both versions and says which ones visibly changed.
      - name: Summarise changes
        run: |
          report="$(node scripts/compare-dist.js)"
          echo "$report"
          { echo '```'; echo "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # main only. A dispatch on any other branch is a dry run: it proves the
      # generator on this runner and reports the diff above, and must not push
      # bot commits onto someone's branch or publish to the CDN.
      - name: Commit generated icons
        id: commit
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(icons): regenerate dist assets [skip ci]"
          file_pattern: "branding/icons/dist/**"
          commit_user_name: "tanvrit-bot"
          commit_user_email: "bot@tanvrit.com"

      - name: Upload to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          # This repository has no `CF_R2_TOKEN` / `CF_ACCOUNT_ID` secret — the only
          # Cloudflare credentials attached are CLOUDFLARE_API_TOKEN and
          # CLOUDFLARE_ACCOUNT_ID (verified with `gh secret list`). Referencing the
          # non-existent pair meant wrangler ran completely unauthenticated. Prefer the
          # R2-specific names if they are ever added, fall back to what actually exists.
          # Same fix as update-manifest.yml.
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail

          export CLOUDFLARE_API_TOKEN="${CF_R2_TOKEN:-${CLOUDFLARE_API_TOKEN_FALLBACK:-}}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID_FALLBACK:-}}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Branding R2 sync cannot run — set CF_R2_TOKEN + CF_ACCOUNT_ID (or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID) as REPO-level secrets. The committed icons are correct but artifacts.tanvrit.com serves /brand/* from R2, so the CDN would keep serving the previous assets."
            exit 1
          fi

          # Earlier fixes, still load-bearing: run from the repo root (a
          # `working-directory: worker` once made `find` scan a path that does not
          # exist and upload nothing, green); `--remote` (wrangler v4 otherwise
          # writes to local ./.wrangler storage and exits 0); wrangler pinned to v4.
          #
          # Why this step used to time out: it ran `npx --yes wrangler@4` once per
          # object, sequentially — about 3.7 s of npx resolution and wrangler
          # start-up per file, for ~1040 files, i.e. over an hour. Run 35875810338
          # was cancelled at the 45-minute job timeout after 44 minutes of it.
          # Now wrangler is installed once and four uploads run at a time:
          # enough to finish in minutes, few enough to stay well inside
          # Cloudflare's API limit of 1200 requests per 5 minutes.
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler" wrangler@4 >/dev/null
          export WRANGLER="$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler"
          "$WRANGLER" --version

          upload_one() {
            local file="$1" key type attempt err
            key="brand/${file#branding/icons/dist/}"
            # Same types `file --mime-type` produced before, without depending on
            # `file` being installed on the runner.
            case "$file" in
              *.png)  type=image/png ;;
              *.webp) type=image/webp ;;
              *.svg)  type=image/svg+xml ;;
              *.ico)  type=image/vnd.microsoft.icon ;;
              *.icns) type=image/x-icns ;;
              *.json) type=application/json ;;
              *.xml)  type=text/xml ;;
              *)      type=application/octet-stream ;;
            esac
            err="$(mktemp)"
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object put "tanvrit-artifacts/$key" \
                  --file "$file" --content-type "$type" --remote >/dev/null 2>"$err"; then
                rm -f "$err"
                return 0
              fi
              sleep $((attempt * 5))
            done
            echo "::error::R2 upload failed 3 times: $key"
            tail -n 20 "$err"
            rm -f "$err"
            return 1
          }
          export -f upload_one

          TOTAL="$(find branding/icons/dist -type f | wc -l | tr -d ' ')"
          # An empty dist tree means the generator produced nothing. That is a failure,
          # not a no-op — it is exactly what the old step reported as success.
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::branding/icons/dist is empty, so icon generation produced nothing."
            exit 1
          fi

          # xargs exits non-zero if any upload failed, which fails this step.
          # shellcheck disable=SC2016 # $1 is expanded by the inner bash, on purpose
          find branding/icons/dist -type f -print0 \
            | xargs -0 -n 1 -P 4 bash -c 'upload_one "$1"' _
          echo "Uploaded $TOTAL branding objects to R2."

      - name: Notify product repos
        # Only when the icons actually changed. This fans a repository_dispatch out to
        # the product repos; firing it on every no-op regeneration (icon output is
        # deterministic, so most runs commit nothing) is pure noise.
        #
        # Best effort, and it must never turn a run red after the icons are already
        # committed and on the CDN. The list used to name repos that do not exist
        # (tanvrit/friendly, tanvrit/mandee, tanvrit/school, tanvrit/swyft,
        # tanvrit/desipops, tanvrit/bharat-bandhu, tanvrit/wedding all 404 — `gh repo
        # list Tanvrit`, 2026-09-24), so the first dispatch failed the step. It had
        # never surfaced because every recent run failed earlier, in the R2 upload.
        # No product workflow listens for `branding-updated` today (grep of
        # platforms/*, client/* and control on 2026-09-24), so nothing is lost when a
        # dispatch fails; each failure is a warning.
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changes_detected == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          BRANDING_SHA: ${{ github.sha }}
        run: |
          for repo in Tanvrit/app-main Tanvrit/app-mandee-biz Tanvrit/app-school Tanvrit/app-swyft Tanvrit/app-desipops Tanvrit/app-wedding Tanvrit/control; do
            if gh api "repos/$repo/dispatches" --method POST \
                --field event_type=branding-updated \
                --field "client_payload[branding_sha]=$BRANDING_SHA" >/dev/null; then
              echo "dispatched branding-updated to $repo"
            else
              echo "::warning::branding-updated dispatch to $repo failed"
            fi
          done
