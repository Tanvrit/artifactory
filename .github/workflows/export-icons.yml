name: Export Icons

on:
  push:
    paths:
      - 'branding/icons/src/**'
      - 'scripts/generate-icons.js'
      - 'scripts/package.json'
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: 'Product slug to regenerate (leave blank for all)'
        required: false
        default: ''

# The "Commit generated icons" step pushes regenerated assets back to main.
# This repo's default workflow permission is READ
# (`actions/permissions/workflow` -> default_workflow_permissions: "read"), so
# git-auto-commit-action's push 403s:
#   remote: Permission to Tanvrit/artifactory.git denied to github-actions[bot].
#   fatal: unable to access 'https://github.com/Tanvrit/artifactory/':
#   The requested URL returned error: 403
#   Error: Invalid status code: 128
# — run 35578445109 (2026-09-21), which generated and verified every icon
# correctly and then could not commit a byte of it. update-manifest.yml and
# generate-tokens.yml both already carry this identical declaration for the
# identical reason; this is the third and last workflow in the repo that
# commits without having asked for the grant.
#
# Scoped to contents only: nothing here needs packages, issues or pull-requests
# write. The "Notify product repos" step reaches OTHER repos and cannot be
# served by this token at all — it uses ARTIFACTS_REPO_TOKEN.
permissions:
  contents: write

jobs:
  generate:
    name: Generate Platform Icons
    # GitHub-HOSTED macOS. This job does genuinely need macOS, but it does not need
    # the self-hosted pool — and asking for the pool is what killed it.
    #
    # Why it cannot move to Linux (checked against the generator, not assumed):
    # `scripts/generate-icons.js:311` shells out to `iconutil -c icns`, which exists
    # only on macOS. Its non-darwin branch (:319) falls back to `require('makeicns')`,
    # and `makeicns` is NOT in scripts/package.json — so on Linux that require throws,
    # the catch only logs, and the job would finish GREEN having produced iconsets but
    # no .icns at all. `scripts/verify-assets.js:67-68` would not catch it either: it
    # downgrades every missing .icns to a warning when `process.platform !== 'darwin'`,
    # while 8 products (tanvrit, friendly, desipops, mandee, swyft, school, control,
    # bharat-bandhu) list a .icns as a required asset. A Linux move here is precisely
    # the "green run that did nothing" failure mode, so: macOS.
    #
    # Why NOT `group: tanvrit` + `[self-hosted, macOS]`, which is what this asked for:
    # this repository has ZERO attached self-hosted runners
    # (`GET /repos/Tanvrit/artifactory/actions/runners` → total_count: 0), so that
    # request could never be scheduled. Run 29148550557 (2026-07-11) sat queued and was
    # cancelled at 24h0m1s without executing a step. `macos-latest` supplies both
    # `iconutil` and Homebrew (for the Inkscape step below), so nothing is lost.
    # Do not move this back without first confirming a macOS runner is actually
    # attached to this repo AND in the `tanvrit` group.
    runs-on:
      # Self-hosted macOS. Retargeted 2026-08-22 from macos-latest — hosted
      # runners are not used anywhere in this org. This job needs macOS tooling,
      # so it takes one of the four macOS runners rather than the Linux fleet.
      group: tanvrit
      # X64 pinned 2026-09-21. Unpinned `[self-hosted, macOS]` is the pattern
      # 41da95c already burned us on once, and the mac pool is not homogeneous.
      # Measured, not assumed: `macmini` (Amiteshs-Mac-mini) advertises exactly
      # `self-hosted,macOS,X64` — it served tanvrit/ai run 35519736471's
      # "Build and publish macOS .dmg (x64)" leg under that label set on
      # 2026-09-20, and run 35558445109 here landed on it under this pin.
      #
      # ARM64 is NOT an empty set — that would be the easy wrong reason to pick
      # X64. Two Apple Silicon runners are live and taking work: `macbook second`
      # (tanvrit/ai 35519736471, arm64 .dmg leg, success, 2026-09-20) and
      # `Viveks-MacBook-Pro` (tanvrit/sdk 35570123137, publish-ios, 2026-09-21).
      # X64 is chosen because those two are the fleet's release-critical macs,
      # saturated by the KMP/iOS builds, and a 45-minute icon regeneration has no
      # business competing with a release for them. macmini is the spare.
      #
      # The cost of that choice is real and is paid in the Inkscape step below:
      # macmini's silicon is arm64 (Homebrew poured
      # portable-ruby-4.0.7.arm64_big_sur) while its runner agent is the x86_64
      # build (run 35558851083 resolved Node to _work/_tool/node/24.21.0/x64), so
      # every step here runs translated under Rosetta 2. That step handles it.
      labels: [self-hosted, macOS, X64]
    # Ten products x every platform size, with Inkscape rasterisation, plus a cask
    # install. Generous, but it must bound a hang: this used to burn 24h per run.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # Key the cache on the lockfile, not package.json — `npm ci` below refuses to
          # run without scripts/package-lock.json anyway, and hashing package.json
          # misses lock-only dependency changes.
          cache-dependency-path: scripts/package-lock.json

      - name: Install Inkscape (for Wedding icon SVG filters)
        run: |
          set -euo pipefail

          if command -v inkscape >/dev/null 2>&1; then
            echo "inkscape already present: $(command -v inkscape)"
            exit 0
          fi

          # `brew install --cask inkscape` died outright here:
          #   ##[error]Cannot install under Rosetta 2 in ARM default prefix (/opt/homebrew)!
          #     arch -arm64 brew install ...
          #   To install under x86_64, install Homebrew into /usr/local.
          # — run 35558851083 (2026-09-21), runner `macmini`.
          #
          # The host is Apple Silicon (Homebrew poured
          # portable-ruby-4.0.7.arm64_big_sur) but the Actions runner agent on it
          # is the x86_64 build, so every `run:` step executes translated under
          # Rosetta 2. Homebrew refuses to operate on its native arm64 prefix from
          # an emulated shell, and prints the exact remedy. Take it.
          BREW="$(command -v brew || true)"
          if [ -z "$BREW" ]; then
            echo "::error::Homebrew is not installed on this runner, so Inkscape cannot be installed."
            exit 1
          fi

          RUN_BREW=("$BREW")
          if [ "$(/usr/sbin/sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" = "1" ]; then
            echo "Shell is translated (Rosetta 2) — re-exec'ing brew natively as arm64."
            RUN_BREW=(arch -arm64 "$BREW")
          fi

          "${RUN_BREW[@]}" install --cask inkscape

          # The cask links its CLI into $(brew --prefix)/bin. Put that on PATH for
          # the later steps explicitly: this shell's architecture is not the one
          # brew is installed for, so the prefix is not guaranteed to be inherited.
          BREW_BIN="$("${RUN_BREW[@]}" --prefix)/bin"
          if [ -d "$BREW_BIN" ]; then
            echo "$BREW_BIN" >> "$GITHUB_PATH"
          fi

          # Assert, do not assume. generate-icons.js:169-181 catches a missing
          # `inkscape` binary and falls back to sharp with only a log line, and
          # sharp cannot render the SVG filters the Wedding icon is built from —
          # so an Inkscape that is installed-but-invisible produces a GREEN run
          # that ships a wrong icon. That is the one outcome worse than this step
          # failing.
          if ! command -v inkscape >/dev/null 2>&1 && [ ! -x "$BREW_BIN/inkscape" ]; then
            echo "::error::Inkscape is not on PATH after installing the cask. The Wedding icon would silently fall back to sharp, which cannot render its SVG filters."
            exit 1
          fi
          echo "inkscape resolved to: $(command -v inkscape || echo "$BREW_BIN/inkscape")"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Generate icons
        run: |
          PRODUCT="${{ github.event.inputs.product }}"
          if [ -n "$PRODUCT" ]; then
            node scripts/generate-icons.js --product "$PRODUCT"
          else
            node scripts/generate-icons.js --all
          fi

      - name: Verify generated assets
        run: node scripts/verify-assets.js

      - name: Commit generated icons
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(icons): regenerate dist assets [skip ci]"
          file_pattern: "branding/icons/dist/**"
          commit_user_name: "tanvrit-bot"
          commit_user_email: "bot@tanvrit.com"

      - name: Upload to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          # This repository has no `CF_R2_TOKEN` / `CF_ACCOUNT_ID` secret — the only
          # Cloudflare credentials attached are CLOUDFLARE_API_TOKEN and
          # CLOUDFLARE_ACCOUNT_ID (verified with `gh secret list`). Referencing the
          # non-existent pair meant wrangler ran completely unauthenticated. Prefer the
          # R2-specific names if they are ever added, fall back to what actually exists.
          # Same fix as update-manifest.yml.
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          export CLOUDFLARE_API_TOKEN="${CF_R2_TOKEN:-${CLOUDFLARE_API_TOKEN_FALLBACK:-}}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID_FALLBACK:-}}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Branding R2 sync cannot run — set CF_R2_TOKEN + CF_ACCOUNT_ID (or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID) as REPO-level secrets. The committed icons are correct but artifacts.tanvrit.com serves /brand/* from R2, so the CDN would keep serving the previous assets."
            exit 1
          fi

          # Three bugs fixed here, all of which made this step pass while uploading
          # nothing:
          #  1. `working-directory: worker`. There is no worker/branding — `find` ran
          #     against a path that does not exist. `find` failing inside a pipeline
          #     leaves the `while` loop's exit status at 0, so the step went GREEN
          #     having transferred zero bytes. Run from the repo root instead.
          #  2. `--remote`. Wrangler v4 defaults `r2 object put` to LOCAL storage: it
          #     writes into ./.wrangler and exits 0, again without a byte reaching the
          #     bucket.
          #  3. Unpinned `npx wrangler` resolved whatever major was current. Pin to v4.
          #
          # Sync branding dist to R2 under the /brand/ prefix the worker serves.
          COUNT=0
          while IFS= read -r file; do
            key="brand/${file#branding/icons/dist/}"
            npx --yes wrangler@4 r2 object put "tanvrit-artifacts/$key" \
              --file "$file" \
              --content-type "$(file --mime-type -b "$file")" \
              --remote
            COUNT=$((COUNT + 1))
          done < <(find branding/icons/dist -type f)

          # An empty dist tree means the generator produced nothing. That is a failure,
          # not a no-op — it is exactly what the old step reported as success.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Uploaded 0 objects — branding/icons/dist is empty, so icon generation produced nothing."
            exit 1
          fi
          echo "Uploaded $COUNT branding objects to R2."

      - name: Notify product repos
        # Only when the icons actually changed. This fans a repository_dispatch out to
        # eight product repos and wakes their CI; firing it on every no-op regeneration
        # (icon output is deterministic, so most runs commit nothing) is pure noise.
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changes_detected == 'true'
        run: |
          # Dispatch to each product repo to pick up new icons
          for repo in "tanvrit/friendly" "tanvrit/mandee" "tanvrit/school" "tanvrit/swyft" "tanvrit/desipops" "tanvrit/bharat-bandhu" "tanvrit/wedding" "tanvrit/control"; do
            gh api repos/$repo/dispatches \
              --method POST \
              --field event_type=branding-updated \
              --field client_payload='{"branding_sha":"${{ github.sha }}"}'
          done
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
