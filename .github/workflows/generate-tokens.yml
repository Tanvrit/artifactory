name: Generate Design Tokens

on:
  push:
    paths:
      - 'branding/tokens/base.json'
      - 'branding/tokens/semantic.json'
      - 'branding/tokens/products/**'
      - 'scripts/generate-tokens.js'
    branches: [main]
  workflow_dispatch:

# The "Commit generated outputs" step below pushes the regenerated token files back
# to main. This repo's default workflow permission is READ
# (`actions/permissions/workflow` -> default_workflow_permissions: "read"), so
# git-auto-commit-action's push 403s without this block:
#   fatal: unable to access 'https://github.com/Tanvrit/artifactory/':
#   The requested URL returned error: 403
#   Error: Invalid status code: 128
# — run 35557937492 (2026-09-21), and the same failure is why this workflow has been
# red since its last run on 2026-04-01. update-manifest.yml already carries the
# identical declaration for the identical reason; this is not a new grant, it is the
# missing half of one. Scoped to contents only: nothing here needs packages, issues
# or pull-requests write.
permissions:
  contents: write

# The commit step pushes to main, and the generator stamps a fresh
# "last regenerated <ISO timestamp>" into all four outputs, so EVERY run produces a
# commit. Two overlapping runs therefore race: the second one's checkout is already
# behind by the time it pushes and git-auto-commit-action dies with
#   ! [rejected] main -> main (non-fast-forward)
#   Error: Invalid status code: 1
# (run 35558493593, 2026-09-21, losing to 35558458999). Serialise instead.
# cancel-in-progress stays false: a cancelled run leaves the outputs unregenerated,
# and the queued one regenerates from the newer main anyway.
concurrency:
  group: generate-tokens
  cancel-in-progress: false

jobs:
  tokens:
    name: Generate Platform Token Outputs
    # GitHub-hosted, deliberately. style-dictionary token generation is pure Node with
    # no native, macOS or private-network dependency.
    #
    # This asked for `group: tanvrit` + `[self-hosted, Linux]`, which this repository
    # cannot satisfy — it has ZERO attached self-hosted runners
    # (`GET /repos/Tanvrit/artifactory/actions/runners` → total_count: 0). Unlike
    # Deploy Portal and Export Icons there is no cancelled-at-24h run to point at,
    # only because `branding/tokens/**` has not been touched since the labels were
    # set; the next push to a token source would have queued for 24h and died the
    # same way. Fixed pre-emptively.
    runs-on:
      # Self-hosted: the tanvrit fleet is ten Linux runners, four macOS and one
      # Windows. Retargeted 2026-08-22 from ubuntu-latest — hosted runners are
      # not used anywhere in this org.
      group: tanvrit
      # 2026-09-07 routed this to macOS because every self-hosted Linux runner in
      # the `tanvrit` group was out of disk - jobs died in "Set up JDK 21" with
      # ENOSPC ("Free space left: 0 MB") - and said to revert "once the pool is
      # healthy". It is, so this is that revert, measured rather than assumed:
      #   * tanvrit/sdk "Runner - Health Check" run 35509727991 (2026-09-20 12:07Z,
      #     runner9 / host "Parmar") reports `Disk: /dev/md3 98G 58G 36G 62% /`,
      #     `Free: 35 GB` - well over that workflow's own 15 GB assertion.
      #   * This repo's guard job ran green on [self-hosted, Linux, X64] the same
      #     day in 6 seconds (run 35520640209).
      # The macOS pool, meanwhile, is saturated by the fleet's KMP/iOS release
      # builds, so every macOS-labelled job in this repo has sat QUEUED instead of
      # running - 35520640248 (Deploy Portal) and 35520640265 (Audit) were both
      # still queued an hour after dispatch on 2026-09-20. This job is Node + git
      # over the public internet: no Xcode, no JDK, no signing material, nothing
      # that wants a mac.
      #
      # X64 is pinned, not just `Linux`: the group holds one aarch64 Linux node and
      # an unpinned job has landed on the wrong host before (41da95c).
      labels: [self-hosted, Linux, X64]
    # Token generation is seconds of work. 15 bounds a hang without ever biting.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # Key the cache on the lockfile, not package.json — `npm ci` below refuses to
          # run without scripts/package-lock.json anyway, and hashing package.json
          # misses lock-only dependency changes.
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Generate tokens
        run: node scripts/generate-tokens.js

      - name: Commit generated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(tokens): regenerate platform outputs [skip ci]"
          file_pattern: "branding/tokens/generated/**"
          commit_user_name: "tanvrit-bot"
          commit_user_email: "bot@tanvrit.com"

      - name: Publish @tanvrit/tokens to GitHub Packages
        if: github.ref == 'refs/heads/main'
        run: |
          cd scripts
          VERSION=$(node -e "const t=require('./package.json'); console.log(t.version)")
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
