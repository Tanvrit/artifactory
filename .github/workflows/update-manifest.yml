name: Update Release Manifest

on:
  repository_dispatch:
    types: [update-manifest]
  workflow_dispatch:
    inputs:
      product:
        description: 'Product slug'
        required: true
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
      build:
        description: 'Build number'
        required: true
      released_at:
        description: 'ISO timestamp (defaults to now)'
        required: false
      release_notes:
        description: 'English release notes'
        required: false
      release_notes_hi:
        description: 'Hindi release notes'
        required: false

# The GITHUB_TOKEN default for this repo is read-only
# (`actions/permissions/workflow` → default_workflow_permissions: "read"), so the
# "Commit manifest updates" step below would 403 on `git push` even once a runner
# picks the job up. Request write explicitly rather than relying on the repo default.
permissions:
  contents: write

# Per-OS release templates dispatch `update-manifest` several times within seconds
# (linux-x64 and linux-x64-app back to back, plus macos/windows/android/ios). Those
# runs all commit to `manifests/` and push to main, so serialise them per product.
# cancel-in-progress stays false: every dispatch carries a distinct platform's data
# and dropping one loses that platform's manifest entry.
concurrency:
  group: update-manifest-${{ github.event.client_payload.product || github.event.inputs.product }}
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ github.event.client_payload.product || github.event.inputs.product }} manifest
    # GitHub-hosted, deliberately. This job is Node + git + wrangler over the public
    # internet (github.com, api.cloudflare.com) — it has no macOS/Xcode dependency, no
    # private-network dependency, and no signing material, so nothing here requires the
    # self-hosted pool.
    #
    # It previously asked for `group: tanvrit` + `[self-hosted, Linux]`. This repository
    # has ZERO attached self-hosted runners (`GET /repos/Tanvrit/artifactory/actions/runners`
    # → total_count: 0), so that request could never be satisfied: every run since at
    # least 2026-06-21 sat queued with runner_name:"" until GitHub's 24h queue expiry
    # cancelled it. Never once did this workflow execute a single step, which is why the
    # R2 catalog.json was still the 2026-04-12 copy. That made the whole artifacts CDN
    # catalogue unrefreshable. Do not move this back to the self-hosted pool without
    # first confirming a runner is actually attached AND in the `tanvrit` group.
    runs-on:
      # Self-hosted: the tanvrit fleet is ten Linux runners, four macOS and one
      # Windows. Retargeted 2026-08-22 from ubuntu-latest — hosted runners are
      # not used anywhere in this org.
      group: tanvrit
      labels: [self-hosted, Linux]
    # A job that cannot be scheduled must fail fast and loud, not masquerade as
    # "in progress" for a day. The real work is well under two minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract payload
        id: payload
        run: |
          PRODUCT="${{ github.event.client_payload.product || github.event.inputs.product }}"
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          BUILD="${{ github.event.client_payload.build || github.event.inputs.build }}"
          RELEASED_AT="${{ github.event.client_payload.released_at || github.event.inputs.released_at }}"
          [ -z "$RELEASED_AT" ] && RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_NOTES="${{ github.event.client_payload.release_notes || github.event.inputs.release_notes }}"
          RELEASE_NOTES_HI="${{ github.event.client_payload.release_notes_hi || github.event.inputs.release_notes_hi }}"
          echo "product=$PRODUCT"             >> $GITHUB_OUTPUT
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "build=$BUILD"                 >> $GITHUB_OUTPUT
          echo "released_at=$RELEASED_AT"     >> $GITHUB_OUTPUT
          echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "release_notes_hi=$RELEASE_NOTES_HI" >> $GITHUB_OUTPUT

      - name: Generate manifest, commit and push
        run: |
          set -euo pipefail
          git config user.name "tanvrit-bot"
          git config user.email "bot@tanvrit.com"

          ARGS=(
            --product    "${{ steps.payload.outputs.product }}"
            --version    "${{ steps.payload.outputs.version }}"
            --build      "${{ steps.payload.outputs.build }}"
            --released-at "${{ steps.payload.outputs.released_at }}"
          )
          NOTES="${{ steps.payload.outputs.release_notes }}"
          NOTES_HI="${{ steps.payload.outputs.release_notes_hi }}"
          [ -n "$NOTES" ]    && ARGS+=(--release-notes    "$NOTES")
          [ -n "$NOTES_HI" ] && ARGS+=(--release-notes-hi "$NOTES_HI")

          # Generate → commit → push, retried as a unit. Concurrency serialises this
          # workflow per product, but other products' dispatches (and humans) push to
          # main too, and they all touch manifests/catalog.json.
          #
          # The retry REGENERATES from the new origin/main rather than rebasing the
          # local commit onto it. `git pull --rebase` was tried first and is wrong
          # here: catalog.json and latest.json are machine-generated JSON, so a
          # concurrent release turns the rebase into a content conflict the runner
          # cannot resolve — it left a half-finished rebase and failed the job
          # (observed in run 31728005192). Re-running the generator on top of the
          # newest main is both conflict-free and more correct: the generator reads
          # the current catalog and merges this product's entry into it.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Push rejected — resetting to origin/main and regenerating (attempt ${attempt})."
              git fetch origin main
              git reset --hard origin/main
            fi

            node scripts/update-manifest.js "${ARGS[@]}"
            git add manifests/

            # A re-dispatch of an already-recorded release produces a byte-identical
            # manifest. `git commit` exits 1 on an empty index, which was
            # indistinguishable from a real failure. Nothing to commit is a success.
            if git diff --cached --quiet; then
              echo "No manifest changes — nothing to commit."
              exit 0
            fi

            git commit -m "release: ${{ steps.payload.outputs.product }} v${{ steps.payload.outputs.version }}"

            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
          done
          echo "::error::Could not push manifest update after 3 attempts."
          exit 1

      - name: Upload manifests to Cloudflare R2
        env:
          # This repository has no `CF_R2_TOKEN` / `CF_ACCOUNT_ID` secret — the only
          # Cloudflare credentials attached are CLOUDFLARE_API_TOKEN and
          # CLOUDFLARE_ACCOUNT_ID (verified with `gh secret list`). Referencing the
          # non-existent pair meant wrangler ran unauthenticated. Prefer the R2-specific
          # names if they are ever added, fall back to the ones that actually exist.
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PRODUCT="${{ steps.payload.outputs.product }}"
          VERSION="${{ steps.payload.outputs.version }}"

          export CLOUDFLARE_API_TOKEN="${CF_R2_TOKEN:-${CLOUDFLARE_API_TOKEN_FALLBACK:-}}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID_FALLBACK:-}}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::R2 mirror cannot run — set CF_R2_TOKEN + CF_ACCOUNT_ID (or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID) as REPO-level secrets. The committed manifest is correct but artifacts.tanvrit.com reads from R2, so the CDN would keep serving the previous copy."
            exit 1
          fi

          # Two fixes over the previous version of this step:
          #  1. `--remote`. Wrangler v4 defaults `r2 object put` to LOCAL storage — it
          #     writes into ./.wrangler and exits 0. The upload would have "succeeded"
          #     without a byte reaching the bucket. Verified against wrangler 4.80.0:
          #     `r2 object get tanvrit-artifacts/catalog.json` says "key does not exist",
          #     the same command with --remote returns the real object.
          #  2. Paths. This step used to run with `working-directory: worker`, where
          #     `manifests/` does not exist (there is no worker/manifests). Run from the
          #     repo root instead; `npx wrangler@4` needs no local node_modules, and the
          #     `r2 object` subcommand needs no wrangler config.
          put() {
            npx --yes wrangler@4 r2 object put "$1" \
              --file "$2" \
              --content-type "application/json" \
              --remote
          }

          put "tanvrit-artifacts/manifests/${PRODUCT}/latest.json"        "manifests/${PRODUCT}/latest.json"
          put "tanvrit-artifacts/manifests/${PRODUCT}/${VERSION}.json"    "manifests/${PRODUCT}/${VERSION}.json"
          put "tanvrit-artifacts/catalog.json"                            "manifests/catalog.json"

      - name: Verify R2 objects are actually readable
        env:
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PRODUCT="${{ steps.payload.outputs.product }}"
          export CLOUDFLARE_API_TOKEN="${CF_R2_TOKEN:-${CLOUDFLARE_API_TOKEN_FALLBACK:-}}"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID_FALLBACK:-}}"

          # Read back what we just wrote and assert the version matches. A silent
          # local-storage write (the bug fixed above) cannot pass this.
          npx --yes wrangler@4 r2 object get \
            "tanvrit-artifacts/manifests/${PRODUCT}/latest.json" --remote --pipe > /tmp/r2-latest.json
          node -e '
            const fs = require("fs");
            const want = process.argv[1];
            const got  = JSON.parse(fs.readFileSync("/tmp/r2-latest.json", "utf8"));
            if (got.version !== want) {
              console.error(`::error::R2 latest.json says version ${got.version}, expected ${want}`);
              process.exit(1);
            }
            console.log(`R2 latest.json verified at version ${got.version}`);
          ' "${{ steps.payload.outputs.version }}"
