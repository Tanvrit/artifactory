name: Portable iOS signing
description: Import a job-scoped distribution certificate and provision an app-specific App Store profile through Apple's API.
inputs:
  project:
    required: true
    description: Checked-out Xcode project path.
  scheme:
    required: true
    description: Application scheme.
  configuration:
    default: Release
    description: Xcode configuration.
  bundle-id:
    required: true
    description: Expected application identifier; never overrides the project.
  team-id:
    required: true
    description: Expected Apple team; must agree with APPLE_TEAM_ID when supplied.
  export-method:
    default: app-store
    description: App Store export method.
  upload-testflight:
    default: 'false'
    description: Explicitly upload an internal-only TestFlight build after export.
  upload-appstore:
    default: 'false'
    description: Explicitly upload an App Store-eligible build; does not submit or publish it. Mutually exclusive with upload-testflight.
outputs:
  stage:
    description: Fixed source lifecycle stage; create/enable/upload stages mean attempted, not confirmed external writes.
    value: ${{ steps.sign.outputs.stage }}
  cleanup-stage:
    description: Fixed cleanup failure stage or completed when applicable cleanup code returned; absent output never proves cleanup.
    value: ${{ steps.sign.outputs.cleanup-stage }}
runs:
  using: composite
  steps:
    - name: Sign, export and clean temporary credentials
      id: sign
      shell: bash
      env:
        PORTABLE_IOS_PROJECT: ${{ inputs.project }}
        PORTABLE_IOS_SCHEME: ${{ inputs.scheme }}
        PORTABLE_IOS_CONFIGURATION: ${{ inputs.configuration }}
        PORTABLE_IOS_BUNDLE_ID: ${{ inputs.bundle-id }}
        PORTABLE_IOS_TEAM_ID: ${{ inputs.team-id }}
        PORTABLE_IOS_EXPORT_METHOD: ${{ inputs.export-method }}
        PORTABLE_IOS_UPLOAD_TESTFLIGHT: ${{ inputs.upload-testflight }}
        PORTABLE_IOS_UPLOAD_APPSTORE: ${{ inputs.upload-appstore }}
        PORTABLE_IOS_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$PORTABLE_IOS_ACTION_PATH/sign.py"
