name: Prepare Linux JVM native prerequisites
description: Authenticate and stage Ubuntu 24.04 ARM64 native libraries in the private job directory without host installation.
runs:
  using: composite
  steps:
    - name: Prepare the supported Linux JVM host
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: python3 -B "$ACTION_DIR/prepare.py"
