name: Prepare Linux JVM native prerequisites
description: Install only missing Ubuntu 24.04 ARM64 GL, EGL and JDK AWT runtime packages for offscreen JVM tests.
runs:
  using: composite
  steps:
    - name: Prepare the supported Linux JVM host
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: python3 -B "$ACTION_DIR/prepare.py"
