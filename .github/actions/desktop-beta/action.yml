name: Qualified Jashva desktop beta
description: 'Explicit main-source, native-build and immutable artifact custody; never changes stable release contracts.'
inputs:
  phase:
    required: true
    description: 'verify, qualify (private ARM64 package receipt), retain-private, publish or verify-windows-signature'
  product:
    required: true
  version:
    required: false
  source_commit:
    required: false
  expected_build_code:
    required: false
  platform:
    required: false
  artifact:
    required: false
    description: 'Exact MSI path for strict Jashva signature-only verification'
  appimage_built:
    required: false
    default: 'false'
  publish_artifacts:
    required: false
    default: 'true'
    description: 'retain-private requires explicit false; it never enables public publishing'
outputs:
  release_key:
    description: 'Public-version plus native-build transport identity'
  private_retained:
    description: 'True only after private draft source and all three remote assets are verified'
  private_release_id:
    description: 'Verified private draft release ID'
  private_release_tag:
    description: 'Run/attempt-bound private draft tag'
  private_source_sha:
    description: 'Exact qualified source of the private candidate'
runs:
  using: node24
  main: index.cjs
