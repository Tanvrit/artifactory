name: Per-runner, trust-separated Gradle home
description: >-
  Points GRADLE_USER_HOME at a persistent Gradle home that belongs to THIS
  runner and THIS trust level. Call it as the first step of every job that runs
  Gradle on a self-hosted runner.

  Why per runner: several runners share one OS user on the same host (Parmar:
  runner1..10 as root; the MacBook: two runners; the GX10: eight runners), and
  concurrent Gradle builds sharing one home delete each other's artifact-transform
  entries.

  Why per trust level: a persistent cache written by a pull_request build must
  never be read by a build that ships (default branch, tags, schedules).
  Otherwise a branch can plant a modified dependency or transform in the cache
  and have the next production deploy consume it — CI cache poisoning, flagged
  by the push security review on 2026-09-24. Only code that is already on the
  default branch, a tag, or a schedule (which always runs the default branch)
  gets the "main" namespace. Everything else gets "pr": PR-triggered events,
  and also pushes and manual dispatches on any other branch, because those run
  code that has not landed. Both namespaces start from a copy of the runner's
  gradle.properties with credential lines removed.

outputs:
  home:
    description: The GRADLE_USER_HOME chosen for this job (empty when left unchanged).
    value: ${{ steps.pick.outputs.home }}
  trust:
    description: '"pr" or "main".'
    value: ${{ steps.pick.outputs.trust }}

runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        key=$(printf '%s' "${RUNNER_NAME:-}" | tr -c 'A-Za-z0-9._-' '-')
        if [ -z "$key" ]; then
          echo "::error::RUNNER_NAME is empty; refusing to point every runner at one shared Gradle home."
          exit 1
        fi

        # Anything that can execute code which has not yet landed on the
        # default branch is untrusted. workflow_run and merge_group are treated
        # as untrusted too: both can build code from a pull request. So are a
        # push or a workflow_dispatch on any branch other than the default one.
        case "$EVENT_NAME" in
          pull_request|pull_request_target|pull_request_review|pull_request_review_comment|issue_comment|merge_group|workflow_run)
            trust=pr ;;
          schedule)
            # Scheduled runs always use the default branch's workflow and code.
            trust=main ;;
          *)
            case "$GIT_REF" in
              refs/tags/*) trust=main ;;
              "refs/heads/${DEFAULT_BRANCH:-main}") trust=main ;;
              *) trust=pr ;;
            esac
            ;;
        esac

        # The runner's own home (set in the runner's .env on the GX10), used as
        # the source of non-secret settings such as toolchain install paths.
        runner_home="${GRADLE_USER_HOME:-$HOME/.gradle}"

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            home="/var/lib/vz/ci/gradle-home/$trust/$key"
            if ! { mkdir -p "$home" && touch "$home/.write-probe" && rm -f "$home/.write-probe"; } 2>/dev/null; then
              echo "/var/lib/vz is not writable on this runner; falling back to \$HOME/.gradle-ci"
              home="$HOME/.gradle-ci/$trust/$key"
            fi
            ;;
          Linux/ARM64)
            # GX10: each runner's .env sets its own GRADLE_USER_HOME
            # (…/Runner/rN/gradle-home). Split it by trust level beside it.
            home="${runner_home%/}-$trust"
            ;;
          macOS/*)
            home="$HOME/.gradle-ci/$trust/$key"
            ;;
          *)
            echo "runner=$RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH): no shared-home hazard handled here; GRADLE_USER_HOME unchanged (${GRADLE_USER_HOME:-default})"
            echo "home=" >> "$GITHUB_OUTPUT"
            echo "trust=$trust" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        mkdir -p "$home"

        # One-time dependency seed. Splitting homes by trust level left every
        # runner with two cold homes, and the resulting re-download storm got
        # both egress IPs rate-limited by Maven Central (HTTP 429 on
        # 2026-09-24, across the GX10, the Macs and the X64 host). So the first
        # job in each new home copies the runner's pre-split dependency cache
        # (caches/modules-2) and wrapper distributions, and only goes to the
        # network for what that cache lacks. The seed is the state these builds
        # were already using a day ago, so it does not lower the trust split
        # below where it was; later writes stay per namespace. Lock files are
        # never copied. The .seeded marker makes this happen once per home.
        #
        # X64: the old flat per-runner homes turned out to be nearly empty on
        # some runners (11-13 MB) while /root/.gradle, the shared home every
        # X64 job used for months, holds the real cache. So X64 takes the
        # largest candidate, and a home whose first seed was tiny (< 300 MB,
        # marker v1) is reseeded once (marker .seeded-v2).
        modules_mb() { if [ -d "$1/caches/modules-2" ]; then du -sm "$1/caches/modules-2" 2>/dev/null | cut -f1; else echo 0; fi; }
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            seed_src=""; best=0
            for c in "/var/lib/vz/ci/gradle-home/${RUNNER_NAME:-}" "$HOME/.gradle-ci/${RUNNER_NAME:-}" "$HOME/.gradle"; do
              [ "$c" = "$home" ] && continue
              mb=$(modules_mb "$c"); if [ "${mb:-0}" -gt "$best" ]; then best=$mb; seed_src=$c; fi
            done ;;
          Linux/ARM64) seed_src="${runner_home%/}" ;;
          macOS/*) seed_src="$HOME/.gradle-ci/${RUNNER_NAME:-}" ;;
          *) seed_src="" ;;
        esac
        if [ -f "$home/.seeded" ] && [ ! -f "$home/.seeded-v2" ]; then
          if [ "$(modules_mb "$home")" -lt 300 ] && [ -n "$seed_src" ] && [ "$(modules_mb "$seed_src")" -ge 300 ]; then
            echo "first seed of this home was small ($(cat "$home/.seeded")); reseeding"
            rm -f "$home/.seeded"
          else
            cp "$home/.seeded" "$home/.seeded-v2"
          fi
        fi
        if [ ! -f "$home/.seeded" ]; then
          if [ -n "$seed_src" ] && [ "$seed_src" != "$home" ] && [ -d "$seed_src/caches/modules-2" ]; then
            started=$(date +%s)
            mkdir -p "$home/caches"
            rm -rf "$home/caches/modules-2.seeding"
            if cp -a "$seed_src/caches/modules-2" "$home/caches/modules-2.seeding" 2>/dev/null; then
              find "$home/caches/modules-2.seeding" -name '*.lock' -type f -delete 2>/dev/null || true
              rm -rf "$home/caches/modules-2"
              mv "$home/caches/modules-2.seeding" "$home/caches/modules-2"
              if [ -d "$seed_src/wrapper/dists" ]; then
                mkdir -p "$home/wrapper/dists"
                for d in "$seed_src/wrapper/dists"/*; do
                  [ -d "$d" ] || continue
                  [ -e "$home/wrapper/dists/$(basename "$d")" ] || cp -a "$d" "$home/wrapper/dists/" 2>/dev/null || true
                done
                find "$home/wrapper/dists" -name '*.lck' -type f -delete 2>/dev/null || true
              fi
              echo "seeded from $seed_src $(du -sh "$home/caches/modules-2" 2>/dev/null | cut -f1) in $(( $(date +%s) - started ))s" | tee "$home/.seeded"
              cp "$home/.seeded" "$home/.seeded-v2"
            else
              rm -rf "$home/caches/modules-2.seeding"
              echo "::warning::could not copy the dependency cache from $seed_src; this home starts cold"
              echo "seed copy failed from $seed_src" > "$home/.seeded"
              cp "$home/.seeded" "$home/.seeded-v2"
            fi
          else
            echo "no pre-split dependency cache for ${RUNNER_NAME:-this runner}; this home starts cold" | tee "$home/.seeded"
            cp "$home/.seeded" "$home/.seeded-v2"
          fi
        fi

        # Seed non-secret settings once (e.g. org.gradle.java.installations.paths
        # on the GX10). Credential-looking lines are never copied, so neither
        # namespace carries tokens it does not need (maven.tanvrit.com is public).
        if [ ! -f "$home/gradle.properties" ] && [ -f "$runner_home/gradle.properties" ] && [ "$runner_home" != "$home" ]; then
          grep -viE '^[[:space:]]*[^=#]*(key|token|password|secret|user)[^=]*=' "$runner_home/gradle.properties" > "$home/gradle.properties" || true
          chmod 600 "$home/gradle.properties"
        fi

        # Prefer IPv6 for dependency downloads while it works (TEMPORARY, added
        # 2026-09-24). Maven Central answers this fleet's IPv4 egress with HTTP
        # 429 but still serves IPv6, and JVMs prefer IPv4 by default. The GX10's
        # Wi-Fi IPv6 route has blackholed before, so a 5 s probe decides per
        # job. If IPv6 reaches Maven Central, JAVA_TOOL_OPTIONS carries
        # -Djava.net.preferIPv6Addresses=true for every later step, which
        # reaches the Gradle client, the daemon and forked JVMs even when a
        # workflow passes its own -Dorg.gradle.jvmargs (desipops run
        # 35969334810 did, so a gradle.properties flag was not enough). Every
        # JVM then prints "Picked up JAVA_TOOL_OPTIONS" on stderr. Hosts without
        # an IPv6 route fail the probe and stay on IPv4. Remove this block once
        # the 429s have stopped.
        v6flag='-Djava.net.preferIPv6Addresses=true'
        props="$home/gradle.properties"
        # Undo the gradle.properties variant from #11: one mechanism only.
        if [ -f "$props" ] && grep -q -- "$v6flag" "$props"; then
          sed -i.v6bak -e "s| $v6flag||g" "$props" && rm -f "$props.v6bak"
        fi
        if curl -6 -sS -m 5 -o /dev/null https://repo.maven.apache.org/maven2/ 2>/dev/null; then
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }$v6flag" >> "$GITHUB_ENV"
          echo "IPv6 reaches Maven Central: JVMs in this job prefer IPv6 (JAVA_TOOL_OPTIONS)"
        else
          echo "IPv6 does not reach Maven Central from ${RUNNER_NAME:-this runner}; staying on IPv4"
        fi

        echo "GRADLE_USER_HOME=$home" >> "$GITHUB_ENV"
        echo "home=$home" >> "$GITHUB_OUTPUT"
        echo "trust=$trust" >> "$GITHUB_OUTPUT"
        echo "runner=$RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH) event=$EVENT_NAME ref=${GIT_REF:-?} trust=$trust GRADLE_USER_HOME=$home"
