<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Tanvrit Compute — Distributed Compute Portal App Icon
    Brand: Electric Blue #3B82F6 on Deep Slate #0F172A
    Safe zone: artwork within 880×880 circle centered at 512,512 (radius 440)
    Concept: Interconnected nodes — distributed compute network
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="blue-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background — deep slate -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Connection lines between nodes -->
  <!-- Center to top-left -->
  <line x1="512" y1="512" x2="308" y2="308" stroke="#3B82F6" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <!-- Center to top-right -->
  <line x1="512" y1="512" x2="716" y2="308" stroke="#3B82F6" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <!-- Center to bottom-left -->
  <line x1="512" y1="512" x2="308" y2="716" stroke="#3B82F6" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <!-- Center to bottom-right -->
  <line x1="512" y1="512" x2="716" y2="716" stroke="#3B82F6" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <!-- Top-left to top-right -->
  <line x1="308" y1="308" x2="716" y2="308" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <!-- Bottom-left to bottom-right -->
  <line x1="308" y1="716" x2="716" y2="716" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- Corner nodes -->
  <circle cx="308" cy="308" r="48" fill="#1E3A5F" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="716" cy="308" r="48" fill="#1E3A5F" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="308" cy="716" r="48" fill="#1E3A5F" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="716" cy="716" r="48" fill="#1E3A5F" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>

  <!-- Center node (primary) -->
  <circle cx="512" cy="512" r="80" fill="url(#blue)" filter="url(#glow)"/>

  <!-- Center node inner ring -->
  <circle cx="512" cy="512" r="56" fill="none" stroke="#BAE6FD" stroke-width="6" opacity="0.5"/>

  <!-- Saffron accent line at top -->
  <rect x="400" y="240" width="224" height="8" rx="4" fill="#F59E0B" opacity="0.5"/>
</svg>
